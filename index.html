<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hitchen HQ</title>
<meta name="description" content="Hitchen family work, money and car">
<meta name="theme-color" content="#E6ECEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1522" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hitchen HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Hitchen HQ — drawing-sheet design system.
   Pages open with a title block (the grid in the corner of an engineering drawing) holding that page's live facts.
   One variable family (Archivo) in three widths: expanded for titles and figures, normal for reading, condensed for labels.
   Prussian ink on drafting film; Manx red is reserved for "today" and things that need attention.
   Person colours match the Google Calendar colour rules: Viki Flamingo, Chris Peacock. */
:root{
  --film:#E6ECEA; --sheet:#FAFCFB; --sheet-2:#EEF2F1; --ink:#14263A; --ink-2:#34495E; --muted:#5A6A77;
  --rule:rgba(20,38,58,.13); --rule-2:rgba(20,38,58,.30);
  --red:#C8102E; --red-soft:#F9DEE2;
  --chris:#0A6B9E; --chris-bar:#039BE5; --chris-soft:#DCEFF9;
  --viki:#B4443A; --viki-bar:#E67C73; --viki-soft:#FBE3E0;
  --oc:#3F51B5; --oc-soft:#E2E5F6;
  --gold:#855D00; --gold-bar:#F6BF26; --gold-soft:#FBEFC9;
  --good:#0B7A3E; --good-bar:#33B679; --good-soft:#DAF1E3;
  --bad:#C8102E; --bad-soft:#F9DEE2;
  /* aliases used in inline styles */
  --bg:var(--film); --surface:var(--sheet); --surface-2:var(--sheet-2); --line:var(--rule);
  --accent:var(--ink); --accent-ink:var(--sheet); --accent-soft:var(--sheet-2); --viki-on:var(--viki-bar);
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-frame:5px; --r-panel:12px; --r-ctl:9px; --r-tag:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --film:#0A1522; --sheet:#102033; --sheet-2:#172B43; --ink:#DCE6EE; --ink-2:#B3C3D1; --muted:#8C9FB2;
  --rule:rgba(220,230,238,.11); --rule-2:rgba(220,230,238,.27);
  --red:#FF5468; --red-soft:#3A1520;
  --chris:#5EC2F2; --chris-soft:#0E2D44; --viki:#F4A39B; --viki-soft:#3B1E22; --oc:#A3ACF2; --oc-soft:#1D2452;
  --gold:#F6BF26; --gold-soft:#332809; --good:#4CC38A; --good-soft:#11301F; --bad:#FF5468; --bad-soft:#3A1520;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --film:#0A1522; --sheet:#102033; --sheet-2:#172B43; --ink:#DCE6EE; --ink-2:#B3C3D1; --muted:#8C9FB2;
  --rule:rgba(220,230,238,.11); --rule-2:rgba(220,230,238,.27);
  --red:#FF5468; --red-soft:#3A1520;
  --chris:#5EC2F2; --chris-soft:#0E2D44; --viki:#F4A39B; --viki-soft:#3B1E22; --oc:#A3ACF2; --oc-soft:#1D2452;
  --gold:#F6BF26; --gold-soft:#332809; --good:#4CC38A; --good-soft:#11301F; --bad:#FF5468; --bad-soft:#3A1520;
  color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--film);margin:0}
img{max-width:100%}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--film)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.x-wide{font-stretch:125%;font-weight:800;letter-spacing:-.01em}
.login{max-width:420px;margin:8vh auto 0;width:100%}

/* header and tab bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--film);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-stretch:125%;font-weight:800;font-size:1.5rem;margin:0;letter-spacing:-.015em;line-height:1.1}
.brand small{color:var(--muted);font-size:.82rem;font-stretch:87%}
.iconbtn{border:1px solid var(--rule-2);background:var(--sheet);border-radius:var(--r-ctl);width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule-2);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{position:relative;border:0;background:none;padding:10px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.76rem;font-stretch:87%;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:750}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:26%;right:26%;height:3px;background:var(--red);border-radius:0 0 2px 2px}

/* title block: the signature element */
.tblock{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-frame);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:13px 14px 12px}
.tb-kicker{font-stretch:75%;font-weight:600;font-size:.84rem;color:var(--muted)}
.tb-title{font-stretch:125%;font-weight:800;font-size:1.6rem;line-height:1.05;letter-spacing:-.015em}
.tb-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.tb-side .big{font-stretch:125%;font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.02em}
.tb-cells{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));border-top:1px solid var(--rule-2)}
.tb-cell{padding:9px 12px 11px;border-left:1px solid var(--rule-2);min-width:0;display:flex;flex-direction:column;gap:1px}
.tb-cell:first-child{border-left:0}
.tb-cell .lb{font-stretch:75%;font-weight:600;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tb-cell .lb i{width:8px;height:8px;border-radius:2px;flex:none}
.tb-cell .vl{font-stretch:112%;font-weight:700;font-size:1rem;line-height:1.2;overflow-wrap:anywhere}
.tb-cell .vl small{font-weight:500;font-stretch:100%;color:var(--muted);font-size:.8rem}
.tb-cells.two .tb-cell:nth-child(odd){border-left:0}
.tb-cells.two .tb-cell:nth-child(n+3){border-top:1px solid var(--rule-2)}
.tb-foot{border-top:1px solid var(--rule-2);padding:9px 12px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.86rem;color:var(--ink-2)}
.tb-foot b{color:var(--ink)}
.tb-foot .alert{color:var(--red);font-weight:700}
.tb-bar{padding:0 14px 12px}
@media (max-width:370px){.tb-cells{--n:2!important}.tb-cell:nth-child(3){border-left:0;border-top:1px solid var(--rule-2)}.tb-title{font-size:1.35rem}}

/* panels and headings */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-panel);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-stretch:118%;font-weight:780;font-size:1.06rem;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:-.005em}
.panel h2 .sub{font-stretch:100%;font-weight:500;font-size:.84rem;color:var(--muted)}
.eyebrow{font-stretch:75%;font-weight:650;font-size:.84rem;color:var(--muted)}
.note{font-size:.86rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem;padding:4px 0}
.banner{background:var(--gold-soft);color:var(--ink);border-left:3px solid var(--gold);border-radius:var(--r-tag);padding:10px 12px;font-size:.88rem;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* tabs inside a page */
.seg{display:flex;gap:20px;border-bottom:1px solid var(--rule-2);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:none;padding:10px 0 9px;margin-bottom:-1px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:650;font-size:.96rem}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--red)}
.seg.who{gap:0}
.seg.who button{flex:1;font-stretch:118%;font-weight:780;font-size:1.05rem;padding:11px 0 10px}
.seg.who button[data-who="chris"][aria-pressed="true"]{border-bottom-color:var(--chris-bar);color:var(--chris)}
.seg.who button[data-who="viki"][aria-pressed="true"]{border-bottom-color:var(--viki-bar);color:var(--viki)}
.tsec .seg{border-bottom-color:var(--rule)}

/* figures */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--sheet-2);border-radius:8px;padding:10px 12px;min-width:0}
.stat b{display:block;font-stretch:125%;font-weight:800;font-size:1.35rem;line-height:1.15}
.stat span{font-size:.8rem;color:var(--muted)}
/* gauge: quarter ticks over the track */
.bar{height:8px;background:var(--sheet-2);border-radius:2px;overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--rule-2) calc(25% - 1px) 25%);pointer-events:none}
.bar i{display:block;height:100%;background:var(--ink);border-radius:2px 0 0 2px}
.bar i.over{background:var(--red)} .bar i.good{background:var(--good-bar)}
.bar.lg{height:12px}

/* lists */
.list{display:flex;flex-direction:column}
.row,.rowbtn{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);min-width:0}
.row:first-child,.rowbtn:first-child{border-top:0}
.rowbtn{all:unset;display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);cursor:pointer;min-width:0}
.rowbtn:first-child{border-top:0}
.row .grow,.rowbtn .grow,.grow{flex:1;min-width:0}
.t{font-weight:650;overflow-wrap:anywhere}
.m{font-size:.82rem;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap;font-stretch:112%}
.rowbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-tag);padding:2px 7px;font-size:.76rem;font-weight:650;font-stretch:87%;white-space:nowrap}
.chip.due{background:var(--red-soft);color:var(--red)} .chip.soon{background:var(--gold-soft);color:var(--gold)} .chip.ok{background:var(--good-soft);color:var(--good)}
.chip.cat{background:var(--sheet-2);color:var(--muted)}
.btn{border:0;border-radius:var(--r-ctl);padding:11px 15px;font-weight:680;cursor:pointer;background:var(--ink);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-2)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.small{padding:7px 11px;font-size:.86rem;border-radius:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}

/* month calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-stretch:118%;font-weight:780;font-size:1.06rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.74rem;font-stretch:75%;text-align:center;color:var(--muted);font-weight:650;padding-bottom:2px}
.cal button{aspect-ratio:1/1.08;max-width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;min-width:0}
.cal button .d{font-size:.9rem;font-weight:750;font-stretch:112%}
.cal button .l{font-size:.64rem;line-height:1.1;font-weight:650;font-stretch:87%;text-align:center;overflow:hidden;max-width:100%;white-space:nowrap;text-overflow:ellipsis}
.cal button.today{box-shadow:inset 0 0 0 2px var(--red);border-color:var(--red)}
.cal button.pad{visibility:hidden}
.st-work{background:var(--chris-soft)!important;color:var(--chris)} .st-shift{background:var(--viki-soft)!important;color:var(--viki)}
.st-oncall{background:var(--oc-soft)!important;color:var(--oc)}
.st-callout{background:var(--gold-soft)!important;color:var(--gold)} .st-holiday{background:var(--good-soft)!important;color:var(--good)}
.st-sick{background:var(--bad-soft)!important;color:var(--bad)} .st-off{background:var(--sheet-2)!important;color:var(--muted)}
.fromcal{border-style:dashed!important}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold-bar);display:inline-block}
.moon{color:var(--oc);font-size:.8rem;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .chip{border:1px solid var(--rule)}

/* sheet (forms) */
.scrim{position:fixed;inset:0;background:rgba(8,16,26,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;border-top:1.5px solid var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px}
.sheet h3{font-stretch:125%;font-weight:800;font-size:1.3rem;margin:0;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.84rem;font-stretch:87%;font-weight:650;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--rule-2);background:var(--film);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields3{display:grid;grid-template-columns:1fr 1fr .8fr;gap:8px}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:650;font-size:.88rem}
.choice button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:-2px}
.choice button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.err{color:var(--red);font-size:.86rem}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--rule);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:9px 14px;border-radius:8px;font-weight:700;z-index:50;font-size:.9rem}

/* home */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wcol{border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.wcol .wd{font-size:.72rem;font-stretch:75%;color:var(--muted);font-weight:650}
.wcol .wn{font-stretch:118%;font-size:1.12rem;font-weight:800;line-height:1.15}
.wcol .wbars{display:flex;flex-direction:column;gap:3px;width:100%;padding:3px 5px 0;min-height:34px}
.wcol .wbars i{display:block;height:5px;border-radius:2px}
.wcol .wbars em{font-style:normal;font-size:.6rem;color:var(--muted);font-weight:700;text-align:center;line-height:1}
.wcol.today .wd{color:var(--red)}
.wcol.sel{background:var(--ink);border-color:var(--ink)}
.wcol.sel .wd,.wcol.sel .wn,.wcol.sel .wbars em{color:var(--sheet)}
.wcol.sel.today .wd{color:var(--sheet)}
.agenda{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.evb{display:flex;align-items:center;gap:12px;border-radius:6px;padding:9px 11px;background:color-mix(in srgb,var(--c) 14%,var(--sheet));border-left:4px solid var(--c)}
.evbt{flex:none;width:50px;font-size:.82rem;font-weight:700;font-stretch:87%;color:var(--ink-2)}
.evb .t{font-weight:650}.evb .m{font-size:.8rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-panel);padding:12px 13px 13px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tile .tl{font-size:.84rem;font-stretch:75%;color:var(--muted);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tv{font-stretch:125%;font-size:1.6rem;font-weight:800;line-height:1.1;letter-spacing:-.015em}
.tile .ts{font-size:.8rem;color:var(--muted)}
.tile .bar{margin-top:4px}
.bdate{width:44px;flex:none;text-align:center;border:1px solid var(--rule-2);border-radius:6px;padding:4px 0 3px;line-height:1.05}
.bdate b{display:block;font-stretch:118%;font-weight:800;font-size:1.08rem}
.bdate span{font-size:.7rem;color:var(--muted);font-weight:650;font-stretch:75%}
.bdate.today{border-color:var(--red)} .bdate.today span{color:var(--red)}

/* money */
.mix{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;margin:0 14px 2px}
.mix i{display:block;height:100%}
.mixleg{display:flex;flex-direction:column;border-top:1px solid var(--rule-2);margin-top:12px}
.impsel{margin-top:6px;border:1px solid var(--rule-2);background:var(--film);border-radius:8px;padding:6px 8px;max-width:100%}
.mixleg div{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--rule);min-width:0;font-size:.9rem}
.mixleg div:first-child{border-top:0}
.mixleg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixleg em{font-style:normal;color:var(--muted);font-size:.82rem;width:3.2em;text-align:right}
.mixleg b{font-stretch:112%;min-width:4.6em;text-align:right}
.dgroup{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.dgroup:first-child{border-top:0}
.dgroup .items{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bitem{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0}
.bitem .t{font-weight:600}
.cathead{display:flex;align-items:center;gap:8px;padding:12px 0 4px;border-top:1px solid var(--rule-2);font-stretch:112%;font-weight:750}
.cathead:first-child{border-top:0;padding-top:2px}
.cathead .nm{flex:1}
.cathead em{font-style:normal;font-weight:600;color:var(--muted);font-stretch:100%;font-size:.86rem}
.gauge{display:flex;flex-direction:column;gap:6px;padding:11px 0;border-top:1px solid var(--rule)}
.gauge:first-child{border-top:0}
.gauge .gh{display:flex;align-items:baseline;gap:8px}
.gauge .gh .t{flex:1}
.gauge .gh .amt small{font-weight:500;color:var(--muted);font-stretch:100%}
.insight{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--rule);align-items:flex-start}
.insight:first-child{border-top:0}
.insight i{width:4px;align-self:stretch;border-radius:2px;flex:none}

/* family calendar settings */
.colrow{display:flex;align-items:center;gap:8px}
.colrow input,.colrow select{border:1px solid var(--rule-2);background:var(--film);border-radius:8px;padding:9px 10px;min-width:0}
.colrow input{flex:1}
.colrow .sw{width:16px;height:16px;border-radius:50%}
.rules{display:flex;flex-direction:column;gap:6px}

/* Viki: payslip, week strip, timesheet */
.vslip .stack{display:flex;height:10px;border-radius:2px;overflow:hidden;gap:2px;margin:0 14px}
.vslip .stack i{display:block;height:100%}
.vslip details{border-top:1px solid var(--rule-2);margin-top:12px;padding:10px 14px 12px;font-size:.88rem}
.vslip summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
.vslip dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:10px 0 4px}
.vslip dd{margin:0;text-align:right;font-weight:650}
.vslip dl .tot{font-weight:800;border-top:1px solid var(--rule-2);padding-top:5px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week button{border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.week .wd{font-size:.72rem;font-stretch:75%;color:var(--muted);font-weight:650}
.week .wn{font-size:1rem;font-weight:800;font-stretch:112%}
.week .wh{font-size:.7rem;font-weight:700;min-height:1em;font-stretch:87%}
.week button.today{box-shadow:inset 0 0 0 2px var(--red);border-color:var(--red)}
.tbl{overflow-x:auto;margin:0 -14px;padding:0 14px}
.tbl table{border-collapse:collapse;font-size:.82rem;min-width:480px;width:100%}
.tbl th{font-size:.74rem;font-stretch:75%;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1.5px solid var(--ink);white-space:nowrap;font-weight:650}
.tbl th.grp{text-align:center;border-bottom:1px solid var(--rule-2);font-stretch:100%;font-weight:700;color:var(--ink-2)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tfoot td{font-weight:800;border-bottom:0;border-top:1.5px solid var(--ink)}
.tbl .co-col{background:color-mix(in srgb,var(--gold-bar) 12%,transparent)}
.tbl tr[data-act]{cursor:pointer}
.tsec{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tsec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tsec-h b{font-stretch:118%;font-weight:780;font-size:1.02rem}
.pill{border-radius:var(--r-tag);padding:3px 8px;font-size:.82rem;font-weight:700;background:var(--sheet-2);white-space:nowrap}
.pill.v{background:var(--viki-soft);color:var(--viki)} .pill.a{background:var(--oc-soft);color:var(--oc)} .pill.g{background:var(--gold-soft);color:var(--gold)}
.out{border:1px dashed var(--rule-2);border-radius:8px;padding:10px 11px;font-weight:700;text-align:center}
.co{background:var(--sheet-2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.co .fields3 .field input,.co .field input{background:var(--sheet)}
.co-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.86rem;font-weight:700}
.co-top .x{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:0 4px}
.multbtn{border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold);border-radius:var(--r-tag);padding:3px 9px;font-weight:700;font-size:.8rem;cursor:pointer}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
.vsum{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--ink);border-radius:var(--r-frame);padding:10px 12px;font-weight:700}
.vsum b{font-stretch:125%;font-weight:800;font-size:1.3rem}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule-2);border:1px solid var(--rule-2);border-radius:var(--r-frame);overflow:hidden}
.rate{background:var(--sheet);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rate .rl{font-size:.82rem;font-stretch:75%;color:var(--muted);font-weight:650}
.rate .rv{font-stretch:118%;font-size:1.25rem;font-weight:800}
.rate .rs{font-size:.78rem;color:var(--muted)}

/* badges, icons, live state */
.pb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:.66rem;font-weight:800;font-stretch:100%;color:#fff;flex:none;line-height:1}
.pb-viki{background:var(--viki-bar)} .pb-chris{background:var(--chris-bar)} .pb-pay{background:var(--gold-bar);color:#3A2A00}
.tb-cell .lb .pb{width:16px;height:16px;font-size:.6rem}
.tb-cell .vl small.sub,.tb-cell .vl .sub{display:block;font-size:.8rem;font-weight:500;font-stretch:100%;color:var(--muted);margin-top:1px}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good-bar);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px color-mix(in srgb,var(--good-bar) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){.livedot{animation:live 2s ease-in-out infinite}@keyframes live{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--good-bar) 0%,transparent)}}}
.ic{width:18px;height:18px;flex:none;display:block}
.evi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 22%,var(--sheet));color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.evb{border-left:0!important;padding:8px 10px!important;background:color-mix(in srgb,var(--c) 9%,var(--sheet))!important}
.evb .t{line-height:1.25}
.hint{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.hint .ic{width:16px;height:16px}
/* quieter surfaces: the title block is the only framed element */
.panel{border-color:transparent}
.tile{border-color:transparent}
.tile .tl{display:flex;align-items:center;gap:6px}
/* loading placeholders */
.skel{height:56px;border-radius:10px;background:linear-gradient(90deg,var(--sheet) 0%,var(--sheet-2) 40%,var(--sheet) 80%);background-size:200% 100%}
.skel.tall{height:170px;border-radius:var(--r-frame)}
@media (prefers-reduced-motion:no-preference){.skel{animation:shim 1.3s linear infinite}@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}}
/* quick add, pull to refresh, sheet handle */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;width:54px;height:54px;border-radius:16px;border:0;background:var(--ink);color:var(--sheet);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(8,16,26,.28)}
.fab svg{width:24px;height:24px}
.qi{width:36px;height:36px;border-radius:10px;background:var(--sheet-2);display:grid;place-items:center;flex:none}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;transition:height .15s ease}
.ptr span{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--rule-2);border-top-color:var(--ink)}
.ptr.ready span{border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.ptr.busy span{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--rule-2);margin:-6px auto 2px;flex:none}
.sheet{transition:transform .2s ease}
/* lists */
.listadd{display:flex;gap:8px}
.listadd input{flex:1;min-width:0;border:1px solid var(--rule-2);background:var(--film);border-radius:8px;padding:10px 11px}
.check .grow{flex:1}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{stroke:var(--rule-2);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:10px;font-stretch:87%;font-weight:600}
.chart .val{fill:var(--ink-2);font-size:10.5px;font-weight:700}
.chart .pace{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.chart .line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .line.over{stroke:var(--red)}
.chart .pt{fill:var(--ink);stroke:var(--sheet);stroke-width:2}
.chart .pt.over{fill:var(--red)}
.cleg{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2)}
.cleg span{display:inline-flex;align-items:center;gap:6px}
.cleg i{width:10px;height:10px;border-radius:2px}
:root{--c-oc:#3F51B5;--c-co:#C98A00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-oc:#6F7DE0;--c-co:#B5850C}}
:root[data-theme="dark"]{--c-oc:#6F7DE0;--c-co:#B5850C}

.linkbtn{all:unset;cursor:pointer;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2)}
.linkbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.panel h2 .btnrow{gap:6px}
.btn .ic{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:4px}
#printRoot{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body>*:not(#printRoot){display:none!important}
  body::before{display:none}
  html,body{background:#fff}
  #printRoot{display:block;color:#000;font-family:var(--font)}
  .pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .pr-k{font-size:10pt}
  .pr h1{font-stretch:125%;font-weight:800;font-size:20pt;margin:0}
  .pr-meta{display:flex;gap:24px}.pr-meta div{display:flex;flex-direction:column;font-size:10pt}.pr-meta b{font-size:12pt}
  .pr table{width:100%;border-collapse:collapse;font-size:10pt}
  .pr th,.pr td{border:1px solid #000;padding:5px 6px;text-align:left}
  .pr th{background:#eee;font-weight:700}
  .pr tfoot td{font-weight:800}
  .pr-sign{display:flex;gap:30px;margin-top:28px}.pr-sign div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:10pt}
}
@media (max-width:380px){.fields2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
(() => {
'use strict';
/* ---------- utilities ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const ymOf = s => String(s).slice(0,7);
const today = () => ymd(new Date());
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const addMonths = (s,n) => { const d=parse(s); const day=d.getDate(); const t=new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return ymd(t); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const isWeekend = s => { const w=parse(s).getDay(); return w===0||w===6; };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthName = ym => { const [y,m]=ym.split('-').map(Number); return `${MONTHS[m-1]} ${y}`; };
const shortDate = s => { if(!/^\d{4}-\d\d-\d\d$/.test(String(s))) return esc(s||''); const d=parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; };
const money = (n, dp) => { const v=Number(n)||0; const d = dp ?? (Math.abs(v)%1 ? 2 : 0); return (v<0?'−£':'£') + Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d}); };

const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- state ---------- */
const S = { settings:{}, days:{}, bills:[], goals:[], spend:[], budget:{cats:[]}, car:{}, service:[], fuel:[], checks:{done:{}}, trip:{done:{}}, cal:{feeds:[]}, list:[], debts:[], trips:[], carrem:[], payslips:[], files:[], loaded:0 };

const userName = () => { const u = session && session.user; if (!u) return ''; return (u.user_metadata && u.user_metadata.username) || (u.email||'').split('@')[0]; };

/* ---------- static definitions ---------- */
const DEFAULT_RATES = { base:0, ot15:0, ot2:0, bh:0, oncallWD:0, oncallWE:0, secondWD:0, secondWE:0 };

/* ---------- data layer ---------- */
const COLL = { bills:'bills', goals:'goals', spend:'spend', service:'service', fuel:'fuel', list:'list', debts:'debts', trips:'trips', carrem:'carrem', payslips:'payslips', files:'files' };
function applyLocal(path, data) {
  const [c, id] = path.split('/');
  if (c === 'days') { if (data) S.days[id] = data; else delete S.days[id]; }
  else if (COLL[c]) { const arr = S[c]; const i = arr.findIndex(x => x.id === id); if (!data) { if (i>=0) arr.splice(i,1); } else if (i>=0) arr[i] = {...data, id}; else arr.push({...data, id}); }

/* Every record is one row in the `docs` table: path (e.g. "bills/b_rent") plus its JSON data. */
const CACHE_KEY = 'hhq-cache-v1';
let cacheTimer;
function resetState() {

function snapshotRows() {
  const rows = [];

  Object.entries(S.days).forEach(([id,d]) => rows.push([`days/${id}`, d]));
  Object.keys(COLL).forEach(c => S[c].forEach(({id, ...d}) => rows.push([`${c}/${id}`, d])));

}

}

async function loadAll() {

let channel = null;
function subscribe() {
  if (channel) sb.removeChannel(channel);

    .on('postgres_changes', { event:'*', schema:'public', table:'docs' }, p => {

function nextDue(b) {

}

function leaveYear() {
  const startMM = Number(S.settings.leaveStart || 1); const t = parse(today());
  let y = t.getFullYear(); if (t.getMonth()+1 < startMM) y--;
  const from = `${y}-${pad(startMM)}-01`; return { from, to: addDays(addMonths(from,12),-1) };
}
function daysFor(who, from, to) {
  const m = {};
  Object.values(CAL.days || {}).forEach(d => { if (d.who===who && d.date>=from && d.date<=to) m[d.date] = d; });
  Object.values(S.days).forEach(d => { if (d.who===who && d.date>=from && d.date<=to) m[d.date] = d; });

function checkStatus(c) {
  const rec = (S.checks.done||{})[c.id];
  if (!rec) return { cls:'due', label:'Not logged yet', next:null };
  const next = addDays(rec.date, c.days); const left = daysBetween(today(), next);

}

/* Rota entries in the calendar: "V: 8-6", "V: on call", "V: AL", "V: sick", "V: DO", "C: 8-5" */
function parseRota(title) {
  const m = /^\s*(VH|V|C)\s*[:\-]\s*/i.exec(String(title||'')); if (!m) return null;
  const who = m[1].toUpperCase()==='C' ? 'chris' : 'viki', t = title.slice(m[0].length).trim();
  if (/on\s*-?\s*call/i.test(t)) return { who, kind:'oncall' };
  if (/\bAL\b|annual leave|holiday/i.test(t)) { const h = /(\d+(?:\.\d+)?)\s*h?\s*$/i.exec(t); return { who, kind:'holiday', hours: h ? Number(h[1]) : null }; }

  if (/\bR?DO\b|day off|pay\s*back|toil/i.test(t)) return { who, kind:'off', note:t };
  const x = /(\d{1,2})(?:[:.](\d{2}))?\s*-\s*(\d{1,2})(?:[:.](\d{2}))?/.exec(t);
  if (x) { const sh = +x[1], sm = +(x[2]||0); let eh = +x[3]; const em = +(x[4]||0);
    if (eh*60+em <= sh*60+sm && eh < 12) eh += 12;
    return { who, kind:'shift', start:`${pad(sh)}:${pad(sm)}`, end:`${pad(eh%24)}:${pad(em)}`, note: /\bOT\b/i.test(t) ? 'Overtime' : '' }; }
  return null;
}

    const d = out[key] || (out[key] = { who:r.who, date, fromCal:true });

  }));

}

/* count-up for the headline figures, once per session */
let countedUp = false;
function runCountUp() {
  if (countedUp) return; countedUp = true;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const target = Number(el.dataset.count)||0, start = performance.now(), dur = 750;
    const step = now => { const p = Math.min(1, (now-start)/dur), e = 1 - Math.pow(1-p, 3); el.textContent = money(target*e, 0); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* charts (SVG, thin marks, labelled) */
function barChart(rows, opts={}) {
  // rows: [{label, parts:[{v, c, name}], total, sub}]
  const W = 320, H = 150, padB = 22, padT = 18, n = rows.length, gap = 10, bw = Math.min(34, (W - gap*(n+1))/n);
  const max = Math.max(1, ...rows.map(r => r.parts.reduce((s,p)=>s+p.v,0)));
  const x0 = (W - (n*bw + (n-1)*gap))/2;
  let g = `<line x1="0" y1="${H-padB}" x2="${W}" y2="${H-padB}" class="axis"/>`;
  rows.forEach((r,i) => {
    const x = x0 + i*(bw+gap); let y = H - padB; const tot = r.parts.reduce((s,p)=>s+p.v,0);
    r.parts.forEach((p,j) => { const h = (H-padB-padT) * p.v / max; if (h <= 0) return; y -= h; const top = j===r.parts.length-1 || r.parts.slice(j+1).every(q => !q.v);
      g += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,h - (top?0:2))}" rx="${top?3:0}" fill="${p.c}"><title>${esc(r.label)}: ${esc(p.name)} ${money(p.v,0)}</title></rect>`; });
    g += `<text x="${x+bw/2}" y="${H-6}" class="lbl" text-anchor="middle">${esc(r.label)}</text>`;
    if (tot) g += `<text x="${x+bw/2}" y="${y-5}" class="val" text-anchor="middle">${opts.fmt ? opts.fmt(tot) : money(tot,0)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Chart')}">${g}</svg>`;
}
function paceChart(ym, limit, items) {
  const first = parse(`${ym}-01`), dim = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const W = 320, H = 130, padL = 4, padR = 4, padT = 14, padB = 20;
  const daily = Array(dim).fill(0); items.forEach(x => { const d = parse(x.date).getDate(); daily[d-1] += Number(x.amount)||0; });
  const isNow = ym===ymOf(today()), upto = isNow ? parse(today()).getDate() : (ym < ymOf(today()) ? dim : 0);
  let run = 0; const cum = daily.map(v => run += v);
  const max = Math.max(limit, cum[dim-1] || 0, 1);
  const X = d => padL + (W-padL-padR) * (d/dim), Y = v => H - padB - (H-padB-padT) * v / max;
  let pts = `${X(0)},${Y(0)}`; for (let d=1; d<=upto; d++) pts += ` ${X(d)},${Y(cum[d-1])}`;
  const over = upto && cum[upto-1] > limit * upto/dim;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending so far against an even pace through the month">
    <line x1="${X(0)}" y1="${H-padB}" x2="${X(dim)}" y2="${H-padB}" class="axis"/>
    ${limit ? `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(dim)}" y2="${Y(limit)}" class="pace"/><text x="${X(dim)}" y="${Y(limit)-5}" class="lbl" text-anchor="end">Budget ${money(limit,0)}</text>` : ''}
    ${upto ? `<polyline points="${pts}" class="line${over?' over':''}"/><circle cx="${X(upto)}" cy="${Y(cum[upto-1])}" r="4" class="pt${over?' over':''}"/><text x="${Math.min(X(upto)+7, W-60)}" y="${Y(cum[upto-1])+4}" class="val">${money(cum[upto-1],0)}</text>` : ''}
    <text x="${X(0)}" y="${H-5}" class="lbl">1</text><text x="${X(dim)}" y="${H-5}" class="lbl" text-anchor="end">${dim}</text>
  </svg>`;
}

const vk = () => ({...VIKI_DEFAULT, ...(S.settings.viki||{})});
const BANK_HOLS = new Set(['2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-05-25','2026-06-05','2026-07-05','2026-07-06','2026-08-31','2026-12-25','2026-12-26','2026-12-28',
  '2027-01-01','2027-03-26','2027-03-29','2027-05-03','2027-05-31','2027-06-11','2027-07-05','2027-08-30','2027-12-25','2027-12-26','2027-12-27','2027-12-28']);

const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(String(t||'')); return m ? Number(m[1])*60 + Number(m[2]) : null; };

function shiftHours(d) { if (d.status!=='shift' || !d.start || !d.end) return 0; return Math.max(0, span(d.start, d.end) - (Number(d.lunch ?? 30))/60); }

function vikiMonth(ym) {

const ck = () => ({ net:0, standby:0, perCallout:0, extraTax:31, ...(S.settings.chris||{}) });
function chrisExtras(ym) {
  const r = ck(), days = daysFor('chris', `${ym}-01`, `${ym}-31`);
  const shifts = days.filter(d => d.status==='callout').length, calls = days.reduce((s,d) => s + (Number(d.callouts)||0), 0);
  const gross = shifts * r.standby + calls * r.perCallout;
  return { shifts, calls, gross, net: gross * (1 - r.extraTax/100) };
}
function moneyIn(ym) {
  // pay landing in month ym: salaries plus extras worked the month before
  const r = vk(), c = ck(), prev = ymOf(addMonths(`${ym}-01`,-1));
  const vm = vikiMonth(r.arrears ? prev : ym), vSlip = slipFor(vm), vReal = S.payslips.find(x => x.id===ym);
  const vNet = r.salary ? (vReal ? vReal.net : vSlip.net + slipAdjust().adj) : 0;
  const ce = chrisExtras(prev);
  const others = (S.settings.income || []).filter(x => x.amount);
  const items = [
    { who:'chris', name:'Chris take-home', amount: c.net, note: c.net ? `${esc(dayShort(payday(ym)))}` : 'Add in Plan' },
    ...(ce.net ? [{ who:'chris', name:'Chris call-outs', amount: ce.net, note:`${ce.shifts} shift${ce.shifts===1?'':'s'}, ${ce.calls} call-out${ce.calls===1?'':'s'}, after tax (estimate)` }] : []),
    { who:'viki', name: vReal ? 'Viki take-home' : 'Viki take-home (estimate)', amount: vNet, note: r.salary ? esc(dayShort(payday(ym))) : 'Add her rates in Work' },
    ...others.map(x => ({ who:'', name:x.name, amount:Number(x.amount)||0, note:'Every month' })),
  ];
  return { items, total: items.reduce((s,x) => s + (Number(x.amount)||0), 0) };
}
function planFor(ym) {
  const inc = moneyIn(ym), bills = S.bills.reduce((s,b)=>s+perMonth(b),0), budget = (S.budget.cats||[]).reduce((s,c)=>s+(Number(c.limit)||0),0);
  const owed = S.debts.reduce((s,d) => s + (Number(d.monthly)||0), 0) - S.debts.filter(d => S.bills.some(b => b.name.toLowerCase()===String(d.name).toLowerCase())).reduce((s,d)=>s+(Number(d.monthly)||0),0);
  const save = Number((S.settings.plan||{}).save) || 0, trips = S.trips.reduce((s,t) => s + (Number(t.monthly)||0), 0);
  const left = inc.total - bills - budget - owed - save - trips;
  return { inc, bills, budget, owed, save, trips, left };
}

function insights() {
  const out = [];

  const bnpl = S.bills.filter(b => /zilch|klarna|clearpay|paypal pay/i.test(b.name));
  const bnplSpend = S.spend.filter(x => x.zilch && ymOf(x.date)===ymOf(today())).reduce((s,x)=>s+(Number(x.amount)||0),0);
  if (bnpl.length || bnplSpend) out.push(`Buy-now-pay-later: ${bnplSpend ? `${money(bnplSpend)} of this month's spending went on Zilch. ` : ''}Every pound on Zilch is taken from next month's money.`);
  const finance = S.bills.filter(b => /finance|loan|car|bike/i.test(b.category||''));
  const finTotal = finance.reduce((s,b)=>s+perMonth(b),0);
  if (finance.length) out.push(`Vehicles and finance cost ${money(finTotal,0)} a month across ${finance.length} payments.`);
  const ym = ymOf(today()); const cats = S.budget.cats||[];
  cats.forEach(c => { const s = S.spend.filter(x=>x.cat===c.name && ymOf(x.date)===ym).reduce((a,x)=>a+(Number(x.amount)||0),0); if (c.limit && s > c.limit) out.push(`${c.name} is over budget this month by ${money(s-c.limit)}.`); });
  S.goals.forEach(g => { if (g.deadline && g.target) { const months=Math.max(1,Math.ceil(daysBetween(today(),g.deadline)/30.4)); const need=(g.target-(Number(g.saved)||0))/months; if (need>0) out.push(`${g.name}: put aside ${money(need,0)} a month to reach ${money(g.target,0)} by ${shortDate(g.deadline)}.`); } });
  const vExtra = daysFor('viki', `${ym}-01`, `${ym}-31`).reduce((s,d)=>s+vikiPay(d,d.date),0);
  if (vExtra > 0) out.push(`Viki has earned ${money(vExtra,0)} gross in overtime and on-call this month. Sending overtime straight to savings protects you when it drops.`);
  return out;
}

const CAR_SUGGEST = [['Insurance renewal','Shop around a month before'],['Vehicle duty (road tax)',''],['Breakdown cover renewal','Needs European cover for Paris'],['Timing chain replacement','Quoted at the specialist']];
function carRemStatus(c) {
  const n = c.date ? daysBetween(today(), c.date) : null, left = c.miles && S.car.mileage ? Number(c.miles) - Number(S.car.mileage) : null;
  const due = (n!==null && n <= 0) || (left!==null && left <= 0), soon = (n!==null && n <= 30) || (left!==null && left <= 1000);
  const bits = []; if (n!==null) bits.push(n<0 ? `${-n} days overdue` : n===0 ? 'today' : `in ${n} days, ${shortDate(c.date)}`); if (left!==null) bits.push(left <= 0 ? 'mileage reached' : `in ${left.toLocaleString('en-GB')} miles`);
  return { cls: due ? 'due' : soon ? 'soon' : 'ok', text: bits.join(' or ') || 'No date set', n, left };
}

/* ----- documents: stored privately, kept on the phone once opened ----- */
const FILE_CACHE = 'hhq-files-v1';
async function fileBlob(f) {
  try { const c = await caches.open(FILE_CACHE); const hit = await c.match(`/hhq-file/${f.path}`); if (hit) return await hit.blob(); } catch(e) {}
  const { data, error } = await sb.storage.from('family-files').download(f.path); if (error) throw error;
  try { const c = await caches.open(FILE_CACHE); await c.put(`/hhq-file/${f.path}`, new Response(data, { headers: { 'Content-Type': f.type || 'application/octet-stream' } })); f._cached = true; } catch(e) {}
  return data;
}
async function cachedPaths() { try { const c = await caches.open(FILE_CACHE); return new Set((await c.keys()).map(r => decodeURIComponent(new URL(r.url).pathname.replace('/hhq-file/','')))); } catch(e) { return new Set(); } }
function docsPanel(group) {
  const list = S.files.filter(f => (f.group||'car')===group).sort((a,b) => (a.name||'').localeCompare(b.name||''));
  setTimeout(async () => { const have = await cachedPaths(); list.forEach(f => { const el = document.querySelector(`[data-doc="${CSS.escape(f.id)}"] .m`); if (el && have.has(f.path)) el.textContent = `${el.textContent.split('.')[0]}. Saved on this phone`; }); }, 0);
  return `<section class="panel"><h2>Documents <label class="btn small" style="display:inline-flex;align-items:center;gap:4px">${icon('plus')}Add<input type="file" id="docUpload" data-group="${group}" accept="image/*,application/pdf" hidden></label></h2>
    ${list.length ? `<div class="list">${list.map(f => `<button class="rowbtn" data-act="docopen" data-id="${esc(f.id)}" data-doc="${esc(f.id)}"><span class="qi">${icon('doc')}</span><div class="grow"><div class="t">${esc(f.name)}</div><div class="m">${esc((f.type||'').includes('pdf') ? 'PDF' : 'Photo')}, ${Math.max(1, Math.round((f.size||0)/1024))} KB</div></div></button>`).join('')}</div>
      <div class="btnrow"><button class="btn small ghost" data-act="docsave" data-group="${group}">Save all to this phone for offline</button></div>`
      : `<p class="empty">Keep the insurance certificate, logbook and breakdown cover details here. Once opened, they're saved on the phone, so they work abroad without signal.</p>`}
  </section>`;
}
async function uploadDoc(file, group) {
  if (!file) return; if (file.size > 20*1024*1024) { toast('That file is over 20 MB'); return; }
  const name = prompt('Name this document', file.name.replace(/\.[^.]+$/, '')) || file.name;
  const id = uid('fi'), path = `${group}/${id}-${file.name.replace(/[^\w.\-]+/g,'_')}`;
  toast('Uploading…');
  const { error } = await sb.storage.from('family-files').upload(path, file, { contentType: file.type, upsert: false });
  if (error) { toast('Upload failed. Try again'); return; }
  await put(`files/${id}`, { name, path, type: file.type, size: file.size, group, by: me(), at: Date.now() });
  toast('Saved');
}
async function openDoc(id) {
  const f = S.files.find(x => x.id===id); if (!f) return;
  let url; try { url = URL.createObjectURL(await fileBlob(f)); } catch(e) { toast(navigator.onLine ? 'Couldn\'t open that file' : 'Not saved on this phone yet, and you\'re offline'); return; }
  const isImg = (f.type||'').startsWith('image/');
  openSheet(f.name, isImg ? `<img src="${url}" alt="${esc(f.name)}" style="width:100%;border-radius:8px">` : `<iframe src="${url}" title="${esc(f.name)}" style="width:100%;height:60vh;border:1px solid var(--rule);border-radius:8px"></iframe><div class="btnrow"><a class="btn small ghost" href="${url}" target="_blank" rel="noopener">Open full screen</a></div>`,
    null, { noSave:true, onDelete: async () => { await sb.storage.from('family-files').remove([f.path]); try { (await caches.open(FILE_CACHE)).delete(`/hhq-file/${f.path}`); } catch(e) {} await remove(`files/${f.id}`); } });
  // allow delete from the viewer
  const row = $('#sheetForm .btnrow:last-child'); if (row) row.insertAdjacentHTML('beforeend', '<button class="btn danger" type="button" data-act="delete">Delete</button>');
}
async function saveDocsOffline(group) { let n = 0; for (const f of S.files.filter(x => (x.group||'car')===group)) { try { await fileBlob(f); n++; } catch(e) {} } toast(`${n} document${n===1?'':'s'} saved on this phone`); render(); }

/* ----- running costs ----- */
function carCosts() {
  const fills = S.fuel.slice().sort((a,b) => (Number(a.mileage)||0) - (Number(b.mileage)||0));
  const fuelCost = fills.reduce((s,f)=>s+(Number(f.cost)||0),0), miles = fills.length > 1 ? Number(fills[fills.length-1].mileage) - Number(fills[0].mileage) : 0;
  const since = fills.length ? fills[0].date : null;
  const serviceCost = S.service.filter(x => x.status!=='booked' && x.cost && (!since || (x.date||'') >= since)).reduce((s,x)=>s+(Number(x.cost)||0),0);
  return { fuelCost, serviceCost, miles, ppm: miles > 0 ? (fuelCost + serviceCost) / miles : null, fuelPpm: miles > 0 ? fuelCost / miles : null };
}
function fuelChart() {
  const ym = ymOf(today()), months = []; for (let i=5;i>=0;i--) months.push(ymOf(addMonths(`${ym}-01`, -i)));
  const rows = months.map(x => ({ label: MONTHS[parse(`${x}-01`).getMonth()].slice(0,3), parts: [{ v: S.fuel.filter(f => ymOf(f.date)===x).reduce((s,f)=>s+(Number(f.cost)||0),0), c:'var(--c-co)', name:'Fuel' }] }));
  if (!rows.some(r => r.parts[0].v)) return '';
  return `<section class="panel"><h2>Fuel by month</h2>${barChart(rows, { label:'Fuel spending by month' })}</section>`;
}

let sheetSave = null;
function openSheet(title, inner, onSave, opts={}) {
  sheetSave = onSave;
  $('#sheetRoot').innerHTML = `<div class="scrim" data-act="close"><form class="sheet" id="sheetForm" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>

  </form></div>`;
  sheetDrag();
  sheetDelete = opts.onDelete || null;
  const first = opts.noFocus ? null : $('#sheetForm input:not([type=checkbox]), #sheetForm select, #sheetForm textarea'); if (first && !('ontouchstart' in window)) setTimeout(()=>first.focus({preventScroll:true}), 30);

let sheetDelete = null;
function sheetDrag() {
  const sh = $('#sheetForm'); if (!sh) return; let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive:true });
  sh.addEventListener('touchmove', e => { if (y0===null) return; dy = e.touches[0].clientY - y0; if (dy > 0 && sh.scrollTop <= 0) sh.style.transform = `translateY(${dy}px)`; }, { passive:true });

const b64u = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const swReady = () => Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('sw')), 4000))]);
async function pushSub() { if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null; const reg = await swReady(); return reg.pushManager.getSubscription(); }
async function pushPanel() {
  const box = $('#pushBox'); if (!box) return;
  if (!('PushManager' in window) || !('Notification' in window)) { box.innerHTML = `<p class="note">${/iphone|ipad/i.test(navigator.userAgent) && !isStandalone() ? 'To get notifications on an iPhone, add Hitchen HQ to your Home Screen (Share, then Add to Home Screen) and open it from there.' : 'This browser can\'t show notifications.'}</p>`; return; }
  let sub = null; try { sub = await pushSub(); } catch(e) { box.innerHTML = '<p class="note">Notifications aren\'t ready yet. Close the app fully, open it again and come back here.</p>'; return; }
  let row = null; if (sub) { const { data } = await sb.from('push_subs').select('prefs').eq('endpoint', sub.endpoint).maybeSingle(); row = data; }

async function pushOn() {
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifications weren\'t allowed'); return pushPanel(); }

  const el = e.target;
  if (el.id === 'docUpload') { await uploadDoc(el.files[0], el.dataset.group); el.value = ''; return; }
  if (el.dataset.act === 'pushpref') { await pushPref(el.dataset.k, el.checked); return; }
  if (el.dataset.act === 'listtick') { const x = S.list.find(i => i.id===el.dataset.id); if (x) await put(`list/${x.id}`, {...x, id:undefined, done: el.checked}); return; }
  if (el.dataset.act !== 'trip') return;
  const done = {...(S.trip.done||{})}; if (el.checked) done[el.dataset.id] = true; else delete done[el.dataset.id];
  await put('state/trip', { done });
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'authForm') { e.preventDefault(); return handleAuth(e.target); }
  if (e.target.id === 'listAdd') { e.preventDefault(); const i = $('#listText'); const text = (i.value||'').trim(); if (!text) return; i.value = ''; await put(`list/${uid('l')}`, { text, list: UI.list||'shopping', done:false, by: me(), at: Date.now() }); setTimeout(() => { const n = $('#listText'); if (n) n.focus(); }, 30); return; }
  if (e.target.id !== 'sheetForm') return; e.preventDefault();
  const fn = sheetSave; if (!fn) return;
  const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
  try { await fn(); closeSheet(); toast('Saved'); } catch (err) { formErr(err.message || 'Couldn\'t save that'); btn.disabled = false; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheetRoot').innerHTML) closeSheet(); });

/* ---------- boot ---------- */
async function boot() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#app').innerHTML = '<div class="panel"><p class="empty">Couldn\'t load the app. Check your connection and reopen it.</p></div>'; return;
  }
  if (CAL.calendars && CAL.calendars.length) { try { deriveDays(); } catch(e) {} }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  const { data } = await sb.auth.getSession();
  await startSession(data.session);
  sb.auth.onAuthStateChange((event, s) => { if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') startSession(s); else session = s || session; });
  window.addEventListener('online', () => { if (session && offline) loadAll().then(subscribe).catch(() => {}); });
  setInterval(() => { if (session && UI.tab==='home' && !$('#sheetRoot').innerHTML && document.visibilityState==='visible' && !(document.activeElement && document.activeElement.id==='listText')) render(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && session) { fetchCal(); render(); } });
  let py = null, pd = 0; const ptr = $('#ptr');
  window.addEventListener('touchstart', e => { if (window.scrollY <= 0 && !$('#sheetRoot').innerHTML) { py = e.touches[0].clientY; pd = 0; } }, { passive:true });
  window.addEventListener('touchmove', e => { if (py===null) return; pd = Math.max(0, e.touches[0].clientY - py); ptr.style.height = Math.min(70, pd*0.5) + 'px'; ptr.classList.toggle('ready', pd > 120); }, { passive:true });
  window.addEventListener('touchend', async () => { if (py===null) return; const go = pd > 120; py = null; ptr.style.height = '0px'; ptr.classList.remove('ready');
    if (go && session) { ptr.classList.add('busy'); ptr.style.height = '36px'; try { await loadAll(); await fetchCal(true); toast('Up to date'); } catch(e) { toast('Couldn\'t refresh. Check your signal'); } ptr.classList.remove('busy'); ptr.style.height = '0px'; } });
}
boot();
})();
</script>

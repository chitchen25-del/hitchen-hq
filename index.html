/* birthdays in the family calendar, next 12 months */
function calBirthdays() {
  const t = today(), out = [], seen = new Set();
  (CAL.calendars || []).forEach(c => (c.events || []).forEach(e => {
    if (!/birthday|bday/i.test(e.title || '')) return; const d = evDate(e); if (d < t) return;
    const name = String(e.title).replace(/\(.*?\)/g, '').replace(/\b(19|20)\d\d\b/g, '').replace(/['’]s\b/g, '').replace(/birthday|bday|🎈|🎉|🎂/ig, '').replace(/[^\p{L}\s'-]/gu, '').replace(/\s+/g, ' ').trim();
    if (!name || seen.has(name.toLowerCase())) return; seen.add(name.toLowerCase()); out.push({ name, d });
  }));
  const have = new Set((S.plans || []).filter(p => p.kind === 'birthday').map(p => `${xName(String(p.name).replace(/['’]s birthday.*$/i, '')).toLowerCase()}|${p.from}`));
  return out.filter(b => !have.has(`${b.name.toLowerCase()}|${b.d}`)).sort((a, b) => a.d < b.d ? -1 : 1);
}
function bdayForm(name = '', date = '') {
  openSheet('Add a birthday', fld('bdN', 'Whose birthday', name, 'text', 'placeholder="Name"') + fld('bdD', 'Date', date, 'date') +
    `<div class="fields2">${fld('bdA', 'Presents (£)', '', 'number', 'step="1" min="0" inputmode="decimal" placeholder="e.g. 150"')}${fld('bdP', 'Party or day out (£)', '', 'number', 'step="1" min="0" inputmode="decimal" placeholder="Optional"')}</div>
    <p class="note">The app saves a little each month until the day, and counts it in each month's Budget Sheet.</p>`, async () => {
    const n = v('bdN').trim(), d = v('bdD'), a = num(v('bdA')) || 0, party = num(v('bdP')) || 0; if (!n) throw new Error('Say whose birthday it is'); if (!d) throw new Error('Pick the date');
    let ym = payYm(d); const cur = plCur(); if (ym < cur) ym = cur;
    const items = [{ id: uid('pi'), n: `Presents for ${n}`, a, how: 'save', ym, cat: 'gift', via: 'card' }];
    if (party > 0) items.push({ id: uid('pi'), n: 'Party or day out', a: party, how: 'save', ym, cat: 'fun', via: 'card' });
    const id = uid('pl'); UI.pltab = 'christmas'; UI.occ = id; keepUI();
    await put(`plans/${id}`, { kind: 'birthday', name: `${n}'s birthday`, from: d, saveFrom: cur, items });
  });
}

/* what each person got last time */
function giftHistory(p, it) {
  const who = xName(it.n).toLowerCase();
  return (S.plans || []).filter(q => isGift(q) && q.id !== p.id && (q.from || '') < (p.from || '9')).sort((a, b) => (a.from || '') < (b.from || '') ? 1 : -1)
    .map(q => { const m = (q.items || []).find(x => xName(x.n).toLowerCase() === who); return m && giftsOf(m).length ? { q, m } : null; }).filter(Boolean).slice(0, 2);
}

/* after the day: how it went, and next year's budgets from it */
function giftReview(p) {
  const items = p.items || [], gifts = items.flatMap(giftsOf), end = p.to || p.from, t = today();
  if (!gifts.length || !((end && t > end) || gifts.every(g => g.got))) return '';
  const rows = items.map(it => ({ it, name: xIsPerson(it) ? xName(it.n) : it.n, bud: Number(it.a) || 0, act: giftSpent(it) })).filter(r => r.bud || r.act);
  const tb = rows.reduce((s, r) => s + r.bud, 0), ta = rows.reduce((s, r) => s + r.act, 0), peak = Math.max(1, ...rows.map(r => Math.max(r.bud, r.act)));
  const next = p.kind === 'christmas' ? (S.plans || []).filter(q => q.kind === 'christmas' && (q.from || '') > (p.from || '')).sort((a, b) => a.from < b.from ? -1 : 1)[0] : null;
  const months = next ? Math.max(1, ymDiff(next.saveFrom || plCur(), payYm(next.from)) + 1) : 0, sugg = Math.ceil(ta / 50) * 50;
  return `<section class="panel"><h2>How it went <span class="sub ${ta <= tb ? 'good' : 'find'}">${ta <= tb ? `${m2(tb - ta)} under budget` : `${m2(ta - tb)} over budget`}</span></h2>
    <div class="rv-leg"><span><i class="rv-b"></i>Budget</span><span><i class="rv-a"></i>Spent</span></div>
    <div class="rv-rows">${rows.map(r => `<div class="rv-r"><span class="rv-n">${esc(r.name)}</span><div class="rv-bars"><i class="rv-b" style="width:${r.bud / peak * 100}%"></i><i class="rv-a ${r.act > r.bud + .5 ? 'over' : ''}" style="width:${r.act / peak * 100}%"></i></div><b>${m2(r.act)}</b></div>`).join('')}</div>
    <p class="note">${m2(ta)} spent of ${m2(tb)} planned.${next ? ` Spending the same next time is about ${money(sugg,0)}, which is ${money(sugg / months, 0)} a month over ${months} months.` : ''}</p>
    ${next ? `<div class="btnrow"><button class="btn small" data-act="xnext" data-plan="${esc(p.id)}" data-next="${esc(next.id)}">Set ${esc(occName(next))} from this</button></div>` : ''}</section>`;
}
async function xApplyNext(fromId, nextId) {
  const p = (S.plans || []).find(x => x.id === fromId), q = (S.plans || []).find(x => x.id === nextId); if (!p || !q) return;
  const tpl = (q.items || [])[0] || { how: 'save', ym: payYm(q.from), cat: 'gift', via: 'card' }, items = [...(q.items || [])];
  (p.items || []).forEach(it => { const act = giftSpent(it); if (!act) return; const a = Math.ceil(act / 5) * 5, i = items.findIndex(x => xName(x.n).toLowerCase() === xName(it.n).toLowerCase());
    if (i >= 0) items[i] = { ...items[i], a }; else items.push({ id: uid('pi'), n: it.n, a, how: tpl.how, ym: tpl.ym, from: tpl.from, cat: itemCat(it), via: 'card' }); });
  const { id, ...rest } = q; await put(`plans/${q.id}`, { ...rest, items }); toast(`${occName(q)} budgets updated`);
}

/* wish lists: wish/main = { lists: { key: { name, items:[{id,n,link,at,taken}] } } } */
const wishKey = n => String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const wishList = n => ((S.wish && S.wish.lists) || {})[wishKey(n)] || { name: n, items: [] };
async function saveWish(name, items) { const lists = { ...((S.wish && S.wish.lists) || {}) }; lists[wishKey(name)] = { name, items }; await put('wish/main', { lists }); }
function wishKids(p) {
  const people = (p.items || []).filter(xIsPerson), top = Math.max(0, ...people.map(i => Number(i.a) || 0));
  const kids = people.filter(i => top && (Number(i.a) || 0) >= top * .8).map(i => xName(i.n));
  Object.values((S.wish && S.wish.lists) || {}).forEach(l => { if (l.items.length && !kids.some(k => wishKey(k) === wishKey(l.name))) kids.push(l.name); });
  return kids;
}
function wishPanel(p) {
  if (p.kind !== 'christmas' || (p.from && p.from < today())) return '';
  const kids = wishKids(p); if (!kids.length) return '';
  return `<section class="panel nopad">${headCard({ tone: 'night', kicker: 'Wish lists', title: 'Let the girls add their wishes', meta: `<span>Hand them the phone. They see only their own wishes, with no prices and nothing about what you've bought.</span>`,
    actions: kids.map(k => { const n = wishList(k).items.length; return hcBtn(`${esc(k)}${n ? ` · ${n}` : ''}`, 'kidmode', `data-name="${esc(k)}"`); }).join('') })}</section>`;
}
function viewKid() {
  const name = UI.kid, l = wishList(name), xm = (S.plans || []).filter(p => p.kind === 'christmas' && p.from >= today()).sort((a, b) => a.from < b.from ? -1 : 1)[0];
  const n = xm ? sleepsN(xm.from) : null, stars = Array.from({ length: 18 }, (_, i) => `<i style="left:${(i * 53) % 100}%;top:${(i * 37) % 100}%;animation-delay:${(i % 6) * .4}s"></i>`).join('');
  return `<section class="kid"><div class="kid-hero"><div class="kid-stars">${stars}</div><div class="kid-k">✨ Wish list</div><div class="kid-t">${esc(name)}'s wishes</div>${n !== null && n >= 0 ? `<div class="kid-s">${n === 0 ? 'It\'s Christmas!' : `${n} sleep${n === 1 ? '' : 's'} till Christmas`} 🎄</div>` : ''}</div>
    <form class="kidadd" autocomplete="off"><input name="n" aria-label="Your wish" placeholder="What would you love?" enterkeyhint="done"><input name="link" aria-label="Link, if you have one" placeholder="Link to it (if you have one)" inputmode="url"><button class="btn" type="submit">Add my wish 🎁</button></form>
    <div class="kid-list">${l.items.length ? l.items.map((w, i) => `<div class="kw" style="--d:${i * .04}s"><span class="kw-star">${['⭐','🌟','💫','✨'][i % 4]}</span><div class="grow"><b>${esc(w.n)}</b>${w.link ? `<a href="${esc(/^https?:/i.test(w.link) ? w.link : 'https://' + w.link)}" target="_blank" rel="noopener">See it</a>` : ''}</div><button type="button" class="kw-del" data-act="kwdel" data-id="${esc(w.id)}" aria-label="Remove ${esc(w.n)}">✕</button></div>`).join('') : `<p class="kid-empty">Nothing here yet. Add your first wish!</p>`}</div>
    <button type="button" class="kid-exit" data-hold="kidexit">Grown-ups: press and hold to finish</button></section>`;
}
async function kidAdd(form) {
  const n = (form.n.value || '').trim(); if (!n) { form.n.focus(); return; } const link = (form.link.value || '').trim(), l = wishList(UI.kid);
  form.n.value = ''; form.link.value = ''; const w = { id: uid('w'), n, at: today() }; if (link) w.link = link;
  await saveWish(UI.kid, [...l.items, w]); setTimeout(() => { const i = document.querySelector('form.kidadd input[name=n]'); if (i) i.focus(); }, 60);

async function wishToGift(planId, itemId, name, wid) {
  const l = wishList(name), w = l.items.find(x => x.id === wid); if (!w) return; const gid = uid('g');
  await xSaveItem(planId, itemId, it => ({ ...it, gifts: [...giftsOf(it), { id: gid, n: w.n, a: 0, ...(w.link ? { note: w.link } : {}) }] }));
  await saveWish(name, l.items.map(x => x.id === wid ? { ...x, taken: gid } : x)); toast('Added to the list. Tap it to add the price');
}

/* occasion picker for Christmas and birthdays */
function occasionView(list) {
  const t = today(), sorted = list.slice().sort((a, b) => (a.from || '9') < (b.from || '9') ? -1 : 1);
  const sel = sorted.find(p => p.id === UI.occ) || sorted.find(p => (p.to || p.from || '9') >= t) || sorted[sorted.length - 1];
  const bdays = calBirthdays().slice(0, 8);
  const row = `<div class="occ-row" role="group" aria-label="Which occasion">${sorted.map(p => `<button type="button" class="occ k-${p.kind} ${sel && p.id === sel.id ? 'on' : ''}" data-act="occ" data-id="${esc(p.id)}" aria-pressed="${!!(sel && p.id === sel.id)}"><span class="occ-i">${OCC_ICON[p.kind]}</span><b>${esc(occName(p).replace(/['’]s birthday$/i, ''))}${p.kind === 'christmas' ? ` <small>${esc((p.from || '').slice(0, 4))}</small>` : ''}</b><small>${esc(sleepsTxt(p.from) || 'No date')}</small></button>`).join('')}<button type="button" class="occ add" data-act="bday"><span class="occ-i">＋</span><b>Birthday</b><small>Add one</small></button></div>`;
  const sugg = bdays.length ? `<section class="panel"><h2>Birthdays coming up <span class="sub">from your calendar</span></h2><div class="zchips">${bdays.map(b => `<button type="button" data-act="bday" data-name="${esc(b.name)}" data-date="${b.d}">🎈 ${esc(b.name)} · ${esc(shortDate(b.d).replace(/ \d{4}$/, ''))}</button>`).join('')}</div><p class="note">Tap one to give it a budget. It saves a little each month until the day.</p></section>` : '';
  return row + (sel ? plPanel(sel) + giftReview(sel) : `<section class="panel"><p class="empty">Nothing planned yet.</p></section>`) + sugg;
}

/* packing list: plan.pack = [{id,n,g,done}] */
const PACK_GROUPS = ['Documents', 'Car', 'Grown-ups', 'Kids', 'Extras'];
const isFrance = p => /france|paris|calais|disney|dover/i.test([p.name, ...(p.items || []).map(i => i.n), ...(p.days || []).map(d => d.t + ' ' + (d.places || []).join(' '))].join(' '));
function packSeed(p) {
  const L = [], add = (g, arr) => arr.forEach(n => L.push({ id: uid('pk'), n, g }));
  const fr = isFrance(p);
  add('Documents', ['Passports', 'Driving licences', ...(fr ? ['International Driving Permit'] : []), 'Car registration document (original)', 'Car insurance certificate', 'Breakdown cover details', 'Travel insurance', 'Hotel bookings', 'Ferry tickets']);
  if (/disney/i.test(p.name)) add('Documents', ['Disney park tickets']);
  if (!fr) add('Car', ['Phone holder and car charger', 'Snacks and water', 'Blankets and pillows']);
  add('Grown-ups', ['Warm coats, hats and gloves', 'Comfy walking shoes', 'Clothes for each night', 'Toiletries', 'Medicines and paracetamol', 'Phone chargers and a power bank', 'Bank cards and the Revolut card']);
  add('Kids', ['Warm coats, hats and gloves', 'Waterproof ponchos', 'Comfy walking shoes', 'Pyjamas', 'Headphones', 'Tablets, charged', 'Favourite teddy']);
  if (/disney/i.test(p.name)) add('Kids', ['Autograph book and pen']);
  return L;
}
function packPanel(p) {
  if (isGift(p) || p.kind === 'year' || !p.from || (p.to || p.from) < today()) return '';
  const n = sleepsN(p.from), pk = p.pack || [], done = pk.filter(x => x.done).length, open = UI.packOpen ? UI.packOpen === p.id : n <= 14;
  if (!pk.length) return `<section class="panel nopad">${headCard({ tone: 'sea', kicker: n <= 7 ? 'A week to go' : 'Packing', title: n <= 7 ? 'Time to start packing' : 'Packing list', meta: `<span>${isFrance(p) ? 'Ready-made for driving in France: documents, the car kit, and lists for grown-ups and kids.' : 'Ready-made lists for documents, the car, grown-ups and kids.'} Change anything you like.</span>`, actions: hcBtn('Start the packing list', 'packseed', `data-plan="${esc(p.id)}"`) })}</section>`;
  const groups = [...PACK_GROUPS, ...new Set(pk.map(x => x.g).filter(g => !PACK_GROUPS.includes(g)))].map(g => [g, pk.filter(x => x.g === g)]).filter(([, l]) => l.length);
  return `<section class="panel nopad pack">${headCard({ tone: 'sea', kicker: n <= 7 && n >= 0 ? (n <= 1 ? 'Last night at home' : 'A week to go') : 'Packing', title: done === pk.length ? 'All packed!' : `${done} of ${pk.length} packed`,
    body: `<div class="hc-prog"><i style="width:${Math.round(done / pk.length * 100)}%"></i></div>`, actions: hcBtn(open ? 'Hide the list' : 'Show the list', 'packopen', `data-plan="${esc(p.id)}"`) })}
    ${open ? `<div class="pk-wrap">${isFrance(p) ? (() => { const all = TRIP.flatMap(g => g.items), d = all.filter(([id]) => (S.trip.done || {})[id]).length; return `<button type="button" class="pk-car" data-act="tab" data-v="car" data-seg="trip"><span>🚗</span><div class="grow"><b>France car checklist</b><small>GBM sticker, permit, vests, beam adjusters and more · ${d} of ${all.length} done</small></div><em>Open</em></button>`; })() : ''}${groups.map(([g, l]) => `<div class="pk-g"><div class="pk-h">${esc(g)}<span>${l.filter(x => x.done).length}/${l.length}</span></div>${l.map(x => `<div class="pk ${x.done ? 'done' : ''}"><button type="button" class="st-tick" data-act="packtick" data-plan="${esc(p.id)}" data-id="${esc(x.id)}" aria-pressed="${!!x.done}" aria-label="${x.done ? 'Packed' : 'Mark packed'}: ${esc(x.n)}">${x.done ? stepIcon('clear') : ''}</button><button type="button" class="pk-n" data-act="packedit" data-plan="${esc(p.id)}" data-id="${esc(x.id)}">${esc(x.n)}</button></div>`).join('')}</div>`).join('')}
      <form class="packadd" data-plan="${esc(p.id)}" autocomplete="off"><input name="n" aria-label="Something to pack" placeholder="Add something"><select name="g" aria-label="Which list">${[...new Set([...PACK_GROUPS, ...pk.map(x => x.g)])].map(g => `<option>${esc(g)}</option>`).join('')}</select><button class="btn small" type="submit">Add</button></form></div>` : ''}</section>`;
}
async function packSave(planId, fn) { const p = (S.plans || []).find(x => x.id === planId); if (!p) return; const { id, ...rest } = p; await put(`plans/${planId}`, { ...rest, pack: fn(p.pack || [], p) }); }
function packEditForm(planId, id) {
  const p = (S.plans || []).find(x => x.id === planId), x = p && (p.pack || []).find(y => y.id === id); if (!x) return;
  openSheet(x.n, fld('pkN', 'What', x.n) + sel('pkG', 'Which list', x.g, [...new Set([...PACK_GROUPS, ...(p.pack || []).map(y => y.g)])].map(g => [g, g])), async () => {
    const n = v('pkN').trim(); if (!n) throw new Error('Say what it is'); await packSave(planId, pk => pk.map(y => y.id === id ? { ...y, n, g: v('pkG') } : y));
  }, { onDelete: () => packSave(planId, pk => pk.filter(y => y.id !== id)) });
}

/* on the day: today's plan, weather, euros left, tonight's bed */
const WX = {};
const wxTown = pl => { if (/disney/i.test(pl)) return 'Chessy'; const parts = String(pl).split(',').map(s => s.trim()).filter(Boolean); let s = parts.length > 1 ? parts[parts.length - 1] : parts[0] || ''; return s.replace(/\b\d{4,5}\b/g, '').replace(/premier inn|port of|hotel|crowne plaza|travelodge/ig, '').trim() || s; };
const WXI = c => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️' : c <= 77 ? '🌨️' : c <= 82 ? '🌦️' : c <= 86 ? '🌨️' : '⛈️';
function wxFetch(town, date) {
  const k = `${town}|${date}`; if (WX[k]) return WX[k] === 'busy' ? null : WX[k]; WX[k] = 'busy';
  (async () => { try {
    const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&name=${encodeURIComponent(town)}`)).json(), loc = g.results && g.results[0]; if (!loc) throw 0;
    const f = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${date}&end_date=${date}`)).json();
    const d = f.daily; WX[k] = { town: loc.name, code: d.weather_code[0], hi: Math.round(d.temperature_2m_max[0]), lo: Math.round(d.temperature_2m_min[0]), rain: d.precipitation_probability_max[0] }; schedule();
  } catch (e) { WX[k] = { none: true }; } })();
  return null;
}
function tripEuroToday(p) {
  const gbp = (p.items || []).filter(it => it.how !== 'zilch' && itemVia(it) === 'revolut').reduce((s, it) => s + (Number(it.a) || 0), 0); if (!gbp) return null;
  const rate = Number(p.rate) || 1.19, eur = gbp * rate, spent = (p.spend || []).reduce((s, x) => s + (Number(x.a) || 0), 0), fr = (p.days || []).filter(d => /calais|france|disney/i.test(d.t + ' ' + (d.places || []).join(' '))).map(d => d.d).sort();
  const from = fr[0] || p.from, to = fr[fr.length - 1] || p.to || from, t = today(); if (!(t >= from && t <= to)) return null;
  const days = Math.max(1, daysBetween(from, to) + 1); return Math.round(eur / days * (daysBetween(from, t) + 1) - spent);
}
function onTheDay(p) {
  const t = today(); if (isGift(p) || !p.from || t < p.from || t > (p.to || p.from)) return '';
  const day = (p.days || []).find(d => d.d === t), n = daysBetween(p.from, t) + 1, places = day ? day.places || [] : [];
  const bed = places.filter(x => /inn|hotel|plaza|lodge|travelodge|airbnb|cottage/i.test(x)).pop(), wxPlace = bed || places[places.length - 1] || p.name;
  const w = wxFetch(wxTown(wxPlace), t), eur = tripEuroToday(p);
  const tiles = [
    w && !w.none ? `<div class="od-t"><span>${WXI(w.code)}</span><b>${w.hi}° <small>/ ${w.lo}°</small></b><em>${esc(w.town)}${w.rain >= 40 ? ` · ${w.rain}% rain` : ''}</em></div>` : `<div class="od-t"><span>⛅</span><b>${w && w.none ? '–' : '…'}</b><em>${w && w.none ? 'No forecast' : 'Weather'}</em></div>`,
    eur !== null ? `<div class="od-t"><span>💶</span><b>€${Math.max(0, eur)}</b><em>${eur >= 0 ? 'to spend today' : `€${-eur} over, easy tomorrow`}</em></div>` : '',
    bed ? `<a class="od-t" href="${mapsLink(bed)}" target="_blank" rel="noopener"><span>🛏️</span><b>Tonight</b><em>${esc(bed.split(',')[0])}</em></a>` : '',
  ].filter(Boolean).join('');
  const park = day && /disney/i.test(day.t + places.join(' ')) ? `<a class="hc-btn" href="https://www.disneylandparis.com/en-gb/calendar/" target="_blank" rel="noopener">Park hours</a>` : '';
  return `<section class="panel nopad">${headCard({ tone: 'magic', kicker: `Day ${n} · ${DOWS[parse(t).getDay()]} ${parse(t).getDate()} ${MONTHS[parse(t).getMonth()]}`, title: day ? esc(day.t) : 'Have the best day', meta: day && day.n ? `<span>${esc(day.n)}</span>` : '',
    body: `<div class="od-tiles">${tiles}</div>`, actions: [places.length ? places.map(x => `<a class="hc-btn" href="${mapsLink(x)}" target="_blank" rel="noopener">${esc(x.split(',')[0])}</a>`).join('') : '', park, eur !== null ? hcBtn('Log spending', 'tspend', `data-plan="${esc(p.id)}"`) : ''].join('') })}</section>`;
}

/* payday check-in: bsheet/<ym>.ci = { inc, jobs, done } */
function checkinCard() {
  const cur = plCur(), pd = payday(cur), t = today(), doc = S.bsheet[cur]; if (!doc || t < pd || daysBetween(pd, t) > 6) return '';
  const ci = doc.ci || {}; if (ci.done) return '';
  const tot = bsTotals(doc, cur), inc = (doc.inc || []).filter(bsOn).map(x => ({ n: String(x.n || '').replace(/['’]s? wages|\s*wages/i, '').trim() || x.n, a: Number(x.a) || 0 }));
  if (doc.viki && !doc.viki.off) inc.push({ n: 'Viki', a: tot.viki });
  const jobs = []; (S.plans || []).filter(p => !isGift(p)).forEach(p => tripSteps(p).forEach(g => { if (g.ym === cur) g.steps.forEach(s => { if (s.kind === 'do') jobs.push({ p, s }); }); }));

/* ===== Viki's pay forecast from the rota and her logged call-outs ===== */
function coHistory() {
  const cur = claimYM(today()), t = today(); let n = 0, h = 0, h2 = 0, ocPay = 0; const months = new Set();
  for (let i = 1; i <= 6; i++) { const ym = ymAdd(cur, -i), m = vikiMonth(ym); m.days.forEach(d => { if (!d.oncall || d.oncall.kind === 'second' || d.date >= t) return; const x = vikiDay(d); n++; h += x.h15 + x.h2; h2 += x.h2; ocPay += x.oc; months.add(ym); }); }
  return { perOc: n ? h / n : 6, r2: h ? h2 / h : .5, ocPay: n ? ocPay / n : 250, perMonth: months.size ? n / months.size : 3.3, n };
}
function rotaEnd() { let e = ''; Object.values(CAL.days || {}).forEach(d => { if (d.who === 'viki' && d.date > e) e = d.date; }); Object.values(S.days).forEach(d => { if (d.who === 'viki' && d.date > e) e = d.date; }); return e; }
function vikiForecast(payYM) {
  const r = vk(), doc = S.bsheet[payYM]; if (!doc || !doc.viki) return null;
  const claim = r.arrears ? ymAdd(payYM, -1) : payYM, cr = claimRange(claim), t = today();
  const real = S.payslips.find(x => x.id === payYM); if (real && real.net) return { net: real.net, real: true, claim };
  const m = vikiMonth(claim), hist = coHistory(), end = rotaEnd(), isWE = d => isWeekend(d.date) || d.bh || isBH(d.date);
  let wd = 0, we = 0, h15 = m.h15, h2 = m.h2, known = 0, future = 0, addH = 0;
  m.days.forEach(d => { if (!d.oncall || d.oncall.kind === 'second') return; known++; if (isWE(d)) we++; else wd++; if (d.date >= t) future++;
    if (d.date >= t && !(d.callouts||[]).length) { addH += hist.perOc; h15 += hist.perOc * (1 - hist.r2); h2 += hist.perOc * hist.r2; } });
  const gapFrom = end && end > cr.from ? end : (cr.from > t ? cr.from : t), gapDays = Math.max(0, daysBetween(gapFrom, cr.to)), span = Math.max(1, daysBetween(cr.from, cr.to) + 1);
  const guessOc = cr.to > end ? Math.round(hist.perMonth * Math.min(1, gapDays / span)) : 0;
  if (guessOc) { const gwe = Math.round(guessOc * .4); we += gwe; wd += guessOc - gwe; addH += guessOc * hist.perOc; h15 += guessOc * hist.perOc * (1 - hist.r2); h2 += guessOc * hist.perOc * hist.r2; }
  const q = { wd, we, h15: Math.round(h15 * 2) / 2, h2: Math.round(h2 * 2) / 2 };
  const map = [[/weekday/i, q.wd], [/weekend/i, q.we], [/^1\.5/i, q.h15], [/double/i, q.h2]];
  const items = (doc.viki.items||[]).map(i => { const hit = map.find(([re]) => re.test(i.n) && !/2nd/i.test(i.n)); return hit ? { ...i, q: hit[1] } : { ...i, q: /2nd|bh/i.test(i.n) ? 0 : i.q }; });
  const vdoc = { ...doc, viki: { ...doc.viki, mode: 'calc', items } };
  return { net: bsViki(vdoc, payYM), items, known, future, guessOc, addH: Math.round(addH), loggedH: Math.round(m.h15 + m.h2), claim, end, real: false };
}
function forecastPanel() {

function insights() {

  const bnpl = S.bills.filter(b => /zilch|klarna|clearpay|paypal pay/i.test(b.name));
  const bnplSpend = S.spend.filter(x => x.zilch && ymOf(x.date)===ymOf(today())).reduce((s,x)=>s+(Number(x.amount)||0),0);
  if (bnpl.length || bnplSpend) out.push(`Buy-now-pay-later: ${bnplSpend ? `${money(bnplSpend)} of this month's spending went on Zilch. ` : ''}Every pound on Zilch is taken from next month's money.`);
  const finance = S.bills.filter(b => /finance|loan|car|bike/i.test(b.category||''));
  const finTotal = finance.reduce((s,b)=>s+perMonth(b),0);
  if (finance.length) out.push(`Vehicles and finance cost ${money(finTotal,0)} a month across ${finance.length} payments.`);
  const ym = ymOf(today()); const cats = S.budget.cats||[];
  cats.forEach(c => { const s = S.spend.filter(x=>x.cat===c.name && ymOf(x.date)===ym).reduce((a,x)=>a+(Number(x.amount)||0),0); if (c.limit && s > c.limit) out.push(`${c.name} is over budget this month by ${money(s-c.limit)}.`); });
  S.goals.forEach(g => { if (g.deadline && g.target) { const months=Math.max(1,Math.ceil(daysBetween(today(),g.deadline)/30.4)); const need=(g.target-(Number(g.saved)||0))/months; if (need>0) out.push(`${g.name}: put aside ${money(need,0)} a month to reach ${money(g.target,0)} by ${shortDate(g.deadline)}.`); } });

  return out;
}

/* ----- documents: stored privately, kept on the phone once opened ----- */
const FILE_CACHE = 'hhq-files-v1';
async function fileBlob(f) {
  try { const c = await caches.open(FILE_CACHE); const hit = await c.match(`/hhq-file/${f.path}`); if (hit) return await hit.blob(); } catch(e) {}
  const { data, error } = await sb.storage.from('family-files').download(f.path); if (error) throw error;
  try { const c = await caches.open(FILE_CACHE); await c.put(`/hhq-file/${f.path}`, new Response(data, { headers: { 'Content-Type': f.type || 'application/octet-stream' } })); f._cached = true; } catch(e) {}
  return data;
}
async function cachedPaths() { try { const c = await caches.open(FILE_CACHE); return new Set((await c.keys()).map(r => decodeURIComponent(new URL(r.url).pathname.replace('/hhq-file/','')))); } catch(e) { return new Set(); } }
function docsPanel(group, emptyText, title) {
  const list = S.files.filter(f => (f.group||'car')===group).sort((a,b) => (a.name||'').localeCompare(b.name||''));
  setTimeout(async () => { const have = await cachedPaths(); list.forEach(f => { const el = document.querySelector(`[data-doc="${CSS.escape(f.id)}"] .m`); if (el && have.has(f.path)) el.textContent = `${el.textContent.split('.')[0]}. Saved on this phone`; }); }, 0);
  return `<section class="panel"><h2>${esc(title || 'Documents')} <label class="btn small" style="display:inline-flex;align-items:center;gap:4px">${icon('plus')}Add<input type="file" id="docUpload" data-group="${group}" accept="image/*,application/pdf" hidden></label></h2>
    ${list.length ? `<div class="list">${list.map(f => `<button class="rowbtn" data-act="docopen" data-id="${esc(f.id)}" data-doc="${esc(f.id)}"><span class="qi">${icon('doc')}</span><div class="grow"><div class="t">${esc(f.name)}</div><div class="m">${esc((f.type||'').includes('pdf') ? 'PDF' : 'Photo')}, ${Math.max(1, Math.round((f.size||0)/1024))} KB</div></div></button>`).join('')}</div>
      <div class="btnrow"><button class="btn small ghost" data-act="docsave" data-group="${group}">Save all to this phone for offline</button></div>`
      : `<p class="empty">${esc(emptyText || 'Keep the insurance certificate, logbook and breakdown cover details here. Once opened, they\'re saved on the phone, so they work abroad without signal.')}</p>`}
  </section>`;
}
async function uploadDoc(file, group) {
  if (!file) return; if (file.size > 20*1024*1024) { toast('That file is over 20 MB'); return; }
  const name = prompt('Name this document', file.name.replace(/\.[^.]+$/, '')) || file.name;
  const id = uid('fi'), path = `${group}/${id}-${file.name.replace(/[^\w.\-]+/g,'_')}`;
  toast('Uploading…');
  const { error } = await sb.storage.from('family-files').upload(path, file, { contentType: file.type, upsert: false });
  if (error) { toast('Upload failed. Try again'); return; }
  await put(`files/${id}`, { name, path, type: file.type, size: file.size, group, by: me(), at: Date.now() });
  toast('Saved');
}
async function openDoc(id) {
  const f = S.files.find(x => x.id===id); if (!f) return;
  let url; try { url = URL.createObjectURL(await fileBlob(f)); } catch(e) { toast(navigator.onLine ? 'Couldn\'t open that file' : 'Not saved on this phone yet, and you\'re offline'); return; }
  const isImg = (f.type||'').startsWith('image/');
  openSheet(f.name, isImg ? `<img src="${url}" alt="${esc(f.name)}" style="width:100%;border-radius:8px">` : `<iframe src="${url}" title="${esc(f.name)}" style="width:100%;height:60vh;border:1px solid var(--rule);border-radius:8px"></iframe><div class="btnrow"><a class="btn small ghost" href="${url}" target="_blank" rel="noopener">Open full screen</a></div>`,
    null, { noSave:true, onDelete: async () => { await sb.storage.from('family-files').remove([f.path]); try { (await caches.open(FILE_CACHE)).delete(`/hhq-file/${f.path}`); } catch(e) {} await remove(`files/${f.id}`); } });
  // allow delete from the viewer
  const row = $('#sheetForm .btnrow:last-child'); if (row) row.insertAdjacentHTML('beforeend', '<button class="btn danger" type="button" data-act="delete">Delete</button>');
}
async function saveDocsOffline(group) { let n = 0; for (const f of S.files.filter(x => (x.group||'car')===group)) { try { await fileBlob(f); n++; } catch(e) {} } toast(`${n} document${n===1?'':'s'} saved on this phone`); render(); }

function carCosts() {
  const fills = S.fuel.slice().sort((a,b) => (Number(a.mileage)||0) - (Number(b.mileage)||0));
  const fuelCost = fills.reduce((s,f)=>s+(Number(f.cost)||0),0), miles = fills.length > 1 ? Number(fills[fills.length-1].mileage) - Number(fills[0].mileage) : 0;
  const since = fills.length ? fills[0].date : null;
  const serviceCost = S.service.filter(x => x.status!=='booked' && x.cost && (!since || (x.date||'') >= since)).reduce((s,x)=>s+(Number(x.cost)||0),0);
  return { fuelCost, serviceCost, miles, ppm: miles > 0 ? (fuelCost + serviceCost) / miles : null, fuelPpm: miles > 0 ? fuelCost / miles : null };
}
function fuelChart() {

  const rows = months.map(x => ({ label: MONTHS[parse(`${x}-01`).getMonth()].slice(0,3), parts: [{ v: S.fuel.filter(f => ymOf(f.date)===x).reduce((s,f)=>s+(Number(f.cost)||0),0), c:'var(--c-co)', name:'Fuel' }] }));

let sheetDelete = null;
function sheetDrag() {
  const sh = $('#sheetForm'); if (!sh) return; let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive:true });
  sh.addEventListener('touchmove', e => { if (y0===null) return; dy = e.touches[0].clientY - y0; if (dy > 0 && sh.scrollTop <= 0) sh.style.transform = `translateY(${dy}px)`; }, { passive:true });
  sh.addEventListener('touchend', () => { if (y0===null) return; sh.style.transition = ''; if (dy > 110) closeSheet(); else sh.style.transform = ''; y0 = null; });
}
const closeSheet = () => { $('#sheetRoot').innerHTML = ''; sheetSave = sheetDelete = null; };

/* ----- notifications (Web Push; iPhone needs the app added to the Home Screen) ----- */
const VAPID_PUBLIC = 'BDH_pUOw7uMwCyTECIIvxfmbenbrTCPLkO2cRlzlWz7GmXn0PgNyRpsbTFuA9sF6Q3APT0svUZt7wiFyC_g9hRo'; // public half of the push key pair
const b64u = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const swReady = () => Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('sw')), 4000))]);
async function pushSub() { if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null; const reg = await swReady(); return reg.pushManager.getSubscription(); }
async function pushPanel() {
  const box = $('#pushBox'); if (!box) return;
  if (!('PushManager' in window) || !('Notification' in window)) { box.innerHTML = `<p class="note">${/iphone|ipad/i.test(navigator.userAgent) && !isStandalone() ? 'To get notifications on an iPhone, add Hitchen HQ to your Home Screen (Share, then Add to Home Screen) and open it from there.' : 'This browser can\'t show notifications.'}</p>`; return; }
  let sub = null; try { sub = await pushSub(); } catch(e) { box.innerHTML = '<p class="note">Notifications aren\'t ready yet. Close the app fully, open it again and come back here.</p>'; return; }
  let row = null; if (sub) { const { data } = await sb.from('push_subs').select('prefs').eq('endpoint', sub.endpoint).maybeSingle(); row = data; }
  const prefs = (row && row.prefs) || { morning:true, evening:true, weekly:true };
  if (!sub) { box.innerHTML = `<p class="note">${Notification.permission==='denied' ? 'Notifications are blocked for Hitchen HQ. Turn them on in the iPhone Settings app under Notifications, then come back here.' : 'Get a nudge for bills, Viki\'s on call, bins and car jobs.'}</p>${Notification.permission!=='denied' ? '<div class="btnrow"><button class="btn small" type="button" data-act="pushon">Turn on notifications</button></div>' : ''}`; return; }
  box.innerHTML = `<div class="list">
      <label class="check"><input type="checkbox" data-act="pushpref" data-k="morning" ${prefs.morning!==false?'checked':''}><span class="grow">7am: today's bills, on call and payday</span></label>
      <label class="check"><input type="checkbox" data-act="pushpref" data-k="evening" ${prefs.evening!==false?'checked':''}><span class="grow">7pm: tomorrow's bills, bins, on call, renewals and car jobs</span></label>
      <label class="check"><input type="checkbox" data-act="pushpref" data-k="weekly" ${prefs.weekly!==false?'checked':''}><span class="grow">Sunday 7pm: the week ahead</span></label>
      <label class="check"><input type="checkbox" data-act="pushpref" data-k="money" ${prefs.money!==false?'checked':''}><span class="grow">Payday money jobs, and a heads-up the evening before Zilch takes a payment</span></label></div>
    <div class="btnrow"><button class="btn small ghost" type="button" data-act="pushtest">Send a test</button><button class="btn small ghost" type="button" data-act="pushoff">Turn off on this phone</button></div>`;
}
async function pushOn() {
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifications weren\'t allowed'); return pushPanel(); }
  const reg = await swReady();
  const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64u(VAPID_PUBLIC) });
  const j = sub.toJSON();
  const { error } = await sb.from('push_subs').upsert({ endpoint: j.endpoint, sub: j, who: me(), prefs: { morning:true, evening:true, weekly:true } });
  if (error) toast('Couldn\'t save. Try again'); else toast('Notifications on');
  pushPanel();
}
async function pushOff() { const sub = await pushSub(); if (sub) { await sb.from('push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); } toast('Notifications off on this phone'); pushPanel(); }
async function pushPref(k, on) { const sub = await pushSub(); if (!sub) return; const { data } = await sb.from('push_subs').select('prefs').eq('endpoint', sub.endpoint).maybeSingle(); const prefs = {...((data && data.prefs) || {}), [k]: on}; await sb.from('push_subs').update({ prefs }).eq('endpoint', sub.endpoint); }
async function pushTest() { const sub = await pushSub(); if (!sub) return; const { data, error } = await sb.functions.invoke('notify', { body: { endpoint: sub.endpoint } }); const ok = !error && data && (data.results||[]).some(r => r.status===201 || r.status===200); toast(ok ? 'Test sent' : 'The test didn\'t go through. Turn notifications off and on again'); }
function updateBadge() {
  if (!('setAppBadge' in navigator)) return;
  const t = today(), n = S.bills.filter(b => { const d = nextDue(b); return d && d <= addDays(t,1); }).length;
  (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});

async function handleAuth(form) {
  const err = $('#authErr'); const btn = form.querySelector('button[type="submit"]');
  const user = v('auser').trim().toLowerCase(), password = v('apass');
  const show = m => { err.textContent = m; err.hidden = !m; };
  if (!/^[a-z0-9._@-]+$/.test(user)) return show('Enter your username');
  if (!password) return show('Enter your password');
  btn.disabled = true; show('');
  try {
    const { error } = await sb.auth.signInWithPassword({ email: user.includes('@') ? user : `${user}@${LOGIN_DOMAIN}`, password });
    if (error) throw new Error(/invalid login/i.test(error.message) ? 'Username or password is wrong' : error.message);
  } catch (e) { show(e.message || 'Couldn\'t sign in'); btn.disabled = false; }
}
async function startSession(s) {
  const was = session && session.user && session.user.id;
  session = s;
  if (!session) { resetState(); CAL.calendars = []; CAL.at = 0; CAL.days = {}; try { localStorage.removeItem(CACHE_KEY); localStorage.removeItem('hhq-cal'); } catch(e) {} render(); return; }
  if (was === session.user.id && channel) return;
  if (loadCache()) render();
  try { await loadAll(); subscribe(); fetchCal(true); }
  catch (e) { offline = true; render(); }
}

<style>
/* Layout: phone-first household app; sticky header, one column of panels, fixed bottom tab bar with five areas */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E7EDEB; --ink:#142026; --muted:#53656B; --line:#D3DCD9;
  --accent:#1B6886; --accent-ink:#FFFFFF; --accent-soft:#DAEAF1;
  --chris:#1B6886; --chris-soft:#DAEAF1; --viki:#A4406A; --viki-soft:#F5E0E9;
  --gold:#A86E0C; --gold-soft:#F6E8CC; --good:#28744A; --good-soft:#DAEEE1; --bad:#B02E24; --bad-soft:#F5DCD9;
  --shadow:0 1px 2px rgba(20,32,38,.06),0 4px 14px rgba(20,32,38,.06);
  --font-d:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-b:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#162125; --surface-2:#1D2A2F; --ink:#E6EEEC; --muted:#98ACB1; --line:#29393E;
  --accent:#62B6D6; --accent-ink:#0B1A20; --accent-soft:#17323F;
  --chris:#62B6D6; --chris-soft:#17323F; --viki:#E68BAF; --viki-soft:#3A1D2A;
  --gold:#E3AE4D; --gold-soft:#372A11; --good:#6CC793; --good-soft:#15301F; --bad:#F08A80; --bad-soft:#3B1B18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162125; --surface-2:#1D2A2F; --ink:#E6EEEC; --muted:#98ACB1; --line:#29393E;
  --accent:#62B6D6; --accent-ink:#0B1A20; --accent-soft:#17323F;
  --chris:#62B6D6; --chris-soft:#17323F; --viki:#E68BAF; --viki-soft:#3A1D2A;
  --gold:#E3AE4D; --gold-soft:#372A11; --good:#6CC793; --good-soft:#15301F; --bad:#F08A80; --bad-soft:#3B1B18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
img{max-width:100%}
.login{max-width:420px;margin:8vh auto 0;width:100%}
body{color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--font-d);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:.82rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-family:var(--font-d);font-weight:700;font-size:1.08rem;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 .sub{font-family:var(--font-b);font-weight:400;font-size:.82rem;color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.who button[data-who="chris"][aria-pressed="true"]{color:var(--chris)}
.seg.who button[data-who="viki"][aria-pressed="true"]{color:var(--viki)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--font-d);font-size:1.35rem;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.list{display:flex;flex-direction:column}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:.82rem;color:var(--muted)}
.row .amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.rowbtn{all:unset;display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.rowbtn:first-child{border-top:0}
.rowbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:700;white-space:nowrap}
.chip.due{background:var(--bad-soft);color:var(--bad)} .chip.soon{background:var(--gold-soft);color:var(--gold)} .chip.ok{background:var(--good-soft);color:var(--good)}
.chip.cat{background:var(--surface-2);color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:7px 11px;font-size:.85rem;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--bad)} .bar i.good{background:var(--good)}
.empty{color:var(--muted);font-size:.92rem;padding:6px 0}
.note{font-size:.85rem;color:var(--muted)}
.banner{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.88rem}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-family:var(--font-d);font-size:1.05rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.7rem;text-align:center;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1/1.05;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;min-width:0}
.cal button .d{font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.cal button .l{font-size:.6rem;line-height:1.1;font-weight:700;text-align:center;overflow:hidden;max-width:100%}
.cal button.today{border:2px solid var(--ink)}
.cal button.pad{visibility:hidden}
.st-work{background:var(--chris-soft)!important;color:var(--chris)} .st-shift{background:var(--viki-soft)!important;color:var(--viki)}
.st-callout{background:var(--gold-soft)!important;color:var(--gold)} .st-holiday{background:var(--good-soft)!important;color:var(--good)}
.st-sick{background:var(--bad-soft)!important;color:var(--bad)} .st-off{background:var(--surface-2)!important;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .chip{border:1px solid var(--line)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--font-d);font-size:1.2rem;margin:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.82rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:.88rem}
.choice button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:-2px}
.err{color:var(--bad);font-size:.85rem}
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.ai{white-space:pre-wrap;font-size:.93rem;background:var(--surface-2);border-radius:12px;padding:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-weight:700;z-index:50;font-size:.9rem}
@media (max-width:380px){.fields2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

/* ---------- data layer ---------- */
const COLL = { bills:'bills', goals:'goals', spend:'spend', service:'service', fuel:'fuel' };
function applyLocal(path, data) {
  const [c, id] = path.split('/');
  if (c === 'days') { if (data) S.days[id] = data; else delete S.days[id]; }
  else if (COLL[c]) { const arr = S[c]; const i = arr.findIndex(x => x.id === id); if (!data) { if (i>=0) arr.splice(i,1); } else if (i>=0) arr[i] = {...data, id}; else arr.push({...data, id}); }
  else if (c === 'settings') S.settings = data || {};
  else if (c === 'budget') S.budget = data || {cats:[]};
  else if (c === 'car') S.car = data || {};
  else if (c === 'state') { if (id==='checks') S.checks = data||{done:{}}; if (id==='trip') S.trip = data||{done:{}}; }
}
/* Every record is one row in the `docs` table: path (e.g. "bills/b_rent") plus its JSON data. */
const CACHE_KEY = 'hhq-cache-v1';
let cacheTimer;
function resetState() {
  Object.assign(S, { settings:{}, days:{}, bills:[], goals:[], spend:[], budget:{cats:[]}, car:{}, service:[], fuel:[], checks:{done:{}}, trip:{done:{}} });
}
function snapshotRows() {
  const rows = [];
  rows.push(['settings/main', S.settings], ['budget/main', S.budget], ['car/main', S.car], ['state/checks', S.checks], ['state/trip', S.trip]);
  Object.entries(S.days).forEach(([id,d]) => rows.push([`days/${id}`, d]));
  Object.keys(COLL).forEach(c => S[c].forEach(({id, ...d}) => rows.push([`${c}/${id}`, d])));
  return rows;
}
function saveCache() { clearTimeout(cacheTimer); cacheTimer = setTimeout(() => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(snapshotRows())); } catch(e) {} }, 500); }
function loadCache() { try { const rows = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (!Array.isArray(rows)) return false; resetState(); rows.forEach(([p,d]) => applyLocal(p,d)); return true; } catch(e) { return false; } }
async function put(path, data) {
  applyLocal(path, data); schedule(); saveCache();
  if (!sb || !session) return;
  const { error } = await sb.from('docs').upsert({ path, coll: path.split('/')[0], data });
  if (error) toast(navigator.onLine ? 'Couldn\'t save. Check you\'re signed in and try again' : 'You\'re offline. Changes weren\'t saved');
}
async function remove(path) {
  applyLocal(path, null); schedule(); saveCache();
  if (!sb || !session) return;
  const { error } = await sb.from('docs').delete().eq('path', path);
  if (error) toast('Couldn\'t delete. Try again');
}
async function loadAll() {
  const out = []; let from = 0;
  while (true) {
    const { data, error } = await sb.from('docs').select('path,data').order('path').range(from, from + 999);
    if (error) throw error;
    out.push(...data); if (data.length < 1000) break; from += 1000;
  }
  resetState(); out.forEach(r => applyLocal(r.path, r.data)); offline = false; schedule(); saveCache();
}
let channel = null;
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('family-docs')
    .on('postgres_changes', { event:'*', schema:'public', table:'docs' }, p => {
      if (p.eventType === 'DELETE') { if (p.old && p.old.path) applyLocal(p.old.path, null); }
      else if (p.new && p.new.path) applyLocal(p.new.path, p.new.data);
      schedule(); saveCache();
    })
    .subscribe();
}

/* ---------- derived values ---------- */
const rates = () => ({...DEFAULT_RATES, ...(S.settings.rates||{})});
function nextDue(b) {
  if (!b.due) return null;
  let d = b.due, t = today(), guard = 0;
  const step = b.freq==='weekly' ? (s=>addDays(s,7)) : b.freq==='quarterly' ? (s=>addMonths(s,3)) : b.freq==='annual' ? (s=>addMonths(s,12)) : (s=>addMonths(s,1));
  while (d < t && guard++ < 600) d = step(d);
  return d;
}
const perMonth = b => { const a = Number(b.amount)||0; return b.freq==='weekly' ? a*52/12 : b.freq==='quarterly' ? a/3 : b.freq==='annual' ? a/12 : a; };
function leaveYear() {
  const startMM = Number(S.settings.leaveStart || 1); const t = parse(today());
  let y = t.getFullYear(); if (t.getMonth()+1 < startMM) y--;
  const from = `${y}-${pad(startMM)}-01`; return { from, to: addDays(addMonths(from,12),-1) };
}
function vikiPay(d, date) {
  const r = rates(); let p = 0;
  p += (Number(d.ot15)||0)*r.ot15 + (Number(d.ot2)||0)*r.ot2 + (Number(d.bh)||0)*r.bh;
  if (d.oncall==='weekday') p += r.oncallWD; if (d.oncall==='weekend') p += r.oncallWE;
  p += (Number(d.second)||0) * (isWeekend(date) ? r.secondWE : r.secondWD);
  return p;
}
function daysFor(who, from, to) {
  return Object.values(S.days).filter(d => d.who===who && d.date>=from && d.date<=to);
}
function checkStatus(c) {
  const rec = (S.checks.done||{})[c.id];
  if (!rec) return { cls:'due', label:'Not logged yet', next:null };
  const next = addDays(rec.date, c.days); const left = daysBetween(today(), next);
  let miles = null;
  if (c.miles && rec.mileage && S.car.mileage) { miles = rec.mileage + c.miles - S.car.mileage; }
  if (left < 0 || (miles!==null && miles <= 0)) return { cls:'due', label:'Due now', next, miles };
  if (left <= 14 || (miles!==null && miles <= 500)) return { cls:'soon', label: `Due ${shortDate(next)}`, next, miles };
  return { cls:'ok', label: `Next ${shortDate(next)}`, next, miles };
}

let pending = false;
function schedule() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); }
function render() {

  $('nav.tabs').hidden = !session;

function insights() {
  const out = [];
  const subs = S.bills.filter(b => /subscri|stream|tv/i.test(b.category||''));
  const subTotal = subs.reduce((s,b)=>s+perMonth(b),0);
  if (subs.length) out.push(`Subscriptions cost ${money(subTotal)} a month (${money(subTotal*12,0)} a year) across ${subs.length} services. Cancelling two you rarely use is the quickest saving.`);
  const bnpl = S.bills.filter(b => /zilch|klarna|clearpay|paypal pay/i.test(b.name));
  const bnplSpend = S.spend.filter(x => x.zilch && ymOf(x.date)===ymOf(today())).reduce((s,x)=>s+(Number(x.amount)||0),0);
  if (bnpl.length || bnplSpend) out.push(`Buy-now-pay-later: ${bnplSpend ? `${money(bnplSpend)} of this month's spending went on Zilch. ` : ''}Every pound on Zilch is taken from next month's money.`);
  const finance = S.bills.filter(b => /finance|loan|car|bike/i.test(b.category||''));
  const finTotal = finance.reduce((s,b)=>s+perMonth(b),0);
  if (finance.length) out.push(`Vehicles and finance cost ${money(finTotal,0)} a month across ${finance.length} payments.`);
  const ym = ymOf(today()); const cats = S.budget.cats||[];
  cats.forEach(c => { const s = S.spend.filter(x=>x.cat===c.name && ymOf(x.date)===ym).reduce((a,x)=>a+(Number(x.amount)||0),0); if (c.limit && s > c.limit) out.push(`${c.name} is over budget this month by ${money(s-c.limit)}.`); });
  S.goals.forEach(g => { if (g.deadline && g.target) { const months=Math.max(1,Math.ceil(daysBetween(today(),g.deadline)/30.4)); const need=(g.target-(Number(g.saved)||0))/months; if (need>0) out.push(`${g.name}: put aside ${money(need,0)} a month to reach ${money(g.target,0)} by ${shortDate(g.deadline)}.`); } });
  const vExtra = daysFor('viki', `${ym}-01`, `${ym}-31`).reduce((s,d)=>s+vikiPay(d,d.date),0);
  if (vExtra > 0) out.push(`Viki has earned ${money(vExtra,0)} gross in overtime and on-call this month. Sending overtime straight to savings protects you when it drops.`);
  return out;
}

function viewFuel() {
  const fills = S.fuel.slice().sort((a,b) => (Number(a.mileage)||0) - (Number(b.mileage)||0));
  const rows = fills.map((f,i) => { const prev = fills[i-1]; let mpg=null, ppm=null;
    if (prev && f.full && prev.full && f.mileage > prev.mileage && f.litres) { const miles = f.mileage - prev.mileage; mpg = miles / (f.litres/4.54609); ppm = f.cost ? f.cost/miles : null; }
    return {...f, mpg, ppm}; }).reverse();
  const withMpg = rows.filter(r=>r.mpg); const avg = withMpg.length ? withMpg.reduce((s,r)=>s+r.mpg,0)/withMpg.length : null;
  const ym = ymOf(today()); const monthCost = S.fuel.filter(f=>ymOf(f.date)===ym).reduce((s,f)=>s+(Number(f.cost)||0),0);
  return `<section class="panel"><h2>Fuel <button class="btn small" data-act="fuel">Add fill-up</button></h2>
    <div class="stats"><div class="stat"><span>Average</span><b>${avg?avg.toFixed(1):'—'}</b><span>mpg</span></div><div class="stat"><span>Fuel this month</span><b>${money(monthCost,0)}</b><span>${MONTHS[parse(today()).getMonth()]}</span></div></div>
    ${rows.length ? `<div class="list">${rows.map(r => `<button class="rowbtn" data-act="fuel" data-id="${esc(r.id)}"><div class="grow"><div class="t">${shortDate(r.date)}</div><div class="m">${Number(r.mileage).toLocaleString('en-GB')} miles · ${r.litres} L${r.mpg?` · ${r.mpg.toFixed(1)} mpg`:''}${r.ppm?` · ${(r.ppm*100).toFixed(1)}p a mile`:''}</div></div><div class="amt">${money(r.cost)}</div></button>`).join('')}</div>` : `<p class="empty">Log fill-ups with the mileage and litres to see your real mpg. Fill to full each time for accurate figures.</p>`}
  </section>`;
}

function dayForm(date) {

    <div class="fields2">${fld('second','2nd on-call (hours)', rec.second||'', 'number','min="0" step="0.5" inputmode="decimal"')}${fld('bh',`Bank holiday hours (+${money(r.bh,2)}/h)`, rec.bh||'', 'number','min="0" step="0.25" inputmode="decimal"')}</div>`; }

    out.rates = nr; await put('settings/main', out);
  });
}

/* ---------- auth ---------- */
async function handleAuth(form) {
  const err = $('#authErr'); const btn = form.querySelector('button[type="submit"]');
  const email = v('aemail').trim().toLowerCase(), password = v('apass');
  const show = m => { err.textContent = m; err.hidden = !m; };
  if (!/^\S+@\S+\.\S+$/.test(email)) return show('Enter your email address');
  if (password.length < 8) return show('Passwords need at least 8 characters');
  btn.disabled = true; show('');
  try {
    if (authMode === 'signup') {
      const { error } = await sb.auth.signUp({ email, password });
      if (error) throw new Error(/database error|not on the/i.test(error.message) ? 'That email isn\'t on the family list. Ask Chris to add it.' : error.message);
    }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(/invalid login/i.test(error.message) ? 'Email or password is wrong' : error.message);
  } catch (e) { show(e.message || 'Couldn\'t sign in'); btn.disabled = false; }
}
async function startSession(s) {
  const was = session && session.user && session.user.id;
  session = s;
  if (!session) { resetState(); try { localStorage.removeItem(CACHE_KEY); } catch(e) {} render(); return; }
  if (was === session.user.id && channel) return;
  if (loadCache()) render();
  try { await loadAll(); subscribe(); }
  catch (e) { offline = true; render(); }
}

/* ---------- events ---------- */
let toastTimer;
function toast(msg) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2400); }
document.addEventListener('click', async e => {
  const tabBtn = e.target.closest('nav.tabs button'); if (tabBtn) { UI.tab = tabBtn.dataset.tab; keepUI(); render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a==='close') { if (e.target === el || el.tagName==='BUTTON') closeSheet(); return; }
  if (a==='delete') { if (el.dataset.confirm) { const fn = sheetDelete; closeSheet(); if (fn) { await fn(); toast('Deleted'); } } else { el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; } return; }
  if (a==='settings') return settingsForm();
  if (a==='tab') { UI.tab = el.dataset.v; if (el.dataset.seg) { if (UI.tab==='money') UI.money = el.dataset.seg; else UI.carSeg = el.dataset.seg; } keepUI(); render(); window.scrollTo(0,0); return; }
  if (a==='who') { UI.who = el.dataset.who; keepUI(); return render(); }
  if (a==='cal') { UI.cal = ymOf(addMonths(`${UI.cal}-01`, Number(el.dataset.v))); return render(); }
  if (a==='bm') { UI.bmonth = ymOf(addMonths(`${UI.bmonth}-01`, Number(el.dataset.v))); return render(); }
  if (a==='mseg') { UI.money = el.dataset.v; keepUI(); return render(); }
  if (a==='cseg') { UI.carSeg = el.dataset.v; keepUI(); return render(); }
  if (a==='day') return dayForm(el.dataset.date);
  if (a==='bill') return billForm(el.dataset.id);
  if (a==='spend') return spendForm(el.dataset.id);
  if (a==='cats') return catsForm();
  if (a==='goal') return goalForm(el.dataset.id);
  if (a==='service') return serviceForm(el.dataset.id);
  if (a==='fuel') return fuelForm(el.dataset.id);
  if (a==='mileage') return mileageForm();
  if (a==='authmode') { authMode = authMode==='signin' ? 'signup' : 'signin'; return render(); }
  if (a==='signout') { closeSheet(); await sb.auth.signOut(); return; }
  if (a==='fillweek') {
    const ym = UI.cal; const first = parse(`${ym}-01`); const n = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate(); let c = 0;
    el.disabled = true;
    for (let d=1; d<=n; d++) { const date = `${ym}-${pad(d)}`; if (isWeekend(date) || date > today() || S.days[`chris_${date}`]) continue; await put(`days/chris_${date}`, {who:'chris', date, status:'work'}); c++; }
    toast(c ? `Marked ${c} weekdays as work` : 'No empty weekdays to fill'); return;
  }
  if (a==='checkdone') {
    const done = {...(S.checks.done||{})}; done[el.dataset.id] = { date: today(), ...(S.car.mileage ? {mileage: Number(S.car.mileage)} : {}) };
    await put('state/checks', { done }); toast('Logged as done today'); return;
  }
});
document.addEventListener('change', async e => {
  const el = e.target; if (el.dataset.act !== 'trip') return;
  const done = {...(S.trip.done||{})}; if (el.checked) done[el.dataset.id] = true; else delete done[el.dataset.id];
  await put('state/trip', { done });
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'authForm') { e.preventDefault(); return handleAuth(e.target); }
  if (e.target.id !== 'sheetForm') return; e.preventDefault();
  const fn = sheetSave; if (!fn) return;
  const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
  try { await fn(); closeSheet(); toast('Saved'); } catch (err) { formErr(err.message || 'Couldn\'t save that'); btn.disabled = false; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheetRoot').innerHTML) closeSheet(); });

/* ---------- boot ---------- */
async function boot() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#app').innerHTML = '<div class="panel"><p class="empty">Couldn\'t load the app. Check your connection and reopen it.</p></div>'; return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  const { data } = await sb.auth.getSession();
  await startSession(data.session);
  sb.auth.onAuthStateChange((event, s) => { if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') startSession(s); else session = s || session; });
  window.addEventListener('online', () => { if (session && offline) loadAll().then(subscribe).catch(() => {}); });
}
boot();
})();
</script>

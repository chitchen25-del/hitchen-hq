/* Celebrations: Valentine's, Mother's Day, Easter, Father's Day, Halloween, Bonfire Night, New Year's Eve, anniversaries and anything else */
function easterSun(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return `${y}-${pad(Math.floor((h + l - 7 * m + 114) / 31))}-${pad(((h + l - 7 * m + 114) % 31) + 1)}`;
}
const nthSunday = (y, m, nth) => { const dow = new Date(y, m - 1, 1).getDay(); return `${y}-${pad(m)}-${pad(1 + ((7 - dow) % 7) + 7 * (nth - 1))}`; };
function celebDates() {
  const t = today(), y = +t.slice(0, 4), out = [];
  const add = (n, ic, f) => { for (const yy of [y, y + 1]) { const d = f(yy); if (d >= t) { out.push({ n, ic, d }); return; } } };
  add("Valentine's Day", '💝', yy => `${yy}-02-14`);
  add("Mother's Day", '💐', yy => addDays(easterSun(yy), -21));   /* Mothering Sunday: three weeks before Easter */
  add('Easter', '🐣', easterSun);
  add("Father's Day", '👔', yy => nthSunday(yy, 6, 3));
  add('Halloween', '🎃', yy => `${yy}-10-31`);
  add('Bonfire Night', '🎆', yy => `${yy}-11-05`);
  add("New Year's Eve", '🥂', yy => `${yy}-12-31`);
  const wa = String(S.settings.anniversary || '');   /* settings/main → anniversary "MM-DD" or "YYYY-MM-DD" (private) */
  if (/^(\d{4}-)?\d\d-\d\d$/.test(wa)) { const md = wa.slice(-5), y0 = wa.length === 10 ? +wa.slice(0, 4) : 0;
    for (const yy of [y, y + 1]) { const d = `${yy}-${md}`; if (d >= t) { out.push({ n: y0 ? `${ordinal(yy - y0)} wedding anniversary` : 'Wedding anniversary', ic: '💍', d }); break; } } }
  const seen = new Set();
  (CAL.calendars || []).forEach(c => (c.events || []).forEach(e => {
    if (!/anniversary/i.test(e.title || '')) return; const d = evDate(e); if (d < t) return;
    const n = String(e.title).replace(/[^\p{L}\p{N}\s'’&-]/gu, '').replace(/\s+/g, ' ').trim(); if (!n || seen.has(n.toLowerCase())) return; seen.add(n.toLowerCase()); out.push({ n, ic: '💍', d });
  }));
  const have = new Set((S.plans || []).filter(p => p.kind === 'celebration').map(p => `${occName(p).toLowerCase()}|${p.from}`));
  return out.filter(c => !have.has(`${c.n.toLowerCase()}|${c.d}`)).sort((a, b) => a.d < b.d ? -1 : 1);
}

    <p class="note">Tap one to give it a budget. It saves a little each month until the day, and shows in each month's Budget Sheet.</p></section>`;

/* ----- photos for trips: stored privately in family-files (or a small data URL), shown as backgrounds ----- */
const PHOTO_MEM = {};
async function photoURL(ref) {
  if (!ref) return ''; if (String(ref).startsWith('data:')) return ref; if (PHOTO_MEM[ref]) return PHOTO_MEM[ref];
  try { const blob = await fileBlob({ path: ref, type: 'image/jpeg' }); return PHOTO_MEM[ref] = URL.createObjectURL(blob); } catch(e) { return ''; }
}
function hydratePhotos() {
  document.querySelectorAll('[data-photo]').forEach(async el => { const ref = el.dataset.photo; if (!ref || el.dataset.shown === ref) return;
    const u = await photoURL(ref); if (!u || el.dataset.photo !== ref) return; el.style.backgroundImage = `url("${u}")`; el.dataset.shown = ref; el.classList.add('on'); });
}
async function shrinkImage(file, max = 1600, q = 0.82) {
  const bmp = await createImageBitmap(file), s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
async function uploadPhoto(file) {
  const blob = await shrinkImage(file), path = `trips/${uid('ph')}.jpg`;
  const { error } = await sb.storage.from('family-files').upload(path, blob, { contentType: 'image/jpeg', upsert: false }); if (error) throw new Error('The photo didn\'t upload. Try again');
  try { const c = await caches.open(FILE_CACHE); await c.put(`/hhq-file/${path}`, new Response(blob, { headers: { 'Content-Type': 'image/jpeg' } })); } catch(e) {}
  return path;
}
const photoField = (id, label, cur) => `<div class="field"><label>${label}</label><div class="phpick"><div class="phprev" id="${id}Prev" ${cur ? `data-photo="${esc(cur)}"` : ''}></div><div class="phbtns"><label class="btn small ghost">${cur ? 'Change photo' : 'Choose a photo'}<input type="file" id="${id}" accept="image/*" hidden></label>${cur ? `<label class="toggle"><input type="checkbox" id="${id}Del"> Remove it</label>` : ''}</div></div></div>`;
function photoWatch(id) { let file = null; const inp = $('#'+id); if (!inp) return () => null;
  inp.addEventListener('change', () => { file = inp.files[0] || null; const pv = $('#'+id+'Prev'); if (file && pv) { pv.style.backgroundImage = `url("${URL.createObjectURL(file)}")`; pv.classList.add('on'); } });
  setTimeout(hydratePhotos, 0); return () => file; }

/* ----- trip categories ----- */
const TCAT = [['travel','Travel','#3F7BEA'],['stay','Stays','#8E5BD8'],['fun','Days out','#F2A33A'],['gift','Presents','#D84343'],['food','Food and treats','#E5577A'],['prep','Getting ready','#2BA59A'],['other','Other','#7C8796']];
const TCATI = Object.fromEntries(TCAT.map(c => [c[0], c]));
function itemCat(it) {
  if (it.cat && TCATI[it.cat]) return it.cat; const n = String(it.n||'').toLowerCase();
  if (/present|gift|stocking|wrapping|cards\b/.test(n)) return 'gift';

/* ----- step by step: exactly what to pay, when, and how ----- */
const VIA = { card: 'Joint account card', revolut: 'Revolut, in euros', cash: 'Cash' };
const itemVia = it => it.via || (/revolut|euro|€/i.test(it.note||'') ? 'revolut' : 'card');
const STEP_ICON = {
  card: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
  zilch: '<path d="M7 7h10L7 17h10"/>',

  pot: '<path d="M5 9h14l-1 10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',
  revolut: '<path d="M17 7a6 6 0 1 0 0 10"/><path d="M5 10h8M5 14h8"/>',
  clear: '<path d="M5 13l4 4L19 7"/>',

const STEP_COL = { card: '#3F7BEA', zilch: '#E8902A', auto: '#E8902A', pot: '#2BA59A', revolut: '#5B6475', clear: '#E8902A' };
const stepIcon = h => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${STEP_ICON[h]||STEP_ICON.card}</svg>`;
function tripSteps(p) {
  if (p.idea) return [];
  const steps = [], add = s => steps.push(s), done = p.done || {}, merge = {};
  const mergeAdd = (key, base, amount, what) => { const m = merge[key] || (merge[key] = { ...base, amount: 0, whats: [] }); m.amount += amount; m.whats.push(what); };
  (p.items||[]).forEach(it => { const cost = itemCost(it), ym = it.ym || plCur(); if (!cost) return;
    if (p.payplan && !(it.how === 'zilch' && it.paid)) { add({ key: `spay:${it.id}`, ym, how: itemVia(it), kind: 'do', item: it.id, title: `Pay for ${it.n} from the pot`, amount: cost, sub: VIA[itemVia(it)], done: !!it.paid, order: 3 }); return; }
    if (it.how === 'zilch') {
      const z = zilchPlan(cost, { avail: zs().limit, start: `${ym}-01` }); if (!z) return;
      add({ key: `zbook:${it.id}`, ym, how: 'zilch', kind: 'do', item: it.id, title: `Book ${it.n} on Zilch`, amount: z.pays[0].amount, sub: `${money(cost,0)} in all. Zilch takes ${money(z.pays[0].amount, z.pays[0].amount % 1 ? 2 : 0)} today, the rest over 3 months`, done: !!it.paid, order: 2 });
      z.pays.slice(1).forEach(x => mergeAdd(`zauto:${ymOf(x.date)}`, { key: `zauto:${ymOf(x.date)}`, ym: ymOf(x.date), how: 'auto', kind: 'auto', title: 'Zilch takes a payment', order: 5 }, x.amount, it.n));
    } else if (it.how === 'save') {
      const pays = plItemPays({ ...it, paid: false }, p);
      pays.forEach(x => mergeAdd(`pot:${x.ym}`, { key: `pot:${x.ym}`, ym: x.ym, how: 'pot', kind: 'do', title: p.kind === 'year' ? 'Put money aside for the year ahead' : 'Move money into the holiday pot', order: 1 }, x.amount, it.n));
      add({ key: `spay:${it.id}`, ym, how: itemVia(it), kind: 'do', item: it.id, title: `Pay for ${it.n} from the pot`, amount: cost, sub: VIA[itemVia(it)], done: !!it.paid, order: 3 });
    } else {
      const v = itemVia(it);
      if (v === 'revolut') mergeAdd(`rev:${ym}`, { key: `rev:${ym}`, ym, how: 'revolut', kind: 'do', title: 'Top up Revolut for the trip', order: 4 }, cost, it.n);
      else add({ key: `pay:${it.id}`, ym, how: v, kind: 'do', item: it.id, title: itemCat(it) === 'gift' ? `Buy ${it.n.charAt(0).toLowerCase() + it.n.slice(1)}` : `Pay for ${it.n}`, amount: cost, sub: VIA[v], done: !!it.paid, order: 3 });
    }
  });
  Object.values(merge).forEach(m => { const what = m.whats.length > 3 ? `${m.whats.slice(0,3).join(', ')} and ${m.whats.length-3} more` : m.whats.join(', ').replace(/, ([^,]*)$/, ' and $1');
    const low = m.whats.map(x => x.toLowerCase()).join(', ').replace(/, ([^,]*)$/, ' and $1');
    add({ ...m, amount: Math.round(m.amount*100)/100, sub: m.how === 'auto' ? `Comes out on its own. Covers your ${m.whats.length} Zilch booking${m.whats.length===1?'':'s'}` : m.how === 'revolut' ? `From the joint account, then spend in euros on ${low}` : `On payday, so it's there when needed. For ${what}`, done: !!done[m.key] }); });
  if (p.payplan) Object.entries(ppSchedule(p, p.items, p.payplan)).forEach(([ym, a]) => add({ key: `pp:${ym}`, ym, how: 'pot', kind: 'do', title: 'Move money into the holiday pot', amount: Math.round(a * 100) / 100, sub: `For ${p.name}, from your plan on the Planner`, done: !!done[`pp:${ym}`], order: 1 }));
  (p.steps||[]).forEach(s => add({ ...s, done: !!done[s.key], order: s.order ?? 0 }));
  const groups = {}; steps.forEach(s => (groups[s.ym] = groups[s.ym] || []).push(s));
  return Object.keys(groups).sort().map(ym => ({ ym, steps: groups[ym].sort((a, b) => (a.kind === 'also') - (b.kind === 'also') || a.order - b.order) }));
}
const stepWho = s => s.kind === 'auto' ? '<span class="chip st-auto">Automatic</span>' : s.kind === 'also' ? '<span class="chip st-also">Car, not the trip</span>' : '';
function stepRow(p, s) {
  const col = STEP_COL[s.how] || STEP_COL.card, tick = s.kind !== 'also';
  return `<div class="step ${s.done ? 'done' : ''} k-${s.kind}">
    ${tick ? `<button type="button" class="st-tick" data-act="plstep" data-plan="${esc(p.id)}" data-key="${esc(s.key)}" ${s.item ? `data-item="${esc(s.item)}"` : ''} aria-pressed="${s.done}" aria-label="${s.done ? 'Done' : 'Mark done'}: ${esc(s.title)}">${s.done ? stepIcon('clear') : ''}</button>` : '<span class="st-tick ghost"></span>'}
    <span class="st-ico" style="background:color-mix(in srgb,${col} 15%,transparent);color:${col}">${stepIcon(s.how)}</span>
    <div class="grow"><div class="t">${esc(s.title)} ${stepWho(s)}</div>${s.sub ? `<div class="m">${esc(s.sub)}</div>` : ''}</div>
    <div class="amt">${s.amount ? money(s.amount, s.amount % 1 ? 2 : 0) : ''}</div></div>`;
}
const payWhen = ym => { const cur = plCur(), d = ymDiff(cur, ym); return d === 0 ? 'Now' : d === 1 ? 'Next month' : d < 0 ? 'Done and dusted' : `In ${d} months`; };
function stepsPanel(p) {
  const groups = tripSteps(p), cur = plCur(); if (!groups.length) return '';
  const all = groups.flatMap(g => g.steps.map(s => ({ ...s, ym: g.ym }))), todo = all.filter(s => s.kind === 'do' && !s.done);
  const next = todo[0], left = todo.length;
  const callout = next ? `<div class="st-next"><div class="st-nk">Next thing to do</div><div class="st-nt">${esc(next.title)}</div><div class="st-nm"><span class="st-pill" style="background:${STEP_COL[next.how]}">${next.how === 'zilch' ? 'Zilch' : next.how === 'pot' ? 'Holiday pot' : next.how === 'revolut' ? 'Revolut' : next.how === 'clear' ? 'Zilch app' : 'Card'}</span>${money(next.amount, next.amount % 1 ? 2 : 0)} · ${esc(next.ym === cur ? `from this month's pay` : `after the ${MONTHS[Number(next.ym.slice(5,7))-1]} payday`)}</div></div>`
    : `<div class="st-next good"><div class="st-nk">All sorted</div><div class="st-nt">Everything for this trip is booked and paid. Enjoy it.</div></div>`;

    ${groups.map(g => { const own = g.steps.filter(s => s.kind !== 'also'), tot = own.reduce((s, x) => s + (Number(x.amount)||0), 0), past = g.ym < cur && own.every(s => s.done);
      return `<div class="st-group ${past ? 'past' : ''}"><div class="st-gh"><div><b>${MONTHS[Number(g.ym.slice(5,7))-1]} pay</b><span>${esc(payWhen(g.ym))} · lands around the 25th</span></div><em>${money(tot,0)}<small>going out</small></em></div>${g.steps.map(s => stepRow(p, s)).join('')}</div>`; }).join('')}
    <details class="st-key"><summary>What the colours mean</summary>
      <div class="step"><span class="st-ico" style="background:color-mix(in srgb,${STEP_COL.card} 15%,transparent);color:${STEP_COL.card}">${stepIcon('card')}</span><div class="grow"><div class="t">Card</div><div class="m">Pay in full with the joint account card. Done in one go.</div></div></div>
      <div class="step"><span class="st-ico" style="background:color-mix(in srgb,${STEP_COL.zilch} 15%,transparent);color:${STEP_COL.zilch}">${stepIcon('zilch')}</span><div class="grow"><div class="t">Zilch</div><div class="m">Book with the Zilch card. A quarter comes out that day, and the rest comes out on its own over the next three months, with a small fee each time.</div></div></div>

    </details></section>`;
}
async function toggleStep(planId, key, itemId) {

  if (itemId) { const items = (p.items||[]).map(it => it.id === itemId ? (it.paid ? (({ paid, ...r }) => r)(it) : { ...it, paid: true, ...(it.how === 'zilch' && !it.zdate ? { zdate: today() } : {}) }) : it); await put(`plans/${planId}`, { ...rest, items }); }

function nextJobs() {
  const cur = plCur(), jobs = [];

    <div class="btnrow"><button class="btn small ghost" data-act="tab" data-v="trips">See every step in Treats</button></div></section>`;
}

/* ===== Treats: occasions (Christmas and birthdays), present history, wish lists, packing, on the day ===== */
const GIFT_KINDS = ['christmas', 'birthday', 'celebration'];
const isGift = p => !!p && GIFT_KINDS.includes(p.kind);
const kindTab = p => p.kind || 'summer';
const PL_TYPES = [['summer','Holiday'],['family','Family visit'],['city','Trip'],['christmas','Christmas'],['birthday','Birthday'],['celebration','Celebration']];
const kindLabel = k => (PL_TYPES.find(x => x[0] === k) || [])[1] || '';
const occName = p => String(p.name || '').replace(/\s+20\d\d$/, '');
const sleepsN = d => d ? daysBetween(today(), d) : null;
const sleepsTxt = d => { const n = sleepsN(d); return n === null ? '' : n > 1 ? `${n} sleeps` : n === 1 ? 'Tomorrow' : n === 0 ? 'Today' : 'Been'; };
const OCC_ICON = { christmas: '🎄', birthday: '🎈', celebration: '🎉', summer: '☀️', family: '🏡', city: '🏰' };

/* the four of us, oldest first: settings/main → adults [{ name, dob }] plus the girls (private, never in this code) */
function famBdays() {
  const ok = k => k && k.name && /^\d{4}-\d\d-\d\d$/.test(k.dob || '');
  return [...(S.settings.adults || []).filter(ok), ...kidsDob()].sort((a, b) => a.dob < b.dob ? -1 : 1).map(k => ({ ...k, b: nextBday(k.dob) }));
}
/* other people's dates we know: settings/main → bdays [{ name, dob, aka:[] }] (private), e.g. a calendar entry "Mums birthday" */
const knownBdays = () => [...famBdays(), ...(S.settings.bdays || []).filter(k => k && k.name && /^\d{4}-\d\d-\d\d$/.test(k.dob || '')).map(k => ({ ...k, b: nextBday(k.dob) }))];
function bdName(title) {
  let n = String(title || '').replace(/\(.*?\)/g, '').replace(/\b(19|20)\d\d\b/g, '').replace(/['’]s\b/g, '').replace(/birthday|bday|🎈|🎉|🎂/ig, '').replace(/[^\p{L}\s'’-]/gu, '').replace(/\s+/g, ' ').trim().replace(/['’]+$/, '').trim();
  if (!n || /^(my|me|mine)$/i.test(n)) return '';
  if (!/['’]/.test(String(title)) && /^\p{L}{3,}s$/u.test(n) && new RegExp(`${n}\\s+(birthday|bday)`, 'i').test(String(title))) n = n.slice(0, -1);   /* "Mums birthday" → Mum */
  const hit = knownBdays().find(f => [f.name, ...(f.aka || [])].some(x => wishKey(x) === wishKey(n) || wishKey(x + 's') === wishKey(n)));
  return hit ? hit.name : n;
}
/* birthdays in the family calendar, next 12 months */
function calBirthdays() {
  const t = today(), out = [], seen = new Set();
  (CAL.calendars || []).forEach(c => (c.events || []).forEach(e => {
    if (!/birthday|bday/i.test(e.title || '')) return; const d = evDate(e); if (d < t) return;
    const name = bdName(e.title);
    if (!name || seen.has(name.toLowerCase())) return; seen.add(name.toLowerCase()); out.push({ name, d });
  }));
  knownBdays().forEach(f => { if (!seen.has(f.name.toLowerCase())) { seen.add(f.name.toLowerCase()); out.push({ name: f.name, d: f.b.date }); } });
  const have = new Set((S.plans || []).filter(p => p.kind === 'birthday').map(p => `${xName(String(p.name).replace(/['’]s birthday.*$/i, '')).toLowerCase()}|${p.from}`));
  return out.filter(b => !have.has(`${b.name.toLowerCase()}|${b.d}`)).sort((a, b) => a.d < b.d ? -1 : 1);
}

  openSheet('Add a birthday', fld('bdN', 'Whose birthday', name, 'text', 'placeholder="Name"') + fld('bdD', 'Date', date, 'date') +
    `<div class="fields2">${fld('bdA', 'Presents (£)', '', 'number', 'step="1" min="0" inputmode="decimal" placeholder="e.g. 150"')}${fld('bdP', 'Party or day out (£)', '', 'number', 'step="1" min="0" inputmode="decimal" placeholder="Optional"')}</div>
    <p class="note">The app saves a little each month until the day, and counts it in each month's Budget Sheet.</p>`, async () => {
    const n = v('bdN').trim(), d = v('bdD'), a = num(v('bdA')) || 0, party = num(v('bdP')) || 0; if (!n) throw new Error('Say whose birthday it is'); if (!d) throw new Error('Pick the date');
    let ym = payYm(d); const cur = plCur(); if (ym < cur) ym = cur;
    const items = [{ id: uid('pi'), n: `Presents for ${n}`, a, how: 'save', ym, cat: 'gift', via: 'card' }];

/* what each person got last time */
function giftHistory(p, it) {
  const who = xName(it.n).toLowerCase();
  return (S.plans || []).filter(q => isGift(q) && q.id !== p.id && (q.from || '') < (p.from || '9')).sort((a, b) => (a.from || '') < (b.from || '') ? 1 : -1)
    .map(q => { const m = (q.items || []).find(x => xName(x.n).toLowerCase() === who); return m && giftsOf(m).length ? { q, m } : null; }).filter(Boolean).slice(0, 2);
}

/* after the day: how it went, and next year's budgets from it */
function giftReview(p) {
  const items = p.items || [], gifts = items.flatMap(giftsOf), end = p.to || p.from, t = today();
  if (!gifts.length || !((end && t > end) || gifts.every(g => g.got))) return '';
  const rows = items.map(it => ({ it, name: xIsPerson(it) ? xName(it.n) : it.n, bud: Number(it.a) || 0, act: giftSpent(it) })).filter(r => r.bud || r.act);
  const tb = rows.reduce((s, r) => s + r.bud, 0), ta = rows.reduce((s, r) => s + r.act, 0), peak = Math.max(1, ...rows.map(r => Math.max(r.bud, r.act)));
  const next = p.kind === 'christmas' ? (S.plans || []).filter(q => q.kind === 'christmas' && (q.from || '') > (p.from || '')).sort((a, b) => a.from < b.from ? -1 : 1)[0] : null;
  const months = next ? Math.max(1, ymDiff(next.saveFrom || plCur(), payYm(next.from)) + 1) : 0, sugg = Math.ceil(ta / 50) * 50;
  return `<section class="panel"><h2>How it went <span class="sub ${ta <= tb ? 'good' : 'find'}">${ta <= tb ? `${m2(tb - ta)} under budget` : `${m2(ta - tb)} over budget`}</span></h2>
    <div class="rv-leg"><span><i class="rv-b"></i>Budget</span><span><i class="rv-a"></i>Spent</span></div>
    <div class="rv-rows">${rows.map(r => `<div class="rv-r"><span class="rv-n">${esc(r.name)}</span><div class="rv-bars"><i class="rv-b" style="width:${r.bud / peak * 100}%"></i><i class="rv-a ${r.act > r.bud + .5 ? 'over' : ''}" style="width:${r.act / peak * 100}%"></i></div><b>${m2(r.act)}</b></div>`).join('')}</div>
    <p class="note">${m2(ta)} spent of ${m2(tb)} planned.${next ? ` Spending the same next time is about ${money(sugg,0)}, which is ${money(sugg / months, 0)} a month over ${nOf(months, 'month')}.` : ''}</p>
    ${next ? `<div class="btnrow"><button class="btn small" data-act="xnext" data-plan="${esc(p.id)}" data-next="${esc(next.id)}">Set ${esc(occName(next))} from this</button></div>` : ''}</section>`;
}
async function xApplyNext(fromId, nextId) {
  const p = (S.plans || []).find(x => x.id === fromId), q = (S.plans || []).find(x => x.id === nextId); if (!p || !q) return;
  const tpl = (q.items || [])[0] || { how: 'save', ym: payYm(q.from), cat: 'gift', via: 'card' }, items = [...(q.items || [])];
  (p.items || []).forEach(it => { const act = giftSpent(it); if (!act) return; const a = Math.ceil(act / 5) * 5, i = items.findIndex(x => xName(x.n).toLowerCase() === xName(it.n).toLowerCase());
    if (i >= 0) items[i] = { ...items[i], a }; else items.push({ id: uid('pi'), n: it.n, a, how: tpl.how, ym: tpl.ym, from: tpl.from, cat: itemCat(it), via: 'card' }); });
  const { id, ...rest } = q; await put(`plans/${q.id}`, { ...rest, items }); toast(`${occName(q)} budgets updated`);
}

/* wish lists: wish/main = { lists: { key: { name, items:[{id,n,link,at,taken}] } } } */
const wishKey = n => String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const wishList = n => ((S.wish && S.wish.lists) || {})[wishKey(n)] || { name: n, items: [] };
async function saveWish(name, items) { const lists = { ...((S.wish && S.wish.lists) || {}) }; lists[wishKey(name)] = { name, items }; await put('wish/main', { lists }); }
function wishKids(p) {
  const people = (p.items || []).filter(xIsPerson), top = Math.max(0, ...people.map(i => Number(i.a) || 0));
  const kids = people.filter(i => top && (Number(i.a) || 0) >= top * .8).map(i => xName(i.n));
  Object.values((S.wish && S.wish.lists) || {}).forEach(l => { if (l.items.length && !kids.some(k => wishKey(k) === wishKey(l.name))) kids.push(l.name); });
  return kids;
}
function wishPanel(p) {

/* on the day: today's plan, weather, euros left, tonight's bed */
const WX = {};
const wxTown = pl => { if (/disney/i.test(pl)) return 'Chessy'; const parts = String(pl).split(',').map(s => s.trim()).filter(Boolean); let s = parts.length > 1 ? parts[parts.length - 1] : parts[0] || ''; return s.replace(/\b\d{4,5}\b/g, '').replace(/premier inn|port of|hotel|crowne plaza|travelodge/ig, '').trim() || s; };
const WXI = c => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️' : c <= 77 ? '🌨️' : c <= 82 ? '🌦️' : c <= 86 ? '🌨️' : '⛈️';
function wxFetch(town, date) {
  const k = `${town}|${date}`; if (WX[k]) return WX[k] === 'busy' ? null : WX[k]; WX[k] = 'busy';
  (async () => { try {
    const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&name=${encodeURIComponent(town)}`)).json(), loc = g.results && g.results[0]; if (!loc) throw 0;
    const f = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${date}&end_date=${date}`)).json();
    const d = f.daily; WX[k] = { town: loc.name, code: d.weather_code[0], hi: Math.round(d.temperature_2m_max[0]), lo: Math.round(d.temperature_2m_min[0]), rain: d.precipitation_probability_max[0] }; schedule();
  } catch (e) { WX[k] = { none: true }; } })();
  return null;
}
function tripEuroToday(p) {
  const gbp = (p.items || []).filter(it => it.how !== 'zilch' && itemVia(it) === 'revolut').reduce((s, it) => s + (Number(it.a) || 0), 0); if (!gbp) return null;
  const rate = Number(p.rate) || 1.19, eur = gbp * rate, spent = (p.spend || []).reduce((s, x) => s + (Number(x.a) || 0), 0), fr = (p.days || []).filter(d => /calais|france|disney/i.test(d.t + ' ' + (d.places || []).join(' '))).map(d => d.d).sort();
  const from = fr[0] || p.from, to = fr[fr.length - 1] || p.to || from, t = today(); if (!(t >= from && t <= to)) return null;
  const days = Math.max(1, daysBetween(from, to) + 1); return Math.round(eur / days * (daysBetween(from, t) + 1) - spent);
}

}

/* payday check-in: bsheet/<ym>.ci = { inc, jobs, done } */
function checkinCard() {
  const cur = plCur(), pd = payday(cur), t = today(), doc = S.bsheet[cur]; if (!doc || t < pd || daysBetween(pd, t) > 6) return '';
  const ci = doc.ci || {}; if (ci.done) return '';
  const tot = bsTotals(doc, cur), inc = (doc.inc || []).filter(bsOn).map(x => ({ n: String(x.n || '').replace(/['’]s? wages|\s*wages/i, '').trim() || x.n, a: Number(x.a) || 0 }));
  if (doc.viki && !doc.viki.off) inc.push({ n: 'Viki', a: tot.viki });
  const jobs = []; (S.plans || []).filter(p => !isGift(p)).forEach(p => tripSteps(p).forEach(g => { if (g.ym === cur) g.steps.forEach(s => { if (s.kind === 'do') jobs.push({ p, s }); }); }));
  const pj = potJob(cur); if (pj) jobs.push({ p: { id: '__pot' }, s: pj });
  const left = jobs.filter(j => !j.s.done).length, step = !ci.inc ? 1 : !ci.jobs && left ? 2 : 3;
  const dot = (i, lbl) => `<span class="ci-dot ${i < step ? 'ok' : i === step ? 'now' : ''}">${i < step ? '✓' : i}</span><span class="ci-lbl">${lbl}</span>`;
  const s1 = `<div class="ci-s ${step === 1 ? 'now' : 'ok'}"><div class="ci-h">${dot(1, 'What came in')}</div>${step === 1 ? `<div class="ci-inc">${inc.map(x => `<div><span>${esc(x.n)}</span><b>${money(x.a, 0)}</b></div>`).join('')}<div class="tot"><span>Total</span><b>${money(tot.inc, 0)}</b></div></div><div class="btnrow"><button class="btn small" data-act="ciok" data-k="inc">Yes, that's right</button><button class="btn small ghost" data-act="ciinc">It was different</button></div>` : `<div class="ci-done">${money(tot.inc, 0)} came in</div>`}</div>`;
  const s2 = `<div class="ci-s ${step === 2 ? 'now' : step > 2 ? 'ok' : ''}"><div class="ci-h">${dot(2, 'This month\'s money jobs')}</div>${step === 2 ? `${jobs.map(j => stepRow(j.p, j.s)).join('')}<div class="btnrow"><button class="btn small ghost" data-act="ciok" data-k="jobs">Done for now</button></div>` : step > 2 ? `<div class="ci-done">${jobs.length - left} of ${jobs.length} done</div>` : ''}</div>`;
  const s3 = `<div class="ci-s ${step === 3 ? 'now' : ''}"><div class="ci-h">${dot(3, 'How the month ends')}</div>${step === 3 ? `<div class="ci-end ${tot.left >= 0 ? 'good' : 'find'}"><b>${tot.left >= 0 ? `${money(tot.left, 0)} to spare` : `${money(-tot.left, 0)} to find`}</b><span>${tot.left >= 0 ? 'Brilliant. That can go in the holiday pot.' : 'The holiday pot can cover it.'}</span></div><div class="btnrow"><button class="btn small" data-act="ciok" data-k="done">Finish check-in 🎉</button></div>` : ''}</div>`;

}

/* ===== Viki's pay forecast from the rota and her logged call-outs ===== */

}
function rotaEnd() { let e = ''; Object.values(CAL.days || {}).forEach(d => { if (d.who === 'viki' && d.date > e) e = d.date; }); Object.values(S.days).forEach(d => { if (d.who === 'viki' && d.date > e) e = d.date; }); return e; }

function viewFuel() {

function sheetDrag() {
  const sh = $('#sheetForm'); if (!sh) return; let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive:true });
  sh.addEventListener('touchmove', e => { if (y0===null) return; dy = e.touches[0].clientY - y0; if (dy > 0 && sh.scrollTop <= 0) sh.style.transform = `translateY(${dy}px)`; }, { passive:true });
  sh.addEventListener('touchend', () => { if (y0===null) return; sh.style.transition = ''; if (dy > 110) closeSheet(); else sh.style.transform = ''; y0 = null; });

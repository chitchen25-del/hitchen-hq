<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hitchen HQ</title>
<meta name="description" content="Hitchen family work, money and car">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070B13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hitchen HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<style>
/* Hitchen HQ — drawing-sheet design system.
   Pages open with a title block (the grid in the corner of an engineering drawing) holding that page's live facts.
   One variable family (Archivo) in three widths: expanded for titles and figures, normal for reading, condensed for labels.
   Prussian ink on drafting film; Manx red is reserved for "today" and things that need attention.
   Person colours match the Google Calendar colour rules: Viki Flamingo, Chris Peacock. */
:root{
  --film:#E6ECEA; --sheet:#FAFCFB; --sheet-2:#EEF2F1; --ink:#14263A; --ink-2:#34495E; --muted:#5A6A77;
  --rule:rgba(20,38,58,.13); --rule-2:rgba(20,38,58,.30);
  --red:#C8102E; --red-soft:#F9DEE2;
  --chris:#0A6B9E; --chris-bar:#039BE5; --chris-soft:#DCEFF9;
  --viki:#B4443A; --viki-bar:#E67C73; --viki-soft:#FBE3E0;
  --oc:#3F51B5; --oc-soft:#E2E5F6;
  --gold:#855D00; --gold-bar:#F6BF26; --gold-soft:#FBEFC9;
  --good:#0B7A3E; --good-bar:#33B679; --good-soft:#DAF1E3;
  --bad:#C8102E; --bad-soft:#F9DEE2;
  /* aliases used in inline styles */
  --bg:var(--film); --surface:var(--sheet); --surface-2:var(--sheet-2); --line:var(--rule);
  --accent:var(--ink); --accent-ink:var(--sheet); --accent-soft:var(--sheet-2); --viki-on:var(--viki-bar);
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-frame:5px; --r-panel:12px; --r-ctl:9px; --r-tag:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --film:#0A1522; --sheet:#102033; --sheet-2:#172B43; --ink:#DCE6EE; --ink-2:#B3C3D1; --muted:#8C9FB2;
  --rule:rgba(220,230,238,.11); --rule-2:rgba(220,230,238,.27);
  --red:#FF5468; --red-soft:#3A1520;
  --chris:#5EC2F2; --chris-soft:#0E2D44; --viki:#F4A39B; --viki-soft:#3B1E22; --oc:#A3ACF2; --oc-soft:#1D2452;
  --gold:#F6BF26; --gold-soft:#332809; --good:#4CC38A; --good-soft:#11301F; --bad:#FF5468; --bad-soft:#3A1520;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --film:#0A1522; --sheet:#102033; --sheet-2:#172B43; --ink:#DCE6EE; --ink-2:#B3C3D1; --muted:#8C9FB2;
  --rule:rgba(220,230,238,.11); --rule-2:rgba(220,230,238,.27);
  --red:#FF5468; --red-soft:#3A1520;
  --chris:#5EC2F2; --chris-soft:#0E2D44; --viki:#F4A39B; --viki-soft:#3B1E22; --oc:#A3ACF2; --oc-soft:#1D2452;
  --gold:#F6BF26; --gold-soft:#332809; --good:#4CC38A; --good-soft:#11301F; --bad:#FF5468; --bad-soft:#3A1520;
  color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--film);margin:0}
img{max-width:100%}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--film)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.x-wide{font-stretch:125%;font-weight:800;letter-spacing:-.01em}
.login{max-width:420px;margin:8vh auto 0;width:100%}

/* header and tab bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--film);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-stretch:125%;font-weight:800;font-size:1.5rem;margin:0;letter-spacing:-.015em;line-height:1.1}
.brand small{color:var(--muted);font-size:.82rem;font-stretch:87%}
.iconbtn{border:1px solid var(--rule-2);background:var(--sheet);border-radius:var(--r-ctl);width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule-2);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{position:relative;border:0;background:none;padding:10px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.76rem;font-stretch:87%;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:750}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:26%;right:26%;height:3px;background:var(--red);border-radius:0 0 2px 2px}

/* title block: the signature element */
.tblock{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-frame);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:13px 14px 12px}
.tb-kicker{font-stretch:75%;font-weight:600;font-size:.84rem;color:var(--muted)}
.tb-title{font-stretch:125%;font-weight:800;font-size:1.6rem;line-height:1.05;letter-spacing:-.015em}
.tb-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.tb-side .big{font-stretch:125%;font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.02em}
.tb-cells{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));border-top:1px solid var(--rule-2)}
.tb-cell{padding:9px 12px 11px;border-left:1px solid var(--rule-2);min-width:0;display:flex;flex-direction:column;gap:1px}
.tb-cell:first-child{border-left:0}
.tb-cell .lb{font-stretch:75%;font-weight:600;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tb-cell .lb i{width:8px;height:8px;border-radius:2px;flex:none}
.tb-cell .vl{font-stretch:112%;font-weight:700;font-size:1rem;line-height:1.2;overflow-wrap:anywhere}
.tb-cell .vl small{font-weight:500;font-stretch:100%;color:var(--muted);font-size:.8rem}
.tb-cells.two .tb-cell:nth-child(odd){border-left:0}
.tb-cells.two .tb-cell:nth-child(n+3){border-top:1px solid var(--rule-2)}
.tb-foot{border-top:1px solid var(--rule-2);padding:9px 12px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.86rem;color:var(--ink-2)}
.tb-foot b{color:var(--ink)}
.tb-foot .alert{color:var(--red);font-weight:700}
.tb-bar{padding:0 14px 12px}
@media (max-width:370px){.tb-cells{--n:2!important}.tb-cell:nth-child(3){border-left:0;border-top:1px solid var(--rule-2)}.tb-title{font-size:1.35rem}}

/* panels and headings */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-panel);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-stretch:118%;font-weight:780;font-size:1.06rem;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:-.005em}
.panel h2 .sub{font-stretch:100%;font-weight:500;font-size:.84rem;color:var(--muted)}
.eyebrow{font-stretch:75%;font-weight:650;font-size:.84rem;color:var(--muted)}
.note{font-size:.86rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem;padding:4px 0}
.banner{background:var(--gold-soft);color:var(--ink);border-left:3px solid var(--gold);border-radius:var(--r-tag);padding:10px 12px;font-size:.88rem;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* tabs inside a page */
.seg{display:flex;gap:20px;border-bottom:1px solid var(--rule-2);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:none;padding:10px 0 9px;margin-bottom:-1px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:650;font-size:.96rem}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--red)}
.seg.who{gap:0}
.seg.who button{flex:1;font-stretch:118%;font-weight:780;font-size:1.05rem;padding:11px 0 10px}
.seg.who button[data-who="chris"][aria-pressed="true"]{border-bottom-color:var(--chris-bar);color:var(--chris)}
.seg.who button[data-who="viki"][aria-pressed="true"]{border-bottom-color:var(--viki-bar);color:var(--viki)}
.tsec .seg{border-bottom-color:var(--rule)}

/* figures */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--sheet-2);border-radius:8px;padding:10px 12px;min-width:0}
.stat b{display:block;font-stretch:125%;font-weight:800;font-size:1.35rem;line-height:1.15}
.stat span{font-size:.8rem;color:var(--muted)}
/* gauge: quarter ticks over the track */
.bar{height:8px;background:var(--sheet-2);border-radius:2px;overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--rule-2) calc(25% - 1px) 25%);pointer-events:none}
.bar i{display:block;height:100%;background:var(--ink);border-radius:2px 0 0 2px}
.bar i.over{background:var(--red)} .bar i.good{background:var(--good-bar)}
.bar.lg{height:12px}

/* lists */
.list{display:flex;flex-direction:column}
.row,.rowbtn{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);min-width:0}
.row:first-child,.rowbtn:first-child{border-top:0}
.rowbtn{all:unset;display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);cursor:pointer;min-width:0}
.rowbtn:first-child{border-top:0}
.row .grow,.rowbtn .grow,.grow{flex:1;min-width:0}
.t{font-weight:650;overflow-wrap:anywhere}
.m{font-size:.82rem;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap;font-stretch:112%}
.rowbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-tag);padding:2px 7px;font-size:.76rem;font-weight:650;font-stretch:87%;white-space:nowrap}
.chip.due{background:var(--red-soft);color:var(--red)} .chip.soon{background:var(--gold-soft);color:var(--gold)} .chip.ok{background:var(--good-soft);color:var(--good)}
.chip.cat{background:var(--sheet-2);color:var(--muted)}
.btn{border:0;border-radius:var(--r-ctl);padding:11px 15px;font-weight:680;cursor:pointer;background:var(--ink);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-2)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.small{padding:7px 11px;font-size:.86rem;border-radius:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}

/* month calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-stretch:118%;font-weight:780;font-size:1.06rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.74rem;font-stretch:75%;text-align:center;color:var(--muted);font-weight:650;padding-bottom:2px}
.cal button{aspect-ratio:1/1.08;max-width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;min-width:0}
.cal button .d{font-size:.9rem;font-weight:750;font-stretch:112%}
.cal button .l{font-size:.64rem;line-height:1.1;font-weight:650;font-stretch:87%;text-align:center;overflow:hidden;max-width:100%;white-space:nowrap;text-overflow:ellipsis}
.cal button.today{box-shadow:inset 0 0 0 2px var(--red);border-color:var(--red)}
.cal button.pad{visibility:hidden}
.st-work{background:var(--chris-soft)!important;color:var(--chris)} .st-shift{background:var(--viki-soft)!important;color:var(--viki)}
.st-oncall{background:var(--oc-soft)!important;color:var(--oc)}
.st-callout{background:var(--gold-soft)!important;color:var(--gold)} .st-holiday{background:var(--good-soft)!important;color:var(--good)}
.st-sick{background:var(--bad-soft)!important;color:var(--bad)} .st-off{background:var(--sheet-2)!important;color:var(--muted)}
.fromcal{border-style:dashed!important}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold-bar);display:inline-block}
.moon{color:var(--oc);font-size:.8rem;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .chip{border:1px solid var(--rule)}

/* sheet (forms) */
.scrim{position:fixed;inset:0;background:rgba(8,16,26,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;border-top:1.5px solid var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px}
.sheet h3{font-stretch:125%;font-weight:800;font-size:1.3rem;margin:0;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.84rem;font-stretch:87%;font-weight:650;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--rule-2);background:var(--film);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields3{display:grid;grid-template-columns:1fr 1fr .8fr;gap:8px}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:650;font-size:.88rem}
.choice button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:-2px}
.choice button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.err{color:var(--red);font-size:.86rem}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--rule);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:9px 14px;border-radius:8px;font-weight:700;z-index:50;font-size:.9rem}

/* home */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wcol{border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.wcol .wd{font-size:.72rem;font-stretch:75%;color:var(--muted);font-weight:650}
.wcol .wn{font-stretch:118%;font-size:1.12rem;font-weight:800;line-height:1.15}
.wcol .wbars{display:flex;flex-direction:column;gap:3px;width:100%;padding:3px 5px 0;min-height:34px}
.wcol .wbars i{display:block;height:5px;border-radius:2px}
.wcol .wbars em{font-style:normal;font-size:.6rem;color:var(--muted);font-weight:700;text-align:center;line-height:1}
.wcol.today .wd{color:var(--red)}
.wcol.sel{background:var(--ink);border-color:var(--ink)}
.wcol.sel .wd,.wcol.sel .wn,.wcol.sel .wbars em{color:var(--sheet)}
.wcol.sel.today .wd{color:var(--sheet)}
.agenda{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.evb{display:flex;align-items:center;gap:12px;border-radius:6px;padding:9px 11px;background:color-mix(in srgb,var(--c) 14%,var(--sheet));border-left:4px solid var(--c)}
.evbt{flex:none;width:50px;font-size:.82rem;font-weight:700;font-stretch:87%;color:var(--ink-2)}
.evb .t{font-weight:650}.evb .m{font-size:.8rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-panel);padding:12px 13px 13px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tile .tl{font-size:.84rem;font-stretch:75%;color:var(--muted);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tv{font-stretch:125%;font-size:1.6rem;font-weight:800;line-height:1.1;letter-spacing:-.015em}
.tile .ts{font-size:.8rem;color:var(--muted)}
.tile .bar{margin-top:4px}
.bdate{width:44px;flex:none;text-align:center;border:1px solid var(--rule-2);border-radius:6px;padding:4px 0 3px;line-height:1.05}
.bdate b{display:block;font-stretch:118%;font-weight:800;font-size:1.08rem}
.bdate span{font-size:.7rem;color:var(--muted);font-weight:650;font-stretch:75%}
.bdate.today{border-color:var(--red)} .bdate.today span{color:var(--red)}

/* money */
.mix{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;margin:0 14px 2px}
.mix i{display:block;height:100%}
.mixleg{display:flex;flex-direction:column;border-top:1px solid var(--rule-2);margin-top:12px}
.impsel{margin-top:6px;border:1px solid var(--rule-2);background:var(--film);border-radius:8px;padding:6px 8px;max-width:100%}
.mixleg div{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--rule);min-width:0;font-size:.9rem}
.mixleg div:first-child{border-top:0}
.mixleg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixleg em{font-style:normal;color:var(--muted);font-size:.82rem;width:3.2em;text-align:right}
.mixleg b{font-stretch:112%;min-width:4.6em;text-align:right}
.dgroup{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.dgroup:first-child{border-top:0}
.dgroup .items{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bitem{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0}
.bitem .t{font-weight:600}
.cathead{display:flex;align-items:center;gap:8px;padding:12px 0 4px;border-top:1px solid var(--rule-2);font-stretch:112%;font-weight:750}
.cathead:first-child{border-top:0;padding-top:2px}
.cathead .nm{flex:1}
.cathead em{font-style:normal;font-weight:600;color:var(--muted);font-stretch:100%;font-size:.86rem}
.gauge{display:flex;flex-direction:column;gap:6px;padding:11px 0;border-top:1px solid var(--rule)}
.gauge:first-child{border-top:0}
.gauge .gh{display:flex;align-items:baseline;gap:8px}
.gauge .gh .t{flex:1}
.gauge .gh .amt small{font-weight:500;color:var(--muted);font-stretch:100%}
.insight{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--rule);align-items:flex-start}
.insight:first-child{border-top:0}
.insight i{width:4px;align-self:stretch;border-radius:2px;flex:none}

/* family calendar settings */
.colrow{display:flex;align-items:center;gap:8px}
.colrow input,.colrow select{border:1px solid var(--rule-2);background:var(--film);border-radius:8px;padding:9px 10px;min-width:0}
.colrow input{flex:1}
.colrow .sw{width:16px;height:16px;border-radius:50%}
.rules{display:flex;flex-direction:column;gap:6px}

/* Viki: payslip, week strip, timesheet */
.vslip .stack{display:flex;height:10px;border-radius:2px;overflow:hidden;gap:2px;margin:0 14px}
.vslip .stack i{display:block;height:100%}
.vslip details{border-top:1px solid var(--rule-2);margin-top:12px;padding:10px 14px 12px;font-size:.88rem}
.vslip summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
.vslip dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:10px 0 4px}
.vslip dd{margin:0;text-align:right;font-weight:650}
.vslip dl .tot{font-weight:800;border-top:1px solid var(--rule-2);padding-top:5px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week button{border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.week .wd{font-size:.72rem;font-stretch:75%;color:var(--muted);font-weight:650}
.week .wn{font-size:1rem;font-weight:800;font-stretch:112%}
.week .wh{font-size:.7rem;font-weight:700;min-height:1em;font-stretch:87%}
.week button.today{box-shadow:inset 0 0 0 2px var(--red);border-color:var(--red)}
.tbl{overflow-x:auto;margin:0 -14px;padding:0 14px}
.tbl table{border-collapse:collapse;font-size:.82rem;min-width:480px;width:100%}
.tbl th{font-size:.74rem;font-stretch:75%;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1.5px solid var(--ink);white-space:nowrap;font-weight:650}
.tbl th.grp{text-align:center;border-bottom:1px solid var(--rule-2);font-stretch:100%;font-weight:700;color:var(--ink-2)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tfoot td{font-weight:800;border-bottom:0;border-top:1.5px solid var(--ink)}
.tbl .co-col{background:color-mix(in srgb,var(--gold-bar) 12%,transparent)}
.tbl tr[data-act]{cursor:pointer}
.tsec{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tsec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tsec-h b{font-stretch:118%;font-weight:780;font-size:1.02rem}
.pill{border-radius:var(--r-tag);padding:3px 8px;font-size:.82rem;font-weight:700;background:var(--sheet-2);white-space:nowrap}
.pill.v{background:var(--viki-soft);color:var(--viki)} .pill.a{background:var(--oc-soft);color:var(--oc)} .pill.g{background:var(--gold-soft);color:var(--gold)}
.out{border:1px dashed var(--rule-2);border-radius:8px;padding:10px 11px;font-weight:700;text-align:center}
.co{background:var(--sheet-2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.co .fields3 .field input,.co .field input{background:var(--sheet)}
.co-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.86rem;font-weight:700}
.co-top .x{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:0 4px}
.multbtn{border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold);border-radius:var(--r-tag);padding:3px 9px;font-weight:700;font-size:.8rem;cursor:pointer}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
.vsum{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--ink);border-radius:var(--r-frame);padding:10px 12px;font-weight:700}
.vsum b{font-stretch:125%;font-weight:800;font-size:1.3rem}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule-2);border:1px solid var(--rule-2);border-radius:var(--r-frame);overflow:hidden}
.rate{background:var(--sheet);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rate .rl{font-size:.82rem;font-stretch:75%;color:var(--muted);font-weight:650}
.rate .rv{font-stretch:118%;font-size:1.25rem;font-weight:800}
.rate .rs{font-size:.78rem;color:var(--muted)}

/* badges, icons, live state */
.pb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:.66rem;font-weight:800;font-stretch:100%;color:#fff;flex:none;line-height:1}
.pb-viki{background:var(--viki-bar)} .pb-chris{background:var(--chris-bar)} .pb-pay{background:var(--gold-bar);color:#3A2A00}
.tb-cell .lb .pb{width:16px;height:16px;font-size:.6rem}
.tb-cell .vl small.sub,.tb-cell .vl .sub{display:block;font-size:.8rem;font-weight:500;font-stretch:100%;color:var(--muted);margin-top:1px}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good-bar);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px color-mix(in srgb,var(--good-bar) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){.livedot{animation:live 2s ease-in-out infinite}@keyframes live{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--good-bar) 0%,transparent)}}}
.ic{width:18px;height:18px;flex:none;display:block}
.evi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 22%,var(--sheet));color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.evb{border-left:0!important;padding:8px 10px!important;background:color-mix(in srgb,var(--c) 9%,var(--sheet))!important}
.evb .t{line-height:1.25}
.hint{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.hint .ic{width:16px;height:16px}
/* quieter surfaces: the title block is the only framed element */
.panel{border-color:transparent}
.tile{border-color:transparent}
.tile .tl{display:flex;align-items:center;gap:6px}
/* loading placeholders */
.skel{height:56px;border-radius:10px;background:linear-gradient(90deg,var(--sheet) 0%,var(--sheet-2) 40%,var(--sheet) 80%);background-size:200% 100%}
.skel.tall{height:170px;border-radius:var(--r-frame)}
@media (prefers-reduced-motion:no-preference){.skel{animation:shim 1.3s linear infinite}@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}}
/* quick add, pull to refresh, sheet handle */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;width:54px;height:54px;border-radius:16px;border:0;background:var(--ink);color:var(--sheet);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(8,16,26,.28)}
.fab svg{width:24px;height:24px}
.qi{width:36px;height:36px;border-radius:10px;background:var(--sheet-2);display:grid;place-items:center;flex:none}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;transition:height .15s ease}
.ptr span{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--rule-2);border-top-color:var(--ink)}
.ptr.ready span{border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.ptr.busy span{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--rule-2);margin:-6px auto 2px;flex:none}
.sheet{transition:transform .2s ease}
/* lists */
.listadd{display:flex;gap:8px}
.listadd input{flex:1;min-width:0;border:1px solid var(--rule-2);background:var(--film);border-radius:8px;padding:10px 11px}
.check .grow{flex:1}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{stroke:var(--rule-2);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:10px;font-stretch:87%;font-weight:600}
.chart .val{fill:var(--ink-2);font-size:10.5px;font-weight:700}
.chart .pace{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.chart .line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .line.over{stroke:var(--red)}
.chart .pt{fill:var(--ink);stroke:var(--sheet);stroke-width:2}
.chart .pt.over{fill:var(--red)}
.cleg{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2)}
.cleg span{display:inline-flex;align-items:center;gap:6px}
.cleg i{width:10px;height:10px;border-radius:2px}
:root{--c-oc:#3F51B5;--c-co:#C98A00;--c-in:#0B8043;--c-out:#3F51B5;--g1:#3F51B5;--g2:#C98A00;--g3:#C62828;--g4:#0097A7}
.hbar{height:6px;border-radius:3px;background:var(--sheet-2);margin-top:6px;overflow:hidden}.hbar i{display:block;height:100%;border-radius:3px}
.catrow{padding:9px 0!important}.catdetail{background:var(--sheet-2);border-radius:8px;padding:4px 12px 10px;margin:2px 0 6px}.catdetail .row{padding:7px 0;font-size:.9rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-oc:#6F7DE0;--c-co:#B5850C;--c-in:#2E9E62;--c-out:#6F7DE0;--g1:#6F7DE0;--g2:#B5850C;--g3:#D2386C;--g4:#1FA5B4}}
:root[data-theme="dark"]{--c-oc:#6F7DE0;--c-co:#B5850C;--c-in:#2E9E62;--c-out:#6F7DE0;--g1:#6F7DE0;--g2:#B5850C;--g3:#D2386C;--g4:#1FA5B4}

.blc-chip{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:.72rem;font-weight:700;line-height:1.5;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--blc) 13%,transparent);color:var(--blc);white-space:nowrap}
.blc-chip svg{width:12px;height:12px;flex:none}.blc-chip.off{background:var(--sheet-2);color:var(--ink-2)}
.amt .blc-chip{margin-top:0}
.blc-banner{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;margin:2px 0 12px;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--blc) 30%,transparent);background:color-mix(in srgb,var(--blc) 8%,var(--sheet))}
.blc-banner svg{width:20px;height:20px;color:var(--blc);flex:none;margin-top:1px}.blc-banner b{display:block;color:var(--blc)}.blc-banner small{display:block;color:var(--ink-2);margin-top:2px}
.blc-pw{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;display:block;width:calc(100% - 24px);margin:4px 12px 0;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--blc) 30%,transparent);background:color-mix(in srgb,var(--blc) 7%,var(--sheet))}
.blc-pw-h{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--blc);font-size:.9rem}.blc-pw-h svg{width:16px;height:16px}
.blc-pw ul{margin:6px 0 4px;padding-left:18px;font-size:.88rem}.blc-pw li{margin:2px 0}.blc-pw small{display:block;color:var(--ink-2);font-size:.78rem}
.blc-h{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:16px 0 4px}
.blc-row.none .t{color:var(--ink-2)}
:root{--blc:#1858C4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--blc:#7FA8F5}}
:root[data-theme="dark"]{--blc:#7FA8F5}

.od-row .t small.od-via{font-weight:500;color:var(--ink-2);font-size:.82rem}
.od-note{white-space:pre-line}
.chip.od-st{font-size:.7rem}.chip.od-st.bad{background:color-mix(in srgb,#D50000 14%,transparent);color:#C62828}.chip.od-st.warn{background:color-mix(in srgb,#C98A00 16%,transparent);color:#9A6A00}.chip.od-st.ok{background:color-mix(in srgb,#0B8043 14%,transparent);color:#0B8043}
:root[data-theme="dark"] .chip.od-st.bad{color:#FF8A80}:root[data-theme="dark"] .chip.od-st.warn{color:#FFD27A}:root[data-theme="dark"] .chip.od-st.ok{color:#7FD8A6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.od-st.bad{color:#FF8A80}:root:not([data-theme="light"]) .chip.od-st.warn{color:#FFD27A}:root:not([data-theme="light"]) .chip.od-st.ok{color:#7FD8A6}}
.od-f{margin:0 0 10px}
.od-facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:.92rem}.od-facts dt{color:var(--ink-2)}.od-facts dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}.od-facts.small{margin-bottom:12px;font-size:.88rem}
.od-time{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--rule-2)}.od-time li{position:relative;padding:0 0 12px 8px;display:flex;flex-direction:column;gap:1px}.od-time li::before{content:'';position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink-2)}.od-time li.future::before{border-style:dashed}.od-time b{font-size:.8rem;color:var(--ink-2)}.od-time li span{font-size:.92rem}
.od-open{font-size:.85rem;font-weight:700}.od-c{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:.85rem}.od-c a{color:inherit}

.linkbtn{all:unset;cursor:pointer;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2)}
.linkbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.panel h2 .btnrow{gap:6px}
.btn .ic{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:4px}
#printRoot{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body>*:not(#printRoot){display:none!important}
  body::before{display:none}
  html,body{background:#fff}
  #printRoot{display:block;color:#000;font-family:var(--font)}
  .pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .pr-k{font-size:10pt}
  .pr h1{font-stretch:125%;font-weight:800;font-size:20pt;margin:0}
  .pr-meta{display:flex;gap:24px}.pr-meta div{display:flex;flex-direction:column;font-size:10pt}.pr-meta b{font-size:12pt}
  .pr table{width:100%;border-collapse:collapse;font-size:10pt}
  .pr th,.pr td{border:1px solid #000;padding:5px 6px;text-align:left}
  .pr th{background:#eee;font-weight:700}
  .pr tfoot td{font-weight:800}
  .pr-sign{display:flex;gap:30px;margin-top:28px}.pr-sign div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:10pt}
}
@media (max-width:380px){.fields2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ===== Premium layer =====
   Quiet luxury, after the cabin of the family's Range Rover: porcelain and white surfaces with soft depth,
   one midnight "instrument" card opening each page, brass for the figures that matter, a floating glass tab bar.
   One typeface (Instrument Sans) at light, refined weights; motion only on page changes, sheets and presses. */
:root{
  --font:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --film:#F2F3F5; --sheet:#FFFFFF; --sheet-2:#F1F2F4; --ink:#121826; --ink-2:#3A4352; --muted:#6B7280;
  --rule:rgba(18,24,38,.07); --rule-2:rgba(18,24,38,.14);
  --brass:#A77B3F; --brass-2:#C9A063; --brass-soft:#F6EEE2;
  --red:#C2334A; --red-soft:#FBE7EA;
  --midnight:#0D1524; --midnight-2:#16213A;
  --shadow-sm:0 1px 2px rgba(18,24,38,.05);
  --shadow:0 1px 2px rgba(18,24,38,.04),0 6px 18px -6px rgba(18,24,38,.10);
  --shadow-lg:0 2px 6px rgba(18,24,38,.06),0 18px 40px -12px rgba(18,24,38,.22);
  --r-frame:22px; --r-panel:20px; --r-ctl:12px; --r-tag:999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --film:#070B13; --sheet:#0F1626; --sheet-2:#172036; --ink:#EEF1F6; --ink-2:#C3CAD6; --muted:#8B95A7;
  --rule:rgba(238,241,246,.07); --rule-2:rgba(238,241,246,.14); --brass:#D2AE6E; --brass-2:#E6C88E; --brass-soft:#2A2214;
  --red:#FF6B7F; --red-soft:#3A1520; --midnight:#111B2E; --midnight-2:#1A2742;
  --shadow-sm:none; --shadow:0 0 0 1px rgba(238,241,246,.05),0 10px 24px -12px rgba(0,0,0,.6); --shadow-lg:0 0 0 1px rgba(238,241,246,.06),0 20px 44px -14px rgba(0,0,0,.7);}}
:root[data-theme="dark"]{
  --film:#070B13; --sheet:#0F1626; --sheet-2:#172036; --ink:#EEF1F6; --ink-2:#C3CAD6; --muted:#8B95A7;
  --rule:rgba(238,241,246,.07); --rule-2:rgba(238,241,246,.14); --brass:#D2AE6E; --brass-2:#E6C88E; --brass-soft:#2A2214;
  --red:#FF6B7F; --red-soft:#3A1520; --midnight:#111B2E; --midnight-2:#1A2742;
  --shadow-sm:none; --shadow:0 0 0 1px rgba(238,241,246,.05),0 10px 24px -12px rgba(0,0,0,.6); --shadow-lg:0 0 0 1px rgba(238,241,246,.06),0 20px 44px -14px rgba(0,0,0,.7);}
body{letter-spacing:-.005em}
*{font-stretch:normal}
h1,h2,h3,.t,.amt,.tv,.rv,b{font-stretch:normal}

/* header: large title, frosted when scrolled */
header.top{background:transparent;transition:background .2s ease,box-shadow .2s ease;padding-block:14px 10px}
header.top.scrolled{background:color-mix(in srgb,var(--film) 78%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 1px 0 var(--rule)}
body::before{background:color-mix(in srgb,var(--film) 78%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.brand h1{font-weight:650;font-size:1.75rem;letter-spacing:-.025em}
.brand small{font-size:.86rem;font-weight:500}
.iconbtn{border:0;background:var(--sheet);box-shadow:var(--shadow);border-radius:14px}
main{gap:16px;padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}

/* floating glass tab bar */
nav.tabs{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:0;border-radius:26px;
  background:color-mix(in srgb,var(--sheet) 72%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:var(--shadow-lg);max-width:560px;margin:0 auto}
nav.tabs button{border-radius:20px;padding:8px 4px 7px;font-weight:550;font-size:.72rem;transition:background .2s ease,color .2s ease}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--sheet-2);font-weight:650}
nav.tabs button[aria-current="page"]::before{display:none}
nav.tabs button[aria-current="page"] svg{color:var(--brass)}

/* the instrument card: one per page, midnight in both themes */
.tblock{background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--brass-2) 22%,transparent) 0%,transparent 55%),linear-gradient(160deg,var(--midnight-2) 0%,var(--midnight) 70%);
  border:0;border-radius:var(--r-frame);box-shadow:var(--shadow-lg);position:relative;isolation:isolate;
  --ink:#F3F5F9; --ink-2:#C9D0DC; --muted:#93A0B4; --rule:rgba(255,255,255,.08); --rule-2:rgba(255,255,255,.12); --sheet:rgba(255,255,255,.06); --sheet-2:rgba(255,255,255,.10);
  --viki:#F6B2AA; --chris:#7FD0F5; --good:#6FD39E; --red:#FF8A9A; --gold:#F0CF86; --oc:#AEB7F5; --brass:#E2BF7F; --film:rgba(255,255,255,.08); color:var(--ink)}
.tblock::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.10);z-index:-1}
.tb-head{padding:18px 18px 14px}
.tb-kicker{font-weight:500;font-size:.84rem;letter-spacing:0;color:var(--muted)}
.tb-title{font-weight:600;font-size:1.85rem;letter-spacing:-.03em;line-height:1.08}
.tb-side .big{font-weight:600;font-size:2.1rem;letter-spacing:-.03em;color:var(--brass)!important}
.tb-cells{border-top:1px solid var(--rule)}
.tb-cell{padding:12px 16px 14px;border-left:1px solid var(--rule)}
.tb-cell .lb{font-weight:550;font-size:.8rem}
.tb-cell .vl{font-weight:600;font-size:1.05rem;letter-spacing:-.01em}
.tb-foot{border-top:1px solid var(--rule);padding:12px 16px 14px;color:var(--ink-2);font-size:.88rem}
.tblock .btn.ghost,.tblock .linkbtn{color:var(--ink)}
.tblock .btn.ghost{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tblock .mix,.vslip .stack{opacity:.95}

/* sheets */

/* quick add */
.fab{width:56px;height:56px;border-radius:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));right:max(18px,env(safe-area-inset-right,0px));
  background:linear-gradient(150deg,var(--brass-2),var(--brass));color:#1B1306;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--brass) 70%,transparent),0 2px 6px rgba(0,0,0,.12)}

/* motion: page change, presses */
@media (prefers-reduced-motion:no-preference){
  main.enter>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
  main.enter>*:nth-child(2){animation-delay:.03s} main.enter>*:nth-child(3){animation-delay:.06s} main.enter>*:nth-child(n+4){animation-delay:.09s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .btn,.tile,.rowbtn,.wcol,.cal button,.week button,.fab,.iconbtn,nav.tabs button,.seg button{transition:transform .12s ease,background .18s ease,color .18s ease,box-shadow .18s ease}
  .btn:active,.tile:active,.wcol:active,.cal button:active,.week button:active,.fab:active,.iconbtn:active,nav.tabs button:active,.seg button:active{transform:scale(.96)}
  .rowbtn:active{transform:scale(.99)}
  .sheet{animation:sheetup .34s cubic-bezier(.2,.8,.2,1)}@keyframes sheetup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
}

.corow .cv{font-weight:650;font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right}
.corow .cv small{color:var(--muted);font-weight:500}
/* ===== Jazz layer: a colour for each tab, bolder headings, bright buttons, playful motion ===== */
:root{--acc:#A23BEC;--acc2:#FF6B9A}
:root[data-tab="home"]{--acc:#FF4F6D;--acc2:#FFA94D}
:root[data-tab="work"]{--acc:#3F7BEA;--acc2:#2CC4E8}
:root[data-tab="money"]{--acc:#10A56B;--acc2:#7ACB3E}
:root[data-tab="trips"],:root[data-tab="kid"]{--acc:#A23BEC;--acc2:#FF6B9A}
:root[data-tab="car"]{--acc:#F07A1A;--acc2:#FFC23D}
body{background:radial-gradient(760px 360px at 112% -6%,color-mix(in srgb,var(--acc) 15%,transparent),transparent 62%),radial-gradient(620px 320px at -18% 2%,color-mix(in srgb,var(--acc2) 13%,transparent),transparent 62%),var(--film);background-attachment:fixed;transition:background .4s ease}
.brand h1{font-weight:750;font-size:1.9rem;letter-spacing:-.03em}
.brand h1::after{content:"";display:block;width:46px;height:5px;border-radius:9px;margin-top:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.brand small{font-weight:550}
.panel>h2{font-weight:750;font-size:1.14rem;letter-spacing:-.02em}
.panel>h2::before{content:"";flex:none;width:5px;align-self:stretch;min-height:1.1em;border-radius:9px;background:linear-gradient(180deg,var(--acc),var(--acc2));margin-right:2px}
.panel>h2{justify-content:flex-start}
.panel>h2>.sub,.panel>h2>.btn,.panel>h2>button{margin-left:auto}
.m{font-size:.86rem;line-height:1.35}
.note{font-size:.88rem;line-height:1.45}
.t{font-weight:650}
.btn:not(.ghost){background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--acc2)));color:#fff;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--acc) 80%,transparent)}
.btn.ghost{color:color-mix(in srgb,var(--acc) 75%,var(--ink));background:color-mix(in srgb,var(--acc) 10%,var(--sheet-2))}
.seg button[aria-pressed="true"]{color:var(--acc);box-shadow:var(--shadow),inset 0 -3px 0 color-mix(in srgb,var(--acc) 70%,transparent)}
.bar i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.zchips button{border:0;background:color-mix(in srgb,var(--acc) 9%,var(--sheet));color:color-mix(in srgb,var(--acc) 70%,var(--ink));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 28%,transparent);font-weight:650;border-radius:999px}
nav.tabs button[data-tab="home"]{--tc:#FF4F6D} nav.tabs button[data-tab="work"]{--tc:#3F7BEA} nav.tabs button[data-tab="money"]{--tc:#10A56B} nav.tabs button[data-tab="trips"]{--tc:#A23BEC} nav.tabs button[data-tab="car"]{--tc:#F07A1A}
nav.tabs button svg{color:color-mix(in srgb,var(--tc) 70%,var(--muted))}
nav.tabs button[aria-current="page"]{background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
nav.tabs button[aria-current="page"] svg{color:var(--tc)}
.fab{background:linear-gradient(150deg,var(--acc2),var(--acc));color:#fff;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--acc) 70%,transparent),0 2px 6px rgba(0,0,0,.12)}
.tile .tv{font-weight:700}
.st-tick[aria-pressed="true"]{background:linear-gradient(135deg,#10A56B,#7ACB3E);border-color:transparent}
@media (prefers-reduced-motion:no-preference){
  main.enter .bar i,main.enter .xp-bar i,main.enter .hc-prog i,main.enter .th-bar i,main.enter .rv-bars i{animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
  @keyframes grow{from{transform:scaleX(0)}to{transform:none}}
  .st-tick[aria-pressed="true"] svg{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.2)}to{transform:none}}
}

/* tones for headed cards */
.hcard.t-party{background:radial-gradient(120% 90% at 100% 0%,rgba(255,211,107,.3),transparent 55%),linear-gradient(135deg,#4B1E8C,#B23A86 55%,#FF7A59)}

/* treat tabs */
.pltabs button{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.pltabs .pt-i{font-size:1.15rem;line-height:1}
.pltabs small{font-size:.7rem;font-weight:800;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);border-radius:99px;padding:0 6px}

/* countdown ribbon */
.cd-wrap{display:flex;flex-direction:column;gap:8px}
.cd-title{font-weight:750;font-size:1.02rem;padding:0 4px}
.cd-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.cd-row::-webkit-scrollbar{display:none}
.cd{flex:none;width:128px;scroll-snap-align:start;border:0;border-radius:20px;padding:12px 12px 12px;text-align:left;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:1px;position:relative;overflow:hidden;box-shadow:0 10px 22px -12px rgba(0,0,0,.45);font:inherit}
.cd::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-30px;top:-30px;background:rgba(255,255,255,.14)}
.cd.k-christmas{background:linear-gradient(145deg,#7A0F1E,#C62828 60%,#E5533D)}
.cd.k-birthday{background:linear-gradient(145deg,#5B2A9E,#C2457F 60%,#FF8A5B)}
.cd.k-city{background:linear-gradient(145deg,#1B1F5E,#3F51B5 60%,#7C5CE0)}
.cd.k-summer{background:linear-gradient(145deg,#D2591E,#F2A33A 60%,#FFD36B);color:#3A1C00}
.cd.k-family{background:linear-gradient(145deg,#0A5A31,#0B8043 55%,#33B679)}
.cd-i{font-size:1.3rem}
.cd-n{font-size:2rem;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:6px}
.cd-l{font-size:.74rem;font-weight:700;opacity:.85}
.cd b{font-size:.92rem;line-height:1.2;margin-top:2px}
@media (prefers-reduced-motion:no-preference){main.enter .cd{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}main.enter .cd:nth-child(2){animation-delay:.06s}main.enter .cd:nth-child(3){animation-delay:.12s}main.enter .cd:nth-child(n+4){animation-delay:.18s}}

/* occasion picker */
.occ-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.occ-row::-webkit-scrollbar{display:none}
.occ{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:108px;border:0;border-radius:16px;padding:10px 12px;background:var(--sheet);box-shadow:var(--shadow);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.occ-i{font-size:1.25rem}
.occ b{font-size:.92rem;font-weight:750}.occ b small{font-weight:600;color:var(--muted)}
.occ>small{font-size:.76rem;color:var(--muted);font-weight:600}
.occ.on{color:#fff;box-shadow:0 10px 22px -12px rgba(0,0,0,.5)}
.occ.on.k-christmas{background:linear-gradient(145deg,#7A0F1E,#C62828 70%,#E5533D)}
.occ.on.k-birthday{background:linear-gradient(145deg,#5B2A9E,#C2457F 70%,#FF8A5B)}
.occ.on small,.occ.on b small{color:rgba(255,255,255,.85)}
.occ.add{background:transparent;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent);color:var(--acc)}

/* present rows: wishes and history */
.xw{color:var(--acc);font-weight:700}
.xwish,.xhist{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 7%,transparent)}
.xhist{background:var(--sheet-2)}
.xh-h{font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.xw-chips{display:flex;flex-wrap:wrap;gap:6px}
.xw-c{border:0;border-radius:99px;padding:6px 11px;font:inherit;font-size:.86rem;font-weight:650;background:var(--sheet);color:var(--acc);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 35%,transparent);cursor:pointer}
.xw-c.taken{color:var(--good);box-shadow:none;background:color-mix(in srgb,var(--good) 12%,transparent);cursor:default}
.xh-r{font-size:.86rem;padding:3px 0}.xh-r b{display:block;font-size:.84rem}.xh-r span{color:var(--muted)}

/* how it went */
.rv-leg{display:flex;gap:14px;font-size:.8rem;color:var(--muted);font-weight:600}
.rv-leg span{display:flex;align-items:center;gap:6px}.rv-leg i{width:12px;height:8px;border-radius:4px;display:inline-block}
.rv-rows{display:flex;flex-direction:column;gap:8px}
.rv-r{display:grid;grid-template-columns:88px minmax(0,1fr) 64px;align-items:center;gap:10px;font-size:.88rem}
.rv-n{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-r b{text-align:right;font-variant-numeric:tabular-nums}
.rv-bars{display:flex;flex-direction:column;gap:3px}
.rv-bars i{display:block;height:7px;border-radius:5px}
i.rv-b{background:var(--rule-2)} i.rv-a{background:linear-gradient(90deg,var(--acc),var(--acc2))} i.rv-a.over{background:var(--red)}

/* kids' wish mode */
.kid{display:flex;flex-direction:column;gap:14px}
.kid-hero{position:relative;overflow:hidden;border-radius:26px;padding:26px 20px 22px;color:#fff;background:radial-gradient(120% 100% at 100% 0%,rgba(255,211,107,.45),transparent 55%),linear-gradient(140deg,#3B1E8C,#A23BEC 55%,#FF6B9A);box-shadow:0 18px 36px -18px rgba(90,30,140,.7)}
.kid-stars i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.7}
@media (prefers-reduced-motion:no-preference){.kid-stars i{animation:twinkle 2.4s ease-in-out infinite}@keyframes twinkle{50%{opacity:.15;transform:scale(.5)}}}
.kid-k{font-weight:800;font-size:.9rem;letter-spacing:.05em;text-transform:uppercase;opacity:.9;position:relative}
.kid-t{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:4px;position:relative}
.kid-s{font-size:1.05rem;font-weight:700;margin-top:8px;position:relative}
.kidadd{display:flex;flex-direction:column;gap:8px;background:var(--sheet);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.kidadd input{border:0;background:var(--sheet-2);border-radius:14px;padding:14px;font:inherit;font-size:1.1rem}
.kidadd input[name=link]{font-size:.92rem;padding:10px 14px}
.kidadd .btn{font-size:1.1rem;padding:14px}
.kid-list{display:flex;flex-direction:column;gap:8px}
.kw{display:flex;align-items:center;gap:12px;background:var(--sheet);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.kw{animation:rise .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d)}}
.kw-star{font-size:1.6rem}
.kw b{display:block;font-size:1.1rem}
.kw a{font-size:.86rem;font-weight:700;color:#A23BEC}
.kw-del{border:0;background:var(--sheet-2);color:var(--muted);width:34px;height:34px;border-radius:50%;cursor:pointer;flex:none}
.kid-empty{text-align:center;color:var(--muted);font-size:1.05rem;padding:20px 0}
.kid-exit{margin-top:18px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.86rem;font-weight:650;padding:14px;border-radius:14px;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.kid-exit::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,#A23BEC 18%,transparent);transform:scaleX(0);transform-origin:left}
.kid-exit.holding::before{transform:scaleX(1);transition:transform 1.3s linear}

/* packing */
.pk-wrap{padding:6px 14px 14px;display:flex;flex-direction:column;gap:10px}
.pk-car{display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:12px;background:color-mix(in srgb,#F07A1A 12%,transparent);font:inherit;color:inherit;text-align:left;cursor:pointer}
.pk-car>span{font-size:1.5rem}.pk-car b{display:block}.pk-car small{display:block;color:var(--muted);font-size:.8rem}.pk-car em{font-style:normal;font-weight:750;color:#C25E10}
.pk-h{display:flex;justify-content:space-between;font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 2px 2px}
.pk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--rule)}
.pk .st-tick{width:24px;height:24px}
.pk-n{flex:1;border:0;background:none;text-align:left;font:inherit;color:inherit;padding:2px 0;cursor:pointer}
.pk.done .pk-n{text-decoration:line-through;color:var(--muted)}
.packadd{display:flex;gap:8px;margin-top:4px}
.packadd input,.packadd select{min-width:0;border:0;background:var(--sheet-2);border-radius:12px;padding:10px 12px;font:inherit}
.packadd input{flex:1}.packadd select{flex:none;width:112px}

/* on the day */
.od-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-top:12px}
.od-t{display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.16);border-radius:14px;padding:10px;color:#fff;text-decoration:none}
.od-t span{font-size:1.4rem}.od-t b{font-size:1.15rem}.od-t b small{font-weight:600;opacity:.8}.od-t em{font-style:normal;font-size:.76rem;opacity:.85}
.hcard a.hc-btn{text-decoration:none;display:inline-block}

/* payday check-in */
.ci-wrap{padding:6px 14px 14px;display:flex;flex-direction:column}
.ci-s{padding:10px 0;border-bottom:1px solid var(--rule)}
.ci-s:last-child{border-bottom:0}
.ci-h{display:flex;align-items:center;gap:10px}
.ci-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--sheet-2);color:var(--muted);flex:none}
.ci-dot.now{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.ci-dot.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.ci-lbl{font-weight:750}
.ci-s:not(.now) .ci-lbl{color:var(--muted)}
.ci-done{margin:2px 0 0 38px;font-size:.86rem;color:var(--muted)}
.ci-inc{margin:8px 0 0 38px;display:flex;flex-direction:column;gap:4px}
.ci-inc div{display:flex;justify-content:space-between;font-size:.95rem}
.ci-inc .tot{border-top:1px solid var(--rule);padding-top:6px;font-weight:800}
.ci-s .btnrow{margin-left:38px}
.ci-s .step{margin-left:38px}
.ci-s .step:first-of-type{border-top:0}
.pltabs button{font-size:.82rem;padding-inline:6px}
.ci-end{margin:8px 0 0 38px;padding:12px;border-radius:12px;display:flex;flex-direction:column;gap:2px}
.ci-end.good{background:color-mix(in srgb,var(--good) 12%,transparent)}.ci-end.find{background:color-mix(in srgb,var(--gold) 16%,transparent)}
.ci-end b{font-size:1.3rem}.ci-end span{font-size:.88rem;color:var(--ink-2)}

/* milestones */
.ms-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ms-row::-webkit-scrollbar{display:none}
.ms{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:10px 6px;border-radius:16px;background:var(--sheet-2)}
.ms.done{background:color-mix(in srgb,var(--good) 12%,transparent)}
.ms b{font-size:.84rem;line-height:1.2}.ms small{font-size:.74rem;color:var(--muted);font-weight:600}
.ms-ring{position:relative;width:56px;height:56px;display:block}
.ms-ring svg{width:56px;height:56px;display:block}
.ms-ring i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:1.25rem;font-weight:800}
.ms.done .ms-ring i{color:var(--good)}

/* budget at a glance */
.gl-tiles .od-t{border:0;font:inherit;text-align:left;cursor:pointer}
.gl-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
.fs-list{display:flex;flex-direction:column}
.fs{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.fs:first-child{border-top:0}
.fs .st-tick{margin-top:2px}
.fs.now{background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:12px;padding:10px 8px;margin:0 -8px;border-top-color:transparent}
.fs.past .t,.fs.done .t{color:var(--muted)}
.fs.done .t{text-decoration:line-through}
.fs-cuts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.fs-cuts span{font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,#E8902A 15%,transparent);color:#B5650D}
.fs-amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.fs-amt s{font-size:.78rem;color:var(--muted)}
.fs-amt b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.panel h2.h2b{margin-top:8px}
.bc-list{display:flex;flex-direction:column;gap:8px}
.bc{display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:11px 12px;background:var(--sheet-2);text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,background .15s}
.bc.on{background:color-mix(in srgb,var(--acc) 10%,var(--sheet));box-shadow:inset 0 0 0 2px var(--acc)}
.bc-i{font-size:1.35rem;flex:none}
.bc b{display:block;font-size:.95rem}
.bc small{display:block;font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.3}
/* celebration */
.cele{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(7,11,19,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:opacity .3s}
.cele.out{opacity:0}
.cele canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cele-card{position:relative;background:var(--sheet);border-radius:26px;padding:26px 24px 20px;width:min(320px,86vw);text-align:center;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-lg)}
.cele-big{font-size:3rem;line-height:1}
.cele-card b{font-size:1.4rem;letter-spacing:-.02em}
.cele-card span{color:var(--ink-2)}
.cele-card .btn{margin-top:10px;background:linear-gradient(135deg,#FF4F6D,#A23BEC);color:#fff}
@media (prefers-reduced-motion:no-preference){.cele-card{animation:celepop .45s cubic-bezier(.2,1.5,.4,1)}@keyframes celepop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}}

/* Viki sub-tabs and Contract and rises */
.subtabs{display:flex;gap:4px;padding:4px;margin:-4px 0 0;background:var(--sheet-2);border-radius:14px}
.subtabs{overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:1 0 auto;border:0;background:none;padding:9px 10px;white-space:nowrap;border-radius:10px;font:inherit;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;transition:background .15s ease,color .15s ease}
.subtabs button[aria-selected="true"]{background:var(--sheet);color:var(--viki);box-shadow:0 1px 3px rgba(8,16,26,.14)}
.subtabs.money button[aria-selected="true"]{color:var(--good)}
.vc-toggle{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
.vc-toggle button{border:1px solid var(--rule-2);background:none;color:var(--ink-2);border-radius:999px;padding:6px 12px;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer}
.vc-toggle button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.vc-ladder{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.vc-rung{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px}
.vc-rl{display:flex;flex-direction:column;line-height:1.15}
.vc-rl b{font-weight:650;font-size:.95rem}
.vc-rl span{font-size:.74rem;color:var(--muted)}
.vc-track{height:14px;border-radius:7px;background:var(--sheet-2);overflow:hidden}
.vc-track i{display:block;height:100%;border-radius:7px;background:var(--viki-bar)}
.vc-rung.now .vc-track i{background:var(--rule-2)}
.vc-rung.est .vc-track i{background:repeating-linear-gradient(135deg,var(--viki-bar) 0 6px,color-mix(in srgb,var(--viki-bar) 55%,transparent) 6px 12px)}
.vc-rv{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;min-width:64px}
.vc-rv b{font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.vc-rv span{font-size:.74rem;color:var(--muted)}
.vc-rv .vc-up{color:var(--good);font-weight:700;font-size:.8rem}
.vc-cmp table{width:100%;border-collapse:collapse;font-size:.92rem}
.vc-cmp th,.vc-cmp td{padding:9px 0;border-top:1px solid var(--rule);vertical-align:top}
.vc-cmp thead th{border-top:0;padding-top:2px;font-size:.78rem;font-weight:650;color:var(--muted);text-align:right}
.vc-cmp tbody th{text-align:left;font-weight:500;color:var(--ink-2);padding-right:8px}

.ask{display:flex;flex-direction:column;gap:10px}

.ask-msg{max-width:88%;padding:10px 12px;border-radius:16px;line-height:1.45;font-size:.95rem}

.ask-msg.typing{display:flex;gap:5px;padding:14px}

@media (prefers-reduced-motion:no-preference){.ask-msg.typing i{animation:askdot 1.1s ease-in-out infinite}.ask-msg.typing i:nth-child(2){animation-delay:.15s}.ask-msg.typing i:nth-child(3){animation-delay:.3s}@keyframes askdot{50%{opacity:1;transform:translateY(-3px)}}.ask-msg{animation:rise .3s ease both}}

.pw-big{color:var(--chris-bar);margin:6px 0 10px}
header.top .askbtn{margin-left:auto}

.ask-cam{flex:none}

.ask-img{display:block;max-width:160px;border-radius:10px;margin-bottom:6px}

/* Money → Planner */
.pp-inc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}

.pp-verdict.v-yes .pp-vt{color:var(--good)}.pp-verdict.v-tight .pp-vt{color:var(--gold)}.pp-verdict.v-no .pp-vt{color:var(--bad)}
.pp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:4px}
.pp-stats div{background:var(--sheet);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:1px}
.pp-stats span{font-size:.72rem;color:var(--muted)}.pp-stats b{font-size:1rem}
.pp-fine{margin:2px 0 0;font-size:.78rem;color:var(--muted)}
.pp-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.pp-col{padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.pp-ch{display:flex;flex-direction:column;gap:1px}.pp-ch b{font-size:1.25rem}.pp-ch small{font-size:.75rem;color:var(--muted)}
.pp-b{border-top:1px solid var(--rule);padding-top:7px;display:flex;flex-direction:column;gap:4px}
.pp-b div{display:flex;justify-content:space-between;gap:6px;font-size:.84rem}.pp-b span{font-weight:600;min-width:0}
.pp-b i{display:block;height:5px;border-radius:3px;background:var(--sheet-2);overflow:hidden}.pp-b em{display:block;height:100%;background:var(--good-bar);border-radius:3px}
.pp-t{border-top:1px solid var(--rule);padding:8px 6px;margin:0 -6px;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.pp-t.on{background:color-mix(in srgb,#8A2BD0 9%,transparent);box-shadow:inset 0 0 0 2px #8A2BD0}
.pp-tb{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;color:inherit;font:inherit;min-height:44px;cursor:pointer}
.pp-tn{display:flex;align-items:center;gap:6px;font-weight:650;font-size:.86rem;line-height:1.25}.pp-tn i{width:10px;height:10px;border-radius:3px;flex:none}
.pp-tb small{font-size:.74rem;color:var(--muted)}.pp-tb b{font-size:.98rem}
.pp-chip{align-self:flex-start;border:0;border-radius:999px;min-height:32px;padding:0 11px;font:inherit;font-size:.78rem;font-weight:650;background:var(--sheet-2);color:var(--muted);cursor:pointer}
.pp-chip.in{background:var(--good-soft);color:var(--good)}
.pp-dash{width:14px!important;height:0!important;border-top:2px dashed var(--muted);border-radius:0!important}
.pp-chart{position:relative;height:178px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--rule-2);margin-top:6px}
.pp-colm{position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.pp-colm i{display:block;width:100%}.pp-colm i:first-of-type{border-radius:4px 4px 0 0}
.pp-line{position:absolute;left:-2px;right:-2px;border-top:2px dashed var(--muted);opacity:.8;pointer-events:none}
.pp-flag,.pp-flag-k{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:.62rem;font-weight:800;background:var(--gold-soft);color:var(--gold)}
.pp-flag{position:absolute;top:0;left:50%;transform:translateX(-50%)}.pp-flag.bad,.pp-flag-k.bad{background:var(--bad-soft);color:var(--bad)}
.pp-flag-k{margin-right:5px}
.pp-link{font-size:.84rem;align-self:flex-start;text-align:left}
.pp-axis{display:flex;gap:3px;margin-top:4px}.pp-axis span{flex:1;min-width:0;text-align:center;font-size:.6rem;color:var(--muted);line-height:1.2}
.pp-clash{margin-top:10px;background:var(--gold-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.84rem;line-height:1.4}
.pp-clash b{color:var(--gold)}
.pp-pay{scroll-margin-top:80px;display:flex;flex-direction:column;gap:10px}
.pp-h{margin:0;font-size:1.35rem}.pp-sub{margin:0;color:var(--muted);font-size:.88rem}
.pp-ih{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}.pp-ih small{color:var(--muted);font-size:.78rem}
.pp-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pp-item{border:0;border-radius:12px;padding:10px;min-height:64px;background:var(--sheet-2);color:var(--ink);font:inherit;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;cursor:pointer}
.pp-item span{font-size:.84rem;font-weight:600;line-height:1.3}.pp-item b{font-size:.98rem}.pp-item b small{font-size:.72rem;color:var(--good);font-weight:650}
.pp-item.paid{opacity:.75}
.pp-item.add{border:1.5px dashed var(--rule-2);background:none;color:#8A2BD0;font-weight:650;align-items:center;justify-content:center}
.pp-ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.pp-ctl>div{background:var(--sheet-2);border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:6px}.pp-ctl>div>span{font-size:.78rem;color:var(--muted);font-weight:600}
.pp-step{display:flex;align-items:center;justify-content:space-between;gap:4px}.pp-step b{font-size:.95rem;text-align:center}
.pp-sb{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink);font:inherit;font-size:1.2rem;cursor:pointer}
.pp-mode{display:flex;justify-content:space-between;align-items:center;gap:10px}.pp-mode>span{font-size:.84rem;color:var(--muted);font-weight:600}
.pp-seg{display:flex;background:var(--sheet-2);border-radius:12px;padding:3px}

.pp-seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pp-rows{display:flex;flex-direction:column;gap:6px}
.pp-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--sheet-2)}
.pp-row.after{background:var(--gold-soft)}
.pp-row .grow{display:flex;flex-direction:column;gap:1px;min-width:0}.pp-row .grow b{font-size:.9rem}.pp-row .grow small{font-size:.74rem;color:var(--muted)}.pp-row .grow small.warn{color:var(--gold);font-weight:650}
.pp-val{width:70px;flex:none;text-align:center;display:flex;flex-direction:column}.pp-val b{font-size:1.02rem}.pp-val small{font-size:.72rem;color:var(--muted)}
.pp-alloc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:650;font-size:.9rem}
.pp-alloc.ok{background:var(--good-soft);color:var(--good)}
.pp-done{margin:0;padding:10px 12px;border-radius:12px;background:var(--good-soft);color:var(--good);font-weight:650}
.pp-good{color:var(--good)}.pp-bad{color:var(--bad)}
.pp-est{font-size:.7rem;color:var(--muted);font-weight:500}
.dv-lb{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.dv-lb .grow{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.dv-ed{flex:none;width:18px;height:18px;color:var(--muted);opacity:.7;margin-top:2px}.dv-ed svg{width:16px;height:16px}
.dv-cost{font-size:.82rem;font-weight:700;color:var(--good)}

.zl-lims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.zl-lims .zl-box{margin:0}.zl-lims .zl-leg{flex-direction:column;align-items:flex-start;gap:2px}
.zl-row{align-items:flex-start}.zl-row .plmonths{margin-top:6px}
.zl-done{margin-top:10px}.zl-done summary{cursor:pointer;font-weight:650;color:var(--muted);padding:6px 0}.zl-done summary span{font-weight:500}

/* Me: Chris's private coach */
:root[data-tab="me"]{--acc:#E2445C;--acc2:#FF9F43}
nav.tabs button[data-tab="me"]{--tc:#E2445C;display:none}
:root[data-user="chris"] nav.tabs button[data-tab="me"]{display:flex}
:root[data-user="chris"] nav.tabs{grid-template-columns:repeat(6,1fr)}
.me-log{max-height:48vh;min-height:90px}

.me-trends{display:flex;flex-direction:column;gap:10px}

.me-tc{border:1px solid var(--rule);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.me-tch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.me-tch span{font-weight:650}.me-tch b{font-size:1.2rem}

.me-tc svg{width:100%;height:auto;display:block;overflow:visible}

function parseRota(title) {

  const first = parse(`${ym}-01`), dim = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const W = 320, H = 130, padL = 4, padR = 4, padT = 14, padB = 20;
  const daily = Array(dim).fill(0); items.forEach(x => { const d = parse(x.date).getDate(); daily[d-1] += Number(x.amount)||0; });
  const isNow = ym===ymOf(today()), upto = isNow ? parse(today()).getDate() : (ym < ymOf(today()) ? dim : 0);
  let run = 0; const cum = daily.map(v => run += v);
  const max = Math.max(limit, cum[dim-1] || 0, 1);
  const X = d => padL + (W-padL-padR) * (d/dim), Y = v => H - padB - (H-padB-padT) * v / max;
  let pts = `${X(0)},${Y(0)}`; for (let d=1; d<=upto; d++) pts += ` ${X(d)},${Y(cum[d-1])}`;
  const over = upto && cum[upto-1] > limit * upto/dim;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending so far against an even pace through the month">
    <line x1="${X(0)}" y1="${H-padB}" x2="${X(dim)}" y2="${H-padB}" class="axis"/>
    ${limit ? `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(dim)}" y2="${Y(limit)}" class="pace"/><text x="${X(dim)}" y="${Y(limit)-5}" class="lbl" text-anchor="end">Budget ${money(limit,0)}</text>` : ''}
    ${upto ? `<polyline points="${pts}" class="line${over?' over':''}"/><circle cx="${X(upto)}" cy="${Y(cum[upto-1])}" r="4" class="pt${over?' over':''}"/><text x="${Math.min(X(upto)+7, W-60)}" y="${Y(cum[upto-1])+4}" class="val">${money(cum[upto-1],0)}</text>` : ''}
    <text x="${X(0)}" y="${H-5}" class="lbl">1</text><text x="${X(dim)}" y="${H-5}" class="lbl" text-anchor="end">${dim}</text>
  </svg>`;
}

/* ----- Ask: plain-English questions answered from the family's data (the "ask" edge function calls Claude) ----- */
const ASK = { hist: [], busy: false, nokey: false };

function askFmt(t) {
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split(/\n/); let html = '', inList = false;
  lines.forEach(l => { const m = l.match(/^\s*[-•*]\s+(.*)/); if (m) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${m[1]}</li>`; } else { if (inList) { html += '</ul>'; inList = false; } if (l.trim()) html += `<p>${l}</p>`; } });
  return html + (inList ? '</ul>' : '');
}
function askLog() {

  return log + (ASK.busy ? '<div class="ask-msg assistant typing" aria-label="Thinking"><i></i><i></i><i></i></div>' : '');

function askPropCard(P, i) {

async function askCall(body) {

/* ----- Blue Light Card: state/blc = { on, holder, checked, src, offers:[{ id, n, grp, m (regex text), kind:'pct'|'off'|'tiers'|'info'|'none', pct, off, tiers:[[min, off]], upto, deal, terms, scope }] }

   state/carlog = { from, upto, days: { 'YYYY-MM-DD': [miles, litres, trips, work miles, work litres] } }
   A day is only replaced when the new file has at least as many trips for it (exports are capped, so edge days can be partial). */

const ZILCH_DEFAULT = { limit:2250, threshold:75, upfront:25, feePct:1.8, partnerFee:1.6, shortFee:0 };
const zs = () => ({ ...ZILCH_DEFAULT, ...(S.settings.zilch||{}) });
const zAvail = () => zlFree('chris', ymAdd(plCur(), -1));
/* Zilch (help.zilch.com, Pay monthly and Boost): the credit part is split into four equal payments. Under £75: every 2 weeks over 6 weeks.
   From £75: a quarter at checkout, then a quarter on the same date each month for 3 months, each with a monthly fee of a % of the
   total purchase (up to 1.6% enabling the card at a partner shop, 1.8% Zilch Anywhere). Boost: anything above the available limit
   is taken from the debit card at checkout, with the first quarter. */
function zilchPlan(amount, opts) {
  const z = { ...zs(), ...(opts||{}) }, a = Math.max(0, Number(amount)||0), t = today(), avail = opts && opts.avail != null ? opts.avail : zAvail();
  const r2 = x => Math.round(x*100)/100;
  if (a <= 0) return null;
  const onPlan = Math.min(a, avail), excess = r2(a - onPlan), q = r2(onPlan * z.upfront/100), last = r2(onPlan - q*3);
  const long = a >= z.threshold, mfee = long ? r2(a * z.feePct/100) : 0, start = (opts && opts.start) || t;
  const dates = long ? [start, addMonths(start,1), addMonths(start,2), addMonths(start,3)] : [0,14,28,42].map(d => addDays(start,d));
  const pays = dates.map((date,i) => ({ date, amount: r2((i===3 ? last : q) + (i ? mfee : 0)), fee: i ? mfee : 0, share: i===3 ? last : q, excess:0 }));
  pays[0] = { ...pays[0], amount: r2(q + excess + (long ? 0 : z.shortFee)), excess };
  const fee = r2(mfee*3 + (long ? 0 : z.shortFee));
  return { kind: long ? '3m' : '6w', label: long ? 'Pay over 3 months' : 'Pay over 6 weeks', a, onPlan, excess, upfront: pays[0].amount, pays, fee, mfee, total: r2(a + fee), credit: r2(onPlan - q), avail };
}

  return `<section class="panel zcalc"><h2>Zilch calculator <button class="btn small ghost" data-act="zset">Limits and fees</button></h2>
    <div class="zrow"><label for="zAmt" class="zl">I want to spend</label><div class="zinput"><span>£</span><input id="zAmt" inputmode="decimal" placeholder="0" value="${esc(amt)}" aria-label="Amount to spend"></div></div>
    <div class="zchips">${[50,150,300,600,1000].map(x => `<button type="button" data-act="zquick" data-v="${x}">£${x}</button>`).join('')}</div>
    ${amt && Number(amt) >= z.threshold ? `<label class="toggle"><input type="checkbox" data-act="zpartner" ${UI.zpartner?'checked':''}> Card enabled at a Zilch partner shop first (fee up to ${z.partnerFee}% instead of ${z.feePct}%)</label>` : ''}

async function zilchAddOwed() {
  const a = Number(UI.zamt) || 0; if (!a) return; zlForm(null, { a, mode: 'auto', d: today(), ...(UI.zpartner ? { fee: zs().partnerFee } : {}) }); UI.zamt = ''; return;

/* ----- budget sheet: a month-by-month mirror of the family's budget spreadsheet (bsheet/<yyyy-mm> docs) -----

/* call-outs, overtime and cover are not pensionable; on call is. Rows carry pen:true/false, and older rows are guessed from the name */
const bsPen = i => i.pen != null ? !!i.pen : !/hour|call.?out|1\.5|double|\bbh\b|bh-|overtime|cover/i.test(String(i.n||''));
function bsVikiSlip(doc, ym) {
  const sv = doc.viki, m = ym || ymOf(today()), r = vk(), base = Number(sv.base)||0;
  /* a sheet still on today's salary gets future pay rises applied; one typed with a new salary is taken as it is */
  const cur = Math.abs(base - r.salary) < 1, fs = cur ? awardFactor(m) : 1, fx = cur ? awardFactor(extrasYMOf(m)) : 1;
  let pen = base*fs, other = 0;
  (sv.items||[]).forEach(i => { const a = (Number(i.r)||0)*(Number(i.q)||0)*fx; if (bsPen(i)) pen += a; else other += a; });
  return takeHome(pen + (Number(r.enh)||0)*fs, other, payday(m));
}
function bsViki(doc, ym) {
  const vk = doc.viki; if (!vk) return 0;

function ppItemForm(id, itemId) {
  const p = (S.plans || []).find(x => x.id === id); if (!p) return; const T = ppTrip(p), it = T.items.find(x => x.id === itemId) || { n: '', a: '' };

}

    if (d.items) out.items = d.items;

}
async function ppAct(a, el) {
  const id = el.dataset.id;
  if (a === 'ppsel') { ppState().sel = id; render(); setTimeout(() => { const s = $('#ppPay'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); return true; }
  if (a === 'pptog') { ppEdit(id, (d, T) => { d.on = !T.on; }); return true; }
  if (a === 'ppn' || a === 'ppst') { ppEdit(id, (d, T) => { const pp = { ...T.pp }, dv = Number(el.dataset.v), cur = plCur(), last = ymAdd(cur, PP_N - 1);
      if (a === 'ppn') pp.n = Math.max(1, Math.min(PP_N - ymDiff(cur, pp.start), pp.n + dv)); else { const s = ymAdd(pp.start, dv); if (s >= cur && ymAdd(s, pp.n - 1) <= last) pp.start = s; }
      const left = Math.max(0, ppUnpaid(T.items) - ppPastSum(pp)); pp.v = ppEven(pp.n, pp.mode, left); d.pp = pp; }); return true; }
  if (a === 'ppmode') { ppEdit(id, (d, T) => { const pp = { ...T.pp }, m = el.dataset.v; if (pp.mode === m) return; const left = Math.max(0, ppUnpaid(T.items) - ppPastSum(pp)), amts = ppAmounts(pp, T.items);
      pp.mode = m; pp.v = m === 'pct' ? amts.map(x => left ? Math.round(x / left * 100) : 0) : amts.map(x => Math.round(x)); d.pp = pp; }); return true; }

  if (a === 'ppeven') { ppEdit(id, (d, T) => { const left = Math.max(0, ppUnpaid(T.items) - ppPastSum(T.pp)); d.pp = { ...T.pp, v: ppEven(T.pp.n, T.pp.mode, left) }; }); return true; }
  if (a === 'ppitem') { ppItemForm(id, el.dataset.item); return true; }
  if (a === 'ppadd') { ppItemForm(id, null); return true; }
  if (a === 'ppundo') { UI.pp = { sel: (UI.pp || {}).sel, t: {} }; render(); toast('Back to how it was'); return true; }
  if (a === 'ppuse') { await ppUse(); return true; }
  if (a === 'ppown') { const p = (S.plans || []).find(x => x.id === id); if (p) { const { id: _i, payplan, ...rest } = p; await put(`plans/${id}`, rest); if (UI.pp) delete UI.pp.t[id]; toast('Back to each thing\'s own pay month'); render(); } return true; }

  return false;
}

/* ----- the drive on a trip: tap a stay, ferry or drive to change it, with its cost in the plan ----- */
const ppWords = s => String(s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(w => w && !/^(\d+|night|nights|the|and|a|to|for|with|of|car|room|rooms)$/.test(w));

  const lw = ppWords(leg.t); if (!lw.length) return null; let best = null, score = 0;
  (p.items || []).forEach(it => { const iw = ppWords(it.n), hit = lw.filter(w => iw.includes(w)).length, sc = hit / Math.max(lw.length, Math.min(iw.length, lw.length + 2)); if (hit >= Math.min(2, lw.length) && sc > score) { score = sc; best = it; } });
  return score >= 0.5 ? best : null;
}
function legForm(planId, di, li) {

  openSheet(`${DOWS[parse(p.drive[di].d).getDay()]} ${parse(p.drive[di].d).getDate()} ${MONTHS[parse(p.drive[di].d).getMonth()]}`, fld('lgT', what, leg.t || '')
    + (leg.k === 'car' ? `<div class="fields2">${fld('lgM', 'Miles', leg.mi ?? '', 'number', 'min="0" inputmode="numeric"')}${fld('lgD', 'How long', leg.dur || '', 'text', 'placeholder="e.g. 3 hours"')}</div>` : leg.k === 'ferry' ? fld('lgD', 'Times', leg.dur || '', 'text', 'placeholder="e.g. 02:15 to about 06:00"') : '')
    + `<div class="field"><label for="lgN">Notes</label><textarea id="lgN" rows="3">${esc(leg.note || '')}</textarea></div>`
    + fld('lgA', it ? `Cost in the plan (£), as “${esc(it.n)}”` : 'Cost (£, optional: adds it to the plan)', it ? (it.a ?? '') : '', 'number', 'step="0.01" min="0" inputmode="decimal"')
    + (it && it.paid ? '<p class="note">That one is marked as booked and paid.</p>' : ''), async () => {

    if (it) { const i = items.findIndex(x => x.id === it.id); if (i >= 0) { const renamed = leg.t !== t && /^(stay|ferry)$/.test(leg.k); items[i] = { ...items[i], ...(a !== null ? { a } : {}), ...(renamed ? { n: t } : {}) }; } }
    else if (a) items.push({ id: uid('pi'), n: t, a, how: 'save', ym: p.from ? payYm(p.from) : plCur(), cat: leg.k === 'stay' ? 'stay' : leg.k === 'park' ? 'fun' : 'travel', via: 'card' });
    const { id, ...rest } = p, out = { ...rest, drive, items };

/* ===== Zilch list: everything on Zilch for both of you, and what it takes out each pay month =====

   'auto' = a purchase the app splits the Zilch way (a quarter on the day, then three monthly with fees; under £75 every two weeks);
   'set' = payments already known, typed in month by month. Each month's Budget Sheet shows them as "Zilch payments", and they come

function meLine(pts, fmt) {

/* ----- holiday planner: plans/<id> = { kind, name, from, to, note, saveFrom, items:[{id,n,a,how,ym,from,paid,note}] } ----- */

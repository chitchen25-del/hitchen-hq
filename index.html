<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hitchen HQ</title>
<meta name="description" content="Hitchen family work, money and car">
<meta name="theme-color" content="#1B6886">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hitchen HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: phone-first household app; sticky header, one column of panels, fixed bottom tab bar with five areas */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E7EDEB; --ink:#142026; --muted:#53656B; --line:#D3DCD9;
  --accent:#1B6886; --accent-ink:#FFFFFF; --accent-soft:#DAEAF1;
  --chris:#1B6886; --chris-soft:#DAEAF1; --viki:#A4406A; --viki-soft:#F5E0E9;
  --gold:#A86E0C; --gold-soft:#F6E8CC; --good:#28744A; --good-soft:#DAEEE1; --bad:#B02E24; --bad-soft:#F5DCD9;
  --shadow:0 1px 2px rgba(20,32,38,.06),0 4px 14px rgba(20,32,38,.06);
  --font-d:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-b:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#162125; --surface-2:#1D2A2F; --ink:#E6EEEC; --muted:#98ACB1; --line:#29393E;
  --accent:#62B6D6; --accent-ink:#0B1A20; --accent-soft:#17323F;
  --chris:#62B6D6; --chris-soft:#17323F; --viki:#E68BAF; --viki-soft:#3A1D2A;
  --gold:#E3AE4D; --gold-soft:#372A11; --good:#6CC793; --good-soft:#15301F; --bad:#F08A80; --bad-soft:#3B1B18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162125; --surface-2:#1D2A2F; --ink:#E6EEEC; --muted:#98ACB1; --line:#29393E;
  --accent:#62B6D6; --accent-ink:#0B1A20; --accent-soft:#17323F;
  --chris:#62B6D6; --chris-soft:#17323F; --viki:#E68BAF; --viki-soft:#3A1D2A;
  --gold:#E3AE4D; --gold-soft:#372A11; --good:#6CC793; --good-soft:#15301F; --bad:#F08A80; --bad-soft:#3B1B18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
img{max-width:100%}
.login{max-width:420px;margin:8vh auto 0;width:100%}
body{color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--font-d);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:.82rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-family:var(--font-d);font-weight:700;font-size:1.08rem;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 .sub{font-family:var(--font-b);font-weight:400;font-size:.82rem;color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.who button[data-who="chris"][aria-pressed="true"]{color:var(--chris)}
.seg.who button[data-who="viki"][aria-pressed="true"]{color:var(--viki)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--font-d);font-size:1.35rem;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.list{display:flex;flex-direction:column}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:.82rem;color:var(--muted)}
.row .amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.rowbtn{all:unset;display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.rowbtn:first-child{border-top:0}
.rowbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:700;white-space:nowrap}
.chip.due{background:var(--bad-soft);color:var(--bad)} .chip.soon{background:var(--gold-soft);color:var(--gold)} .chip.ok{background:var(--good-soft);color:var(--good)}
.chip.cat{background:var(--surface-2);color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:7px 11px;font-size:.85rem;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--bad)} .bar i.good{background:var(--good)}
.empty{color:var(--muted);font-size:.92rem;padding:6px 0}
.note{font-size:.85rem;color:var(--muted)}
.banner{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.88rem}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-family:var(--font-d);font-size:1.05rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.7rem;text-align:center;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1/1.05;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;min-width:0}
.cal button .d{font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.cal button .l{font-size:.6rem;line-height:1.1;font-weight:700;text-align:center;overflow:hidden;max-width:100%}
.cal button.today{border:2px solid var(--ink)}
.cal button.pad{visibility:hidden}
.st-work{background:var(--chris-soft)!important;color:var(--chris)} .st-shift{background:var(--viki-soft)!important;color:var(--viki)}
.st-callout{background:var(--gold-soft)!important;color:var(--gold)} .st-holiday{background:var(--good-soft)!important;color:var(--good)}
.st-sick{background:var(--bad-soft)!important;color:var(--bad)} .st-off{background:var(--surface-2)!important;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .chip{border:1px solid var(--line)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--font-d);font-size:1.2rem;margin:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.82rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:.88rem}
.choice button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:-2px}
.err{color:var(--bad);font-size:.85rem}
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.ai{white-space:pre-wrap;font-size:.93rem;background:var(--surface-2);border-radius:12px;padding:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-weight:700;z-index:50;font-size:.9rem}
/* home */
:root{--viki-on:#F7B6CF}
.hhero{background:linear-gradient(140deg,#0E3A4B 0%,#1B6886 55%,#2F93A9 100%);color:#fff;border-radius:22px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hhero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07)}
.hhero .k{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.hhero .hbig{font-family:var(--font-d);font-weight:700;font-size:1.9rem;line-height:1.05;letter-spacing:-.015em}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;position:relative;z-index:1}
.hchip{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.2);border-radius:999px;padding:5px 11px 5px 9px;font-size:.84rem;font-weight:700;font-variant-numeric:tabular-nums}
.hchip i{width:9px;height:9px;border-radius:50%;flex:none}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wcol{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 3px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.wcol .wd{font-size:.64rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.wcol .wn{font-family:var(--font-d);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.wcol .wbars{display:flex;flex-direction:column;gap:3px;width:100%;padding:2px 5px 0;min-height:34px}
.wcol .wbars i{display:block;height:5px;border-radius:3px}
.wcol .wbars em{font-style:normal;font-size:.6rem;color:var(--muted);font-weight:700;text-align:center;line-height:1}
.wcol.sel{background:var(--ink);border-color:var(--ink)}
.wcol.sel .wd,.wcol.sel .wn{color:var(--bg)}
.wcol.sel .wbars em{color:var(--bg)}
.agenda{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.evb{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 11px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border-left:5px solid var(--c)}
.evbt{flex:none;width:52px;font-size:.8rem;font-weight:700;color:var(--muted)}
.evb .t{font-weight:700;overflow-wrap:anywhere}.evb .m{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .tl{font-size:.78rem;color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tv{font-family:var(--font-d);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .ts{font-size:.78rem;color:var(--muted)}
.tile-ring{position:relative;width:56px;height:56px;margin-bottom:4px}
.tile-ring .ring{width:56px;height:56px;display:block}
.tile-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-variant-numeric:tabular-nums}
.bdate{width:42px;flex:none;text-align:center;background:var(--surface-2);border-radius:10px;padding:4px 0;line-height:1.05}
.bdate b{display:block;font-family:var(--font-d);font-size:1.05rem}.bdate span{font-size:.66rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.fromcal{border-style:dashed!important}
.colrow{display:flex;align-items:center;gap:8px}
.colrow input,.colrow select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-width:0}
.colrow input{flex:1}
.sw{width:18px;height:18px;border-radius:50%;flex:none}
.rules{display:flex;flex-direction:column;gap:6px}
/* family calendar */
.calday{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.ev{display:flex;align-items:center;gap:10px;padding:6px 0}
.evt{width:52px;flex:none;font-size:.82rem;color:var(--muted);font-weight:700}
.evbar{width:4px;align-self:stretch;border-radius:4px;flex:none}
/* Viki: pay hero, week strip, timesheet */
.vhero{background:linear-gradient(140deg,#6E2644 0%,#A4406A 58%,#C7647F 100%);color:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.vhero .k{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.vhero .big{font-family:var(--font-d);font-weight:700;font-size:2.5rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vhero .sub{font-size:.88rem;opacity:.92}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.18)}
.stack i{display:block;height:100%}
.vleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem}
.vleg span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.vleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.vhero details{font-size:.85rem;background:rgba(0,0,0,.14);border-radius:12px;padding:8px 10px}
.vhero summary{cursor:pointer;font-weight:700}
.vhero dl{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.vhero dd{margin:0;text-align:right}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.week button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.week .wd{font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.week .wn{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums}
.week .wh{font-size:.68rem;font-weight:700;min-height:1em}
.week button.today{border:2px solid var(--viki)}
.moon{color:var(--accent);font-size:.8rem;line-height:1}
.st-oncall{background:var(--accent-soft)!important;color:var(--accent)}
.tbl{overflow-x:auto;margin:0 -14px;padding:0 14px}
.tbl table{border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums;min-width:480px;width:100%}
.tbl th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl th.grp{text-align:center;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.cont td{border-top:0}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl .co-col{background:var(--gold-soft)}
.tbl tr[data-act]{cursor:pointer}
.tsec{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tsec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tsec-h b{font-family:var(--font-d);font-size:1.02rem}
.pill{border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700;background:var(--surface-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.v{background:var(--viki-soft);color:var(--viki)} .pill.a{background:var(--accent-soft);color:var(--accent)} .pill.g{background:var(--gold-soft);color:var(--gold)}
.fields3{display:grid;grid-template-columns:1fr 1fr .8fr;gap:8px}
.out{border:1px dashed var(--line);border-radius:10px;padding:10px 11px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.co{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.co .fields3 .field input{background:var(--surface)}
.co-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:700}
.co-top .x{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:0 4px}
.multbtn{border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.8rem;cursor:pointer}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--viki)}
.vsum{display:flex;align-items:center;justify-content:space-between;background:var(--viki-soft);color:var(--viki);border-radius:12px;padding:10px 12px;font-weight:700}
.vsum b{font-family:var(--font-d);font-size:1.25rem;font-variant-numeric:tabular-nums}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rate{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rate .rl{font-size:.75rem;color:var(--muted);font-weight:700}
.rate .rv{font-family:var(--font-d);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}

<script>

/* ---------- data layer ---------- */
const COLL = { bills:'bills', goals:'goals', spend:'spend', service:'service', fuel:'fuel' };
function applyLocal(path, data) {
  const [c, id] = path.split('/');
  if (c === 'days') { if (data) S.days[id] = data; else delete S.days[id]; }
  else if (COLL[c]) { const arr = S[c]; const i = arr.findIndex(x => x.id === id); if (!data) { if (i>=0) arr.splice(i,1); } else if (i>=0) arr[i] = {...data, id}; else arr.push({...data, id}); }

  else if (c === 'budget') S.budget = data || {cats:[]};
  else if (c === 'car') S.car = data || {};
  else if (c === 'private') { if (id==='calendar') S.cal = data || {feeds:[]}; }
  else if (c === 'state') { if (id==='checks') S.checks = data||{done:{}}; if (id==='trip') S.trip = data||{done:{}}; }

/* Every record is one row in the `docs` table: path (e.g. "bills/b_rent") plus its JSON data. */
const CACHE_KEY = 'hhq-cache-v1';

  Object.assign(S, { settings:{}, days:{}, bills:[], goals:[], spend:[], budget:{cats:[]}, car:{}, service:[], fuel:[], checks:{done:{}}, trip:{done:{}}, cal:{feeds:[]} });

}
function saveCache() { clearTimeout(cacheTimer); cacheTimer = setTimeout(() => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(snapshotRows())); } catch(e) {} }, 500); }
function loadCache() { try { const rows = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (!Array.isArray(rows)) return false; resetState(); rows.forEach(([p,d]) => applyLocal(p,d)); return true; } catch(e) { return false; } }
async function put(path, data) {
  applyLocal(path, data); schedule(); saveCache();

  applyLocal(path, null); schedule(); saveCache();
  if (!sb || !session) return;

}
async function loadAll() {
  const out = []; let from = 0;
  while (true) {
    const { data, error } = await sb.from('docs').select('path,data').order('path').range(from, from + 999);
    if (error) throw error;
    out.push(...data); if (data.length < 1000) break; from += 1000;
  }
  resetState(); out.forEach(r => applyLocal(r.path, r.data)); offline = false; schedule(); saveCache();
}
let channel = null;

  if (channel) sb.removeChannel(channel);
  channel = sb.channel('family-docs')
    .on('postgres_changes', { event:'*', schema:'public', table:'docs' }, p => {
      if (p.eventType === 'DELETE') { if (p.old && p.old.path) applyLocal(p.old.path, null); }
      else if (p.new && p.new.path) applyLocal(p.new.path, p.new.data);
      schedule(); saveCache();

}

/* ---------- derived values ---------- */
const rates = () => ({...DEFAULT_RATES, ...(S.settings.rates||{})});
function nextDue(b) {
  if (!b.due) return null;
  let d = b.due, t = today(), guard = 0;
  const step = b.freq==='weekly' ? (s=>addDays(s,7)) : b.freq==='quarterly' ? (s=>addMonths(s,3)) : b.freq==='annual' ? (s=>addMonths(s,12)) : (s=>addMonths(s,1));
  while (d < t && guard++ < 600) d = step(d);
  return d;
}
const perMonth = b => { const a = Number(b.amount)||0; return b.freq==='weekly' ? a*52/12 : b.freq==='quarterly' ? a/3 : b.freq==='annual' ? a/12 : a; };
function leaveYear() {
  const startMM = Number(S.settings.leaveStart || 1); const t = parse(today());
  let y = t.getFullYear(); if (t.getMonth()+1 < startMM) y--;
  const from = `${y}-${pad(startMM)}-01`; return { from, to: addDays(addMonths(from,12),-1) };
}
function daysFor(who, from, to) {
  const m = {};
  Object.values(CAL.days || {}).forEach(d => { if (d.who===who && d.date>=from && d.date<=to) m[d.date] = d; });
  Object.values(S.days).forEach(d => { if (d.who===who && d.date>=from && d.date<=to) m[d.date] = d; });
  return Object.values(m);
}
function checkStatus(c) {
  const rec = (S.checks.done||{})[c.id];
  if (!rec) return { cls:'due', label:'Not logged yet', next:null };
  const next = addDays(rec.date, c.days); const left = daysBetween(today(), next);
  let miles = null;
  if (c.miles && rec.mileage && S.car.mileage) { miles = rec.mileage + c.miles - S.car.mileage; }
  if (left < 0 || (miles!==null && miles <= 0)) return { cls:'due', label:'Due now', next, miles };
  if (left <= 14 || (miles!==null && miles <= 500)) return { cls:'soon', label: `Due ${shortDate(next)}`, next, miles };
  return { cls:'ok', label: `Next ${shortDate(next)}`, next, miles };
}

/* ---------- rendering ---------- */
let pending = false;
function schedule() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); }

/* ----- family calendar (Google Calendar secret iCal links, read by the `calendar` Supabase function) ----- */
const GCOL = { tomato:['Tomato','#D50000'], flamingo:['Flamingo','#E67C73'], tangerine:['Tangerine','#F4511E'], banana:['Banana','#F6BF26'], sage:['Sage','#33B679'], basil:['Basil','#0B8043'], peacock:['Peacock','#039BE5'], blueberry:['Blueberry','#3F51B5'], lavender:['Lavender','#7986CB'], grape:['Grape','#8E24AA'], graphite:['Graphite','#616161'] };
const DEFAULT_RULES = [
  { m:'V:', c:'flamingo' }, { m:'VH-', c:'flamingo' }, { m:'C:', c:'peacock' },
  { m:'birthday', c:'banana' }, { m:'bday', c:'banana' }, { m:'anniversary', c:'banana' },
  { m:'pay day', c:'tangerine' }, { m:'payday', c:'tangerine' },
  { m:'bin', c:'graphite' }, { m:'recycling', c:'graphite' },
];
const calRules = () => Array.isArray(S.cal.rules) ? S.cal.rules : DEFAULT_RULES;
function evColor(title, feedIdx) {
  const t = String(title||'').trim().toLowerCase();
  for (const r of calRules()) { const m = String(r.m||'').trim().toLowerCase(); if (!m) continue;
    if (/[:\-]$/.test(m) ? t.startsWith(m) : t.includes(m)) return (GCOL[r.c] || GCOL.blueberry)[1]; }
  const f = (S.cal.feeds||[])[feedIdx] || {}; return (GCOL[f.color] || GCOL.blueberry)[1];
}
const CAL = (() => { try { const c = JSON.parse(localStorage.getItem('hhq-cal') || 'null'); if (c && c.v===2) return c; } catch(e) {} return { v:2, calendars:[], at:0, days:{} }; })();
let calBusy = false;
async function fetchCal(force) {
  if (!sb || !session || calBusy) return;
  if (!(S.cal.feeds||[]).length) { CAL.calendars = []; CAL.days = {}; return; }
  if (!force && Date.now() - (CAL.at||0) < 10*60*1000) return;
  calBusy = true;
  try {
    const from = `${ymOf(addMonths(today(),-3))}-01`, to = addDays(today(), 200);
    const { data, error } = await sb.functions.invoke('calendar', { body: { from, to } });
    if (error) throw error;
    CAL.calendars = data.calendars || []; CAL.at = Date.now(); CAL.error = '';
    deriveDays();
    try { localStorage.setItem('hhq-cal', JSON.stringify(CAL)); } catch(e) {}
  } catch (e) { CAL.error = 'Couldn\'t load the calendar just now.'; }
  calBusy = false; schedule();
}
const evDate = e => e.allDay ? e.start : ymd(new Date(e.start));
const evTime = e => e.allDay ? '' : new Date(e.start).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

/* Rota entries in the calendar: "V: 8-6", "V: on call", "V: AL", "V: sick", "V: DO", "C: 8-5" */
function parseRota(title) {
  const m = /^\s*(VH|V|C)\s*[:\-]\s*/i.exec(String(title||'')); if (!m) return null;
  const who = m[1].toUpperCase()==='C' ? 'chris' : 'viki', t = title.slice(m[0].length).trim();
  if (/on\s*-?\s*call/i.test(t)) return { who, kind:'oncall' };
  if (/\bAL\b|annual leave|holiday/i.test(t)) return { who, kind:'holiday' };
  if (/sick/i.test(t)) return { who, kind:'sick' };
  if (/\bR?DO\b|day off|pay\s*back|toil/i.test(t)) return { who, kind:'off', note:t };
  const x = /(\d{1,2})(?:[:.](\d{2}))?\s*-\s*(\d{1,2})(?:[:.](\d{2}))?/.exec(t);
  if (x) { const sh = +x[1], sm = +(x[2]||0); let eh = +x[3]; const em = +(x[4]||0);
    if (eh*60+em <= sh*60+sm && eh < 12) eh += 12;
    return { who, kind:'shift', start:`${pad(sh)}:${pad(sm)}`, end:`${pad(eh%24)}:${pad(em)}`, note: /\bOT\b/i.test(t) ? 'Overtime' : '' }; }
  return null;
}
function deriveDays() {
  const out = {};
  (CAL.calendars||[]).forEach(c => (c.events||[]).forEach(e => {
    const r = parseRota(e.title); if (!r) return;
    const date = evDate(e), key = `${r.who}_${date}`;
    const d = out[key] || (out[key] = { who:r.who, date, fromCal:true });
    if (r.kind==='shift') { d.status = r.who==='chris' ? 'work' : 'shift'; d.start = r.start; d.end = r.end; d.lunch = 30; if (r.note) d.note = r.note; }
    else if (r.kind==='oncall') d.oc = true;
    else if (!d.status) { d.status = r.kind; if (r.note) d.note = r.note; }
  }));
  Object.values(out).forEach(d => {
    if (d.oc && d.who==='viki') {
      if (isWeekend(d.date) || isBH(d.date)) { if (!d.status) d.status = 'off'; d.oncall = { kind:'first', start:'08:00', end:'08:00' }; }
      else { if (!d.status) { d.status = 'shift'; d.start = '08:00'; d.end = parse(d.date).getDay()===5 ? '18:00' : '18:30'; d.lunch = 30; }
        d.oncall = { kind:'first', start: d.status==='shift' ? d.end : '18:30', end:'08:00' }; }
    }
    if (d.oc && d.who==='chris' && !d.status) d.status = 'callout';
    if (!d.status) d.status = 'off'; delete d.oc;
  });
  CAL.days = out;
}
const dayRec = (who, date) => S.days[`${who}_${date}`] || (CAL.days||{})[`${who}_${date}`];

/* everything happening on each day: calendar events (coloured) plus on call logged only in the app */
function agenda(from, to) {
  const byDay = {};

/* ----- Viki: pay, rota and on-call claims -----
   Her actual rates live in the private database (settings/main → viki), never in this public code.
   Model: salary + on-call standing hours × rate + call-out hours × basic × 1.5 (Mon–Sat) or 2 (Sun and bank holidays).
   Pension is a % of salary + on call; NI is a fixed monthly part + a % of gross; tax is a rate above the tax-code allowance. */
const VIKI_DEFAULT = { salary:0, base:0, standby:0, secondWD:0, secondWE:0, pension:0, niFixed:0, niPct:0, taxCode:0, taxRate:20, arrears:true };
const vk = () => ({...VIKI_DEFAULT, ...(S.settings.viki||{})});
const BANK_HOLS = new Set(['2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-05-25','2026-06-05','2026-07-05','2026-07-06','2026-08-31','2026-12-25','2026-12-26','2026-12-28',
  '2027-01-01','2027-03-26','2027-03-29','2027-05-03','2027-05-31','2027-06-11','2027-07-05','2027-08-30','2027-12-25','2027-12-26','2027-12-27','2027-12-28']);
const isBH = s => BANK_HOLS.has(s);
const DOWS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(String(t||'')); return m ? Number(m[1])*60 + Number(m[2]) : null; };
const span = (a,b) => { const x = toMin(a), y = toMin(b); if (x===null || y===null) return 0; let d = y - x; if (d <= 0) d += 1440; return d/60; };
const hm = t => t ? String(t).replace(/^0(\d)/,'$1') : '';

const ocHours = d => d.oncall ? span(d.oncall.start, d.oncall.end) : 0;
function coDate(d, c) { const s = toMin(c.from), os = toMin(d.oncall ? d.oncall.start : (d.end || '00:00')); return (s!==null && os!==null && s < os) ? addDays(d.date,1) : d.date; }

function vikiDay(d) {
  const r = vk(); const o = { hrs: shiftHours(d), ocH: ocHours(d), oc:0, h15:0, h2:0, co:0 };
  o.oc = o.ocH * ocRate(d);
  (d.callouts||[]).forEach(c => { const h = coHours(c), m = coMult(d,c); if (m===2) o.h2 += h; else o.h15 += h; o.co += h * r.base * m; });
  o.extra = o.oc + o.co; return o;
}
const vikiPay = d => (d && d.who==='viki') ? vikiDay(d).extra : 0;
function vikiMonth(ym) {
  const days = daysFor('viki', `${ym}-01`, `${ym}-31`).sort((a,b) => a.date < b.date ? -1 : 1);
  const t = { oc:0, ocH:0, co:0, h15:0, h2:0, hrs:0, days };
  days.forEach(d => { const x = vikiDay(d); t.oc += x.oc; t.ocH += x.ocH; t.co += x.co; t.h15 += x.h15; t.h2 += x.h2; t.hrs += x.hrs; });
  return t;
}
function payslip(oc, co) {
  const r = vk(); const gross = r.salary + oc + co;
  const pension = (r.salary + oc) * r.pension/100;
  const ni = r.niFixed + gross * r.niPct/100;
  const tax = Math.max(0, (gross - pension - r.taxCode*10/12) * r.taxRate/100);
  return { gross, pension, ni, tax, net: gross - pension - ni - tax };
}
function payday(ym) { let d = `${ym}-25`; const w = parse(d).getDay(); if (w===6) d = addDays(d,-1); if (w===0) d = addDays(d,-2); return d; }
const dayShort = s => { const d = parse(s); return `${DOWS[d.getDay()].slice(0,3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };

    <div class="stack" aria-hidden="true"><i style="width:${r.salary/tot*100}%;background:${C.basic}"></i><i style="width:${m.oc/tot*100}%;background:${C.oc}"></i><i style="width:${m.co/tot*100}%;background:${C.co}"></i></div>
    <div class="vleg"><span><i style="background:${C.basic}"></i>Salary ${money(r.salary,0)}</span><span><i style="background:${C.oc}"></i>On call ${money(m.oc,0)}</span><span><i style="background:${C.co}"></i>Call-outs ${money(m.co,0)}</span></div>
    <details><summary>How it's worked out</summary><dl>
      <dt>Salary</dt><dd>${money(r.salary,2)}</dd>
      <dt>On call, ${fh(m.ocH)}h in ${esc(mName)}</dt><dd>${money(m.oc,2)}</dd>
      <dt>Call-outs, ${fh(m.h15)}h at 1.5× + ${fh(m.h2)}h at 2×</dt><dd>${money(m.co,2)}</dd>
      <dt>Pension ${r.pension}%</dt><dd>−${money(p.pension,2)}</dd>
      <dt>NI</dt><dd>−${money(p.ni,2)}</dd>
      <dt>Tax (code ${esc(r.taxCode)})</dt><dd>−${money(p.tax,2)}</dd>
    </dl><p style="margin:6px 0 0;opacity:.9">${r.arrears ? `On call and call-outs worked in ${esc(mName)} are paid on ${esc(dayShort(pd))}. ` : ''}Checked against her real payslips: within about £10.</p></details>
  </section>`;

  // this week
  const t = today(), mon = addDays(t, -((parse(t).getDay()+6)%7));
  let wk = '', wkH = 0;
  for (let i=0;i<7;i++) {
    const date = addDays(mon,i), rec = dayRec('viki', date), d = parse(date);
    let lab = '';
    if (rec) { if (rec.status==='shift') { const h = shiftHours(rec); wkH += h; lab = `${fh(h)}h`; } else if (rec.status==='holiday' || rec.status==='sick') { if (i<5) wkH += 7.5; lab = rec.status==='holiday' ? 'Hol' : 'Sick'; } }
    const cls = rec ? (rec.status==='shift' ? 'st-shift' : rec.status==='off' ? (rec.oncall ? 'st-oncall' : '') : `st-${rec.status}`) : '';
    wk += `<button class="${cls}${date===t?' today':''}${rec && rec.fromCal ? ' fromcal' : ''}" data-act="day" data-date="${date}" aria-label="${esc(dayShort(date))}${lab?', '+lab:''}${rec&&rec.oncall?', on call':''}"><span class="wd">${DOWS[d.getDay()].slice(0,3)}</span><span class="wn">${d.getDate()}</span><span class="wh">${esc(lab)}</span><span class="moon">${rec && rec.oncall ? '☾' : '&nbsp;'}</span></button>`;
  }
  const wpct = Math.min(100, wkH/37.5*100);
  const week = `<section class="panel"><h2>This week <span class="sub num">${fh(wkH)} of 37.5 hours</span></h2>
    <div class="bar"><i style="width:${wpct}%;background:var(--viki)"></i></div>
    <div class="week">${wk}</div></section>`;

  // month calendar
  const first = parse(`${ym}-01`); const daysIn = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate(); const lead = (first.getDay()+6)%7;
  let cells = ''; for (let i=0;i<lead;i++) cells += `<button class="pad" tabindex="-1" aria-hidden="true"></button>`;
  for (let d=1; d<=daysIn; d++) {
    const date = `${ym}-${pad(d)}`, rec = dayRec('viki', date);
    let lab = '', cls = '';
    if (rec) {
      if (rec.status==='shift') { lab = `${fh(shiftHours(rec))}h`; cls = 'st-shift'; }
      else if (rec.status==='off') { lab = rec.oncall ? 'On call' : 'Off'; cls = rec.oncall ? 'st-oncall' : 'st-off'; }
      else { lab = SHORT[rec.status] || ''; cls = `st-${rec.status}`; }
    }
    const mark = rec && rec.oncall ? `<span class="moon">☾${(rec.callouts||[]).length ? '<span class="dot" style="margin-left:2px"></span>' : ''}</span>` : '<span></span>';
    cells += `<button class="${cls}${date===t?' today':''}${rec && rec.fromCal ? ' fromcal' : ''}" data-act="day" data-date="${date}" aria-label="${shortDate(date)}${lab?', '+esc(lab):''}"><span class="d">${d}</span><span class="l">${esc(lab)}</span>${mark}</button>`;
  }
  const cal = `<section class="panel">
    <div class="calhead"><button class="iconbtn" data-act="cal" data-v="-1" aria-label="Previous month">‹</button><b>${monthName(ym)}</b><button class="iconbtn" data-act="cal" data-v="1" aria-label="Next month">›</button></div>
    <div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>
    <div class="legend"><span class="chip st-shift">Shift</span><span class="chip st-oncall">☾ On call</span><span class="chip cat"><span class="dot"></span> Call-out</span><span class="chip st-holiday">Holiday</span><span class="chip st-sick">Sick</span></div>
    <p class="note">${Object.keys(CAL.days||{}).length ? 'Dashed days come from your Google Calendar. ' : ''}Tap a day to add call-outs or change it.</p></section>`;

  const noRates = !r.salary ? `<div class="banner">Viki's pay rates aren't set yet. <button class="btn small ghost" data-act="vrates">Add them</button></div>` : '';
  return noRates + hero + week + cal + claimTable(ym, m) + ratesPanel();
}

function claimRows(m) {
  const rows = [];
  m.days.filter(d => d.oncall || (d.callouts||[]).length).forEach(d => {
    const x = vikiDay(d), cos = d.callouts||[];
    const base = { date:d.date, day:DOWS[parse(d.date).getDay()].slice(0,3), start:d.oncall?hm(d.oncall.start):'', end:d.oncall?hm(d.oncall.end):'', hrs:d.oncall?fh(x.ocH):'', amt:d.oncall?x.oc:null, second:d.oncall&&d.oncall.kind==='second' };
    if (!cos.length) rows.push({...base, cont:false});
    cos.forEach((c,i) => rows.push({...(i ? {date:d.date, day:'', start:'', end:'', hrs:'', amt:null} : base), cont: i>0, from:hm(c.from), to:hm(c.to), ch:fh(coHours(c)), mult:coMult(d,c), note:c.note||''}));
  });
  return rows;
}
function claimTable(ym, m) {

  return `<section class="panel"><h2>On-call claim · ${esc(monthName(ym))} ${rows.length?'<button class="btn small ghost" data-act="vcopy">Copy</button>':''}</h2>
    ${rows.length ? `<div class="tbl"><table>

      <tr><th>Day</th><th>Date</th><th>Start</th><th>Finish</th><th class="r">Hours</th><th class="r">Amount £</th><th class="co-col">From</th><th class="co-col">To</th><th class="co-col r">Hours</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td colspan="4">Total</td><td class="r">${fh(m.ocH)}</td><td class="r">${money(m.oc,2)}</td><td class="co-col" colspan="2">${fh(m.h15)}h 1.5× · ${fh(m.h2)}h 2×</td><td class="co-col r">${fh(m.h15+m.h2)}</td></tr></tfoot>
    </table></div><p class="note">Laid out like her MPTC claim form so it can be copied straight across. Tap a row to change it.</p>`
    : `<p class="empty">No on call logged in ${esc(MONTHS[parse(`${ym}-01`).getMonth()])} yet. Tap a day on the calendar to add one.</p>`}
  </section>`;
}
function claimText(ym) {
  const m = vikiMonth(ym), rows = claimRows(m);
  const lines = [`On-call claim, ${monthName(ym)}`, ['Day','Date','Start','Finish','Hours','Amount £','From','To','Hours claimed','Notes'].join('\t')];
  rows.forEach(r => lines.push([r.day, r.cont?'':shortDate(r.date), r.start, r.end, r.hrs, r.amt!=null?r.amt.toFixed(2):'', r.from||'', r.to||'', r.ch||'', r.note||''].join('\t')));

function vikiDayForm(date) {
  const key = `viki_${date}`, rec = S.days[key];
  const wkend = isWeekend(date), bh = isBH(date);
  const calRec = (CAL.days||{})[key];
  const draft = rec ? JSON.parse(JSON.stringify(rec)) : calRec ? (() => { const c = JSON.parse(JSON.stringify(calRec)); delete c.fromCal; if (bh) c.bh = true; return c; })() : (wkend || bh ? { who:'viki', date, status:'off', bh } : { who:'viki', date, status:'shift', start:'08:00', end:'17:30', lunch:30, bh });
  draft.callouts = draft.callouts || [];
  const ocDefault = () => (wkend || draft.bh) && draft.status!=='shift' ? { start:'08:00', end:'08:00' } : { start: (draft.status==='shift' && draft.end) ? draft.end : '18:30', end:'08:00' };
  const read = () => {
    if (draft.status==='shift') { draft.start = v('vStart') || draft.start; draft.end = v('vEnd') || draft.end; const l = num(v('vLunch')); draft.lunch = l===null ? 0 : l; }
    if (draft.oncall) { draft.oncall.start = v('vOcS') || draft.oncall.start; draft.oncall.end = v('vOcE') || draft.oncall.end; }
    draft.bh = !!($('#vBh') && $('#vBh').checked);
    draft.callouts.forEach((c,i) => { c.from = v(`vCf${i}`); c.to = v(`vCt${i}`); c.note = v(`vCn${i}`).trim(); });
    draft.note = v('vNote').trim();
  };
  const presetIdx = () => draft.status==='shift' && !draft.custom ? PRESETS.findIndex(([a,b]) => a===draft.start && b===draft.end) : -1;
  const body = () => {
    const x = vikiDay(draft), pi = presetIdx();
    const types = [['off','Off'],['p0','8–17:30'],['p1','8–18'],['p2','8–18:30 + on call'],['custom','Other times'],['holiday','Holiday'],['sick','Sick']];
    const active = k => k==='off'||k==='holiday'||k==='sick' ? draft.status===k : k==='custom' ? (draft.status==='shift' && pi<0) : (draft.status==='shift' && `p${pi}`===k);
    return `
    <div class="tsec"><div class="tsec-h"><b>Shift</b><span class="pill v" id="vShiftH">${draft.status==='shift' ? fh(x.hrs)+' hours' : draft.status==='off' ? 'Not working' : esc(draft.status==='holiday'?'Holiday':'Sick')}</span></div>
      <div class="choice">${types.map(([k,l]) => `<button type="button" data-vt="${k}" class="${active(k)?'on':''}" aria-pressed="${active(k)}">${l}</button>`).join('')}</div>
      ${draft.status==='shift' ? `<div class="fields3">${fld('vStart','Start', draft.start||'', 'time')}${fld('vEnd','Finish', draft.end||'', 'time')}${fld('vLunch','Lunch (mins)', draft.lunch ?? 30, 'number','min="0" step="5" inputmode="numeric"')}</div>` : ''}
    </div>
    <div class="tsec"><div class="tsec-h"><b>On call</b><span class="pill a" id="vOcAmt">${draft.oncall ? `${fh(x.ocH)}h · ${money(x.oc,2)}` : 'None'}</span></div>
      <div class="seg" role="group" aria-label="On call">${[['none','None'],['first','On call'],['second','2nd on call']].map(([k,l]) => `<button type="button" data-vo="${k}" aria-pressed="${(draft.oncall ? draft.oncall.kind : 'none')===k}">${l}</button>`).join('')}</div>
      ${draft.oncall ? `<div class="fields2">${fld('vOcS','Start', draft.oncall.start||'', 'time')}${fld('vOcE','Finish', draft.oncall.end||'', 'time')}</div>` : ''}
      <label class="toggle"><input type="checkbox" id="vBh" ${draft.bh?'checked':''}> Bank holiday${bh?' (it is one)':''}</label>
    </div>
    <div class="tsec"><div class="tsec-h"><b>Call-outs</b><span class="pill g" id="vCoAmt">${fh(x.h15+x.h2)}h · ${money(x.co,2)}</span></div>
      ${draft.callouts.map((c,i) => `<div class="co"><div class="co-top"><span>Call-out ${i+1}</span><span><button type="button" class="multbtn" data-vm="${i}" title="Tap to switch rate">${coMult(draft,c)===2?'2×':'1.5×'}</button><button type="button" class="x" data-vx="${i}" aria-label="Remove call-out ${i+1}">×</button></span></div>
        <div class="fields3">${fld(`vCf${i}`,'From', c.from||'', 'time')}${fld(`vCt${i}`,'To', c.to||'', 'time')}<div class="field"><label>Hours</label><div class="out" id="vCh${i}">${fh(coHours(c))}</div></div></div>
        ${fld(`vCn${i}`,'Note (optional)', c.note||'', 'text','placeholder="e.g. emergency theatre"')}</div>`).join('')}
      <button type="button" class="btn ghost small" data-vadd="1">+ Add call-out</button>
    </div>
    ${fld('vNote','Note', draft.note||'')}
    <div class="vsum"><span>Extra pay for this day</span><b id="vTotal">${money(x.extra,2)}</b></div>`;
  };
  openSheet(`Viki · ${dayShort(date)}`, `<div id="vBody" style="display:flex;flex-direction:column;gap:12px">${body()}</div>`, async () => {
    read();
    if (draft.status==='shift' && (!draft.start || !draft.end)) throw new Error('Add a start and finish time for the shift');
    if (draft.oncall && (!draft.oncall.start || !draft.oncall.end)) throw new Error('Add a start and finish time for the on call');
    const cos = draft.callouts.filter(c => c.from || c.to);
    if (cos.some(c => !c.from || !c.to)) throw new Error('Each call-out needs a from and to time');
    const data = { who:'viki', date, status: draft.status };
    if (draft.status==='shift') Object.assign(data, { start:draft.start, end:draft.end, lunch:draft.lunch });
    if (draft.oncall) data.oncall = { kind:draft.oncall.kind, start:draft.oncall.start, end:draft.oncall.end };
    if (draft.bh) data.bh = true;
    if (cos.length) data.callouts = cos.map(c => { const o = { from:c.from, to:c.to }; if (c.mult) o.mult = c.mult; if (c.note) o.note = c.note; return o; });
    if (draft.note) data.note = draft.note;
    if (data.status==='off' && !data.oncall && !data.callouts && !data.note) { if (rec) await remove(`days/${key}`); return; }
    await put(`days/${key}`, data);
  }, rec ? { onDelete: () => remove(`days/${key}`) } : {});
  const box = $('#vBody');
  const paint = () => { box.innerHTML = body(); };
  const refresh = () => { read(); const x = vikiDay(draft);
    const sh = $('#vShiftH'); if (sh && draft.status==='shift') sh.textContent = `${fh(x.hrs)} hours`;
    $('#vOcAmt').textContent = draft.oncall ? `${fh(x.ocH)}h · ${money(x.oc,2)}` : 'None';
    $('#vCoAmt').textContent = `${fh(x.h15+x.h2)}h · ${money(x.co,2)}`;
    draft.callouts.forEach((c,i) => { const o = $(`#vCh${i}`); if (o) o.textContent = fh(coHours(c)); const mb = box.querySelector(`[data-vm="${i}"]`); if (mb) mb.textContent = coMult(draft,c)===2 ? '2×' : '1.5×'; });
    $('#vTotal').textContent = money(x.extra,2); };
  box.addEventListener('input', refresh);
  box.addEventListener('change', refresh);
  box.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; read();
    if (b.dataset.vt) { const k = b.dataset.vt;
      if (k==='off'||k==='holiday'||k==='sick') draft.status = k;
      else if (k==='custom') { draft.status = 'shift'; draft.custom = true; draft.start = draft.start || '08:00'; draft.end = draft.end || '17:30'; if (draft.lunch==null) draft.lunch = 30; }
      else { const [a,z] = PRESETS[Number(k.slice(1))]; const hadEnd = draft.end; draft.status = 'shift'; draft.custom = false; draft.start = a; draft.end = z; if (draft.lunch==null) draft.lunch = 30;
        if (k==='p2' && !draft.oncall) draft.oncall = { kind:'first', start:'18:30', end:'08:00' };
        else if (draft.oncall && draft.oncall.start===hadEnd) draft.oncall.start = z; }
      return paint(); }
    if (b.dataset.vo) { const k = b.dataset.vo; if (k==='none') draft.oncall = null; else draft.oncall = { ...(draft.oncall || ocDefault()), kind:k }; return paint(); }
    if (b.dataset.vadd) { draft.callouts.push({ from:'', to:'' }); paint(); const f = $(`#vCf${draft.callouts.length-1}`); if (f) f.focus(); return; }
    if (b.dataset.vx) { draft.callouts.splice(Number(b.dataset.vx),1); return paint(); }
    if (b.dataset.vm) { const c = draft.callouts[Number(b.dataset.vm)]; c.mult = coMult(draft,c)===2 ? 1.5 : 2; return refresh(); }
  });
}

function insights() {
  const out = [];
  const subs = S.bills.filter(b => /subscri|stream|tv/i.test(b.category||''));
  const subTotal = subs.reduce((s,b)=>s+perMonth(b),0);
  if (subs.length) out.push(`Subscriptions cost ${money(subTotal)} a month (${money(subTotal*12,0)} a year) across ${subs.length} services. Cancelling two you rarely use is the quickest saving.`);
  const bnpl = S.bills.filter(b => /zilch|klarna|clearpay|paypal pay/i.test(b.name));
  const bnplSpend = S.spend.filter(x => x.zilch && ymOf(x.date)===ymOf(today())).reduce((s,x)=>s+(Number(x.amount)||0),0);
  if (bnpl.length || bnplSpend) out.push(`Buy-now-pay-later: ${bnplSpend ? `${money(bnplSpend)} of this month's spending went on Zilch. ` : ''}Every pound on Zilch is taken from next month's money.`);
  const finance = S.bills.filter(b => /finance|loan|car|bike/i.test(b.category||''));
  const finTotal = finance.reduce((s,b)=>s+perMonth(b),0);
  if (finance.length) out.push(`Vehicles and finance cost ${money(finTotal,0)} a month across ${finance.length} payments.`);
  const ym = ymOf(today()); const cats = S.budget.cats||[];
  cats.forEach(c => { const s = S.spend.filter(x=>x.cat===c.name && ymOf(x.date)===ym).reduce((a,x)=>a+(Number(x.amount)||0),0); if (c.limit && s > c.limit) out.push(`${c.name} is over budget this month by ${money(s-c.limit)}.`); });
  S.goals.forEach(g => { if (g.deadline && g.target) { const months=Math.max(1,Math.ceil(daysBetween(today(),g.deadline)/30.4)); const need=(g.target-(Number(g.saved)||0))/months; if (need>0) out.push(`${g.name}: put aside ${money(need,0)} a month to reach ${money(g.target,0)} by ${shortDate(g.deadline)}.`); } });
  const vExtra = daysFor('viki', `${ym}-01`, `${ym}-31`).reduce((s,d)=>s+vikiPay(d,d.date),0);
  if (vExtra > 0) out.push(`Viki has earned ${money(vExtra,0)} gross in overtime and on-call this month. Sending overtime straight to savings protects you when it drops.`);
  return out;
}

function settingsForm() {
  const s = S.settings;
  openSheet('Settings', `<p class="eyebrow">Chris</p><div class="fields2">${fld('cAllow','Holiday allowance (days)', s.chrisAllowance??'', 'number','min="0" step="0.5"')}${sel('leaveStart','Leave year starts', s.leaveStart||1, MONTHS.map((m,i)=>[i+1,m]))}</div>
    <p class="eyebrow">Viki</p>${fld('vAllow','Holiday allowance (days)', s.vikiAllowance??'', 'number','min="0" step="0.5"')}
    <div class="btnrow"><button class="btn ghost small" type="button" data-act="vrates">Viki's pay rates</button></div>
    <p class="eyebrow">Family calendar</p><div class="btnrow"><button class="btn ghost small" type="button" data-act="calset">Google Calendar links</button></div>
    <p class="eyebrow">Account</p><p class="note">Signed in as <strong>${esc(userName())}</strong></p>
    ${fld('newpass','New password (leave blank to keep)', '', 'password', 'autocomplete="new-password" minlength="8"')}
    <div class="btnrow"><button class="btn ghost small" type="button" data-act="signout">Sign out on this phone</button></div>`, async () => {
    const out = {...s}; const ca = num(v('cAllow')), va = num(v('vAllow'));
    if (ca!==null) out.chrisAllowance = ca; else delete out.chrisAllowance; if (va!==null) out.vikiAllowance = va; else delete out.vikiAllowance;
    out.leaveStart = Number(v('leaveStart'))||1;

    const np = v('newpass');
    if (np) {
      if (np.length < 8) throw new Error('New password needs at least 8 characters');
      const { error } = await sb.auth.updateUser({ password: np });
      if (error) throw new Error(/different from the old/i.test(error.message) ? 'That is already your password' : 'Couldn\'t change the password: ' + error.message);
      toast('Password changed');
    }
    await put('settings/main', out);
  });
}

/* ---------- auth ---------- */
async function handleAuth(form) {
  const err = $('#authErr'); const btn = form.querySelector('button[type="submit"]');
  const user = v('auser').trim().toLowerCase(), password = v('apass');
  const show = m => { err.textContent = m; err.hidden = !m; };
  if (!/^[a-z0-9._@-]+$/.test(user)) return show('Enter your username');
  if (!password) return show('Enter your password');
  btn.disabled = true; show('');
  try {
    const { error } = await sb.auth.signInWithPassword({ email: user.includes('@') ? user : `${user}@${LOGIN_DOMAIN}`, password });
    if (error) throw new Error(/invalid login/i.test(error.message) ? 'Username or password is wrong' : error.message);
  } catch (e) { show(e.message || 'Couldn\'t sign in'); btn.disabled = false; }
}
async function startSession(s) {
  const was = session && session.user && session.user.id;
  session = s;
  if (!session) { resetState(); CAL.calendars = []; CAL.at = 0; CAL.days = {}; try { localStorage.removeItem(CACHE_KEY); localStorage.removeItem('hhq-cal'); } catch(e) {} render(); return; }
  if (was === session.user.id && channel) return;
  if (loadCache()) render();
  try { await loadAll(); subscribe(); fetchCal(true); }
  catch (e) { offline = true; render(); }
}

/* ---------- events ---------- */
let toastTimer;
function toast(msg) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2400); }
document.addEventListener('click', async e => {
  const tabBtn = e.target.closest('nav.tabs button'); if (tabBtn) { UI.tab = tabBtn.dataset.tab; keepUI(); render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a==='close') { if (e.target === el || el.tagName==='BUTTON') closeSheet(); return; }
  if (a==='delete') { if (el.dataset.confirm) { const fn = sheetDelete; closeSheet(); if (fn) { await fn(); toast('Deleted'); } } else { el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; } return; }
  if (a==='settings') return settingsForm();
  if (a==='tab') { UI.tab = el.dataset.v; if (el.dataset.who) UI.who = el.dataset.who; if (el.dataset.seg) { if (UI.tab==='money') UI.money = el.dataset.seg; else UI.carSeg = el.dataset.seg; } keepUI(); render(); window.scrollTo(0,0); return; }
  if (a==='who') { UI.who = el.dataset.who; keepUI(); return render(); }
  if (a==='hday') { UI.hday = el.dataset.date; return render(); }
  if (a==='cal') { UI.cal = ymOf(addMonths(`${UI.cal}-01`, Number(el.dataset.v))); return render(); }
  if (a==='bm') { UI.bmonth = ymOf(addMonths(`${UI.bmonth}-01`, Number(el.dataset.v))); return render(); }
  if (a==='mseg') { UI.money = el.dataset.v; keepUI(); return render(); }
  if (a==='cseg') { UI.carSeg = el.dataset.v; keepUI(); return render(); }
  if (a==='day') return dayForm(el.dataset.date);
  if (a==='bill') return billForm(el.dataset.id);
  if (a==='spend') return spendForm(el.dataset.id);
  if (a==='cats') return catsForm();
  if (a==='goal') return goalForm(el.dataset.id);
  if (a==='service') return serviceForm(el.dataset.id);
  if (a==='fuel') return fuelForm(el.dataset.id);
  if (a==='mileage') return mileageForm();
  if (a==='calset') { closeSheet(); return calForm(); }
  if (a==='vrates') { closeSheet(); return vikiRatesForm(); }
  if (a==='vcopy') { const txt = claimText(UI.cal); try { await navigator.clipboard.writeText(txt); toast('Claim copied'); } catch(err) { toast('Couldn\'t copy on this phone'); } return; }
  if (a==='signout') { closeSheet(); await sb.auth.signOut(); return; }
  if (a==='fillweek') {
    const ym = UI.cal; const first = parse(`${ym}-01`); const n = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate(); let c = 0;
    el.disabled = true;
    for (let d=1; d<=n; d++) { const date = `${ym}-${pad(d)}`; if (isWeekend(date) || date > today() || dayRec('chris', date)) continue; await put(`days/chris_${date}`, {who:'chris', date, status:'work'}); c++; }
    toast(c ? `Marked ${c} weekdays as work` : 'No empty weekdays to fill'); return;
  }
  if (a==='checkdone') {
    const done = {...(S.checks.done||{})}; done[el.dataset.id] = { date: today(), ...(S.car.mileage ? {mileage: Number(S.car.mileage)} : {}) };
    await put('state/checks', { done }); toast('Logged as done today'); return;
  }
});
document.addEventListener('change', async e => {
  const el = e.target; if (el.dataset.act !== 'trip') return;
  const done = {...(S.trip.done||{})}; if (el.checked) done[el.dataset.id] = true; else delete done[el.dataset.id];
  await put('state/trip', { done });
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'authForm') { e.preventDefault(); return handleAuth(e.target); }
  if (e.target.id !== 'sheetForm') return; e.preventDefault();
  const fn = sheetSave; if (!fn) return;
  const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
  try { await fn(); closeSheet(); toast('Saved'); } catch (err) { formErr(err.message || 'Couldn\'t save that'); btn.disabled = false; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheetRoot').innerHTML) closeSheet(); });

/* ---------- boot ---------- */
async function boot() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#app').innerHTML = '<div class="panel"><p class="empty">Couldn\'t load the app. Check your connection and reopen it.</p></div>'; return;
  }
  if (CAL.calendars && CAL.calendars.length) { try { deriveDays(); } catch(e) {} }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  const { data } = await sb.auth.getSession();
  await startSession(data.session);
  sb.auth.onAuthStateChange((event, s) => { if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') startSession(s); else session = s || session; });
  window.addEventListener('online', () => { if (session && offline) loadAll().then(subscribe).catch(() => {}); });
}
boot();
})();
</script>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hitchen HQ</title>
<meta name="description" content="Hitchen family work, money and car">
<meta name="theme-color" content="#E6ECEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1522" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hitchen HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Hitchen HQ — drawing-sheet design system.
   Pages open with a title block (the grid in the corner of an engineering drawing) holding that page's live facts.
   One variable family (Archivo) in three widths: expanded for titles and figures, normal for reading, condensed for labels.
   Prussian ink on drafting film; Manx red is reserved for "today" and things that need attention.
   Person colours match the Google Calendar colour rules: Viki Flamingo, Chris Peacock. */
:root{
  --film:#E6ECEA; --sheet:#FAFCFB; --sheet-2:#EEF2F1; --ink:#14263A; --ink-2:#34495E; --muted:#5A6A77;
  --rule:rgba(20,38,58,.13); --rule-2:rgba(20,38,58,.30);
  --red:#C8102E; --red-soft:#F9DEE2;
  --chris:#0A6B9E; --chris-bar:#039BE5; --chris-soft:#DCEFF9;
  --viki:#B4443A; --viki-bar:#E67C73; --viki-soft:#FBE3E0;
  --oc:#3F51B5; --oc-soft:#E2E5F6;
  --gold:#855D00; --gold-bar:#F6BF26; --gold-soft:#FBEFC9;
  --good:#0B7A3E; --good-bar:#33B679; --good-soft:#DAF1E3;
  --bad:#C8102E; --bad-soft:#F9DEE2;
  /* aliases used in inline styles */
  --bg:var(--film); --surface:var(--sheet); --surface-2:var(--sheet-2); --line:var(--rule);
  --accent:var(--ink); --accent-ink:var(--sheet); --accent-soft:var(--sheet-2); --viki-on:var(--viki-bar);
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-frame:5px; --r-panel:12px; --r-ctl:9px; --r-tag:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --film:#0A1522; --sheet:#102033; --sheet-2:#172B43; --ink:#DCE6EE; --ink-2:#B3C3D1; --muted:#8C9FB2;
  --rule:rgba(220,230,238,.11); --rule-2:rgba(220,230,238,.27);
  --red:#FF5468; --red-soft:#3A1520;
  --chris:#5EC2F2; --chris-soft:#0E2D44; --viki:#F4A39B; --viki-soft:#3B1E22; --oc:#A3ACF2; --oc-soft:#1D2452;
  --gold:#F6BF26; --gold-soft:#332809; --good:#4CC38A; --good-soft:#11301F; --bad:#FF5468; --bad-soft:#3A1520;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --film:#0A1522; --sheet:#102033; --sheet-2:#172B43; --ink:#DCE6EE; --ink-2:#B3C3D1; --muted:#8C9FB2;
  --rule:rgba(220,230,238,.11); --rule-2:rgba(220,230,238,.27);
  --red:#FF5468; --red-soft:#3A1520;
  --chris:#5EC2F2; --chris-soft:#0E2D44; --viki:#F4A39B; --viki-soft:#3B1E22; --oc:#A3ACF2; --oc-soft:#1D2452;
  --gold:#F6BF26; --gold-soft:#332809; --good:#4CC38A; --good-soft:#11301F; --bad:#FF5468; --bad-soft:#3A1520;
  color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--film);margin:0}
img{max-width:100%}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--film)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.x-wide{font-stretch:125%;font-weight:800;letter-spacing:-.01em}
.login{max-width:420px;margin:8vh auto 0;width:100%}

/* header and tab bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--film);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-stretch:125%;font-weight:800;font-size:1.5rem;margin:0;letter-spacing:-.015em;line-height:1.1}
.brand small{color:var(--muted);font-size:.82rem;font-stretch:87%}
.iconbtn{border:1px solid var(--rule-2);background:var(--sheet);border-radius:var(--r-ctl);width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule-2);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{position:relative;border:0;background:none;padding:10px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.76rem;font-stretch:87%;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:750}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:26%;right:26%;height:3px;background:var(--red);border-radius:0 0 2px 2px}

/* title block: the signature element */
.tblock{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-frame);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:13px 14px 12px}
.tb-kicker{font-stretch:75%;font-weight:600;font-size:.84rem;color:var(--muted)}
.tb-title{font-stretch:125%;font-weight:800;font-size:1.6rem;line-height:1.05;letter-spacing:-.015em}
.tb-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.tb-side .big{font-stretch:125%;font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.02em}
.tb-cells{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));border-top:1px solid var(--rule-2)}
.tb-cell{padding:9px 12px 11px;border-left:1px solid var(--rule-2);min-width:0;display:flex;flex-direction:column;gap:1px}
.tb-cell:first-child{border-left:0}
.tb-cell .lb{font-stretch:75%;font-weight:600;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tb-cell .lb i{width:8px;height:8px;border-radius:2px;flex:none}
.tb-cell .vl{font-stretch:112%;font-weight:700;font-size:1rem;line-height:1.2;overflow-wrap:anywhere}
.tb-cell .vl small{font-weight:500;font-stretch:100%;color:var(--muted);font-size:.8rem}
.tb-cells.two .tb-cell:nth-child(odd){border-left:0}
.tb-cells.two .tb-cell:nth-child(n+3){border-top:1px solid var(--rule-2)}
.tb-foot{border-top:1px solid var(--rule-2);padding:9px 12px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.86rem;color:var(--ink-2)}
.tb-foot b{color:var(--ink)}
.tb-foot .alert{color:var(--red);font-weight:700}
.tb-bar{padding:0 14px 12px}
@media (max-width:370px){.tb-cells{--n:2!important}.tb-cell:nth-child(3){border-left:0;border-top:1px solid var(--rule-2)}.tb-title{font-size:1.35rem}}

/* panels and headings */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-panel);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-stretch:118%;font-weight:780;font-size:1.06rem;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:-.005em}
.panel h2 .sub{font-stretch:100%;font-weight:500;font-size:.84rem;color:var(--muted)}
.eyebrow{font-stretch:75%;font-weight:650;font-size:.84rem;color:var(--muted)}
.note{font-size:.86rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem;padding:4px 0}
.banner{background:var(--gold-soft);color:var(--ink);border-left:3px solid var(--gold);border-radius:var(--r-tag);padding:10px 12px;font-size:.88rem;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* tabs inside a page */
.seg{display:flex;gap:20px;border-bottom:1px solid var(--rule-2);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:none;padding:10px 0 9px;margin-bottom:-1px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:650;font-size:.96rem}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--red)}
.seg.who{gap:0}
.seg.who button{flex:1;font-stretch:118%;font-weight:780;font-size:1.05rem;padding:11px 0 10px}
.seg.who button[data-who="chris"][aria-pressed="true"]{border-bottom-color:var(--chris-bar);color:var(--chris)}
.seg.who button[data-who="viki"][aria-pressed="true"]{border-bottom-color:var(--viki-bar);color:var(--viki)}
.tsec .seg{border-bottom-color:var(--rule)}

/* figures */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--sheet-2);border-radius:8px;padding:10px 12px;min-width:0}
.stat b{display:block;font-stretch:125%;font-weight:800;font-size:1.35rem;line-height:1.15}
.stat span{font-size:.8rem;color:var(--muted)}
/* gauge: quarter ticks over the track */
.bar{height:8px;background:var(--sheet-2);border-radius:2px;overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--rule-2) calc(25% - 1px) 25%);pointer-events:none}
.bar i{display:block;height:100%;background:var(--ink);border-radius:2px 0 0 2px}
.bar i.over{background:var(--red)} .bar i.good{background:var(--good-bar)}
.bar.lg{height:12px}

/* lists */
.list{display:flex;flex-direction:column}
.row,.rowbtn{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);min-width:0}
.row:first-child,.rowbtn:first-child{border-top:0}
.rowbtn{all:unset;display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);cursor:pointer;min-width:0}
.rowbtn:first-child{border-top:0}
.row .grow,.rowbtn .grow,.grow{flex:1;min-width:0}
.t{font-weight:650;overflow-wrap:anywhere}
.m{font-size:.82rem;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap;font-stretch:112%}
.rowbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-tag);padding:2px 7px;font-size:.76rem;font-weight:650;font-stretch:87%;white-space:nowrap}
.chip.due{background:var(--red-soft);color:var(--red)} .chip.soon{background:var(--gold-soft);color:var(--gold)} .chip.ok{background:var(--good-soft);color:var(--good)}
.chip.cat{background:var(--sheet-2);color:var(--muted)}
.btn{border:0;border-radius:var(--r-ctl);padding:11px 15px;font-weight:680;cursor:pointer;background:var(--ink);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-2)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.small{padding:7px 11px;font-size:.86rem;border-radius:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}

/* month calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-stretch:118%;font-weight:780;font-size:1.06rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.74rem;font-stretch:75%;text-align:center;color:var(--muted);font-weight:650;padding-bottom:2px}
.cal button{aspect-ratio:1/1.08;max-width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;min-width:0}
.cal button .d{font-size:.9rem;font-weight:750;font-stretch:112%}
.cal button .l{font-size:.64rem;line-height:1.1;font-weight:650;font-stretch:87%;text-align:center;overflow:hidden;max-width:100%;white-space:nowrap;text-overflow:ellipsis}
.cal button.today{box-shadow:inset 0 0 0 2px var(--red);border-color:var(--red)}
.cal button.pad{visibility:hidden}
.st-work{background:var(--chris-soft)!important;color:var(--chris)} .st-shift{background:var(--viki-soft)!important;color:var(--viki)}
.st-oncall{background:var(--oc-soft)!important;color:var(--oc)}
.st-callout{background:var(--gold-soft)!important;color:var(--gold)} .st-holiday{background:var(--good-soft)!important;color:var(--good)}
.st-sick{background:var(--bad-soft)!important;color:var(--bad)} .st-off{background:var(--sheet-2)!important;color:var(--muted)}
.fromcal{border-style:dashed!important}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold-bar);display:inline-block}
.moon{color:var(--oc);font-size:.8rem;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .chip{border:1px solid var(--rule)}

/* sheet (forms) */
.scrim{position:fixed;inset:0;background:rgba(8,16,26,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;border-top:1.5px solid var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px}
.sheet h3{font-stretch:125%;font-weight:800;font-size:1.3rem;margin:0;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.84rem;font-stretch:87%;font-weight:650;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--rule-2);background:var(--film);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields3{display:grid;grid-template-columns:1fr 1fr .8fr;gap:8px}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:650;font-size:.88rem}
.choice button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:-2px}
.choice button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.err{color:var(--red);font-size:.86rem}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--rule);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:9px 14px;border-radius:8px;font-weight:700;z-index:50;font-size:.9rem}

/* home */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wcol{border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.wcol .wd{font-size:.72rem;font-stretch:75%;color:var(--muted);font-weight:650}
.wcol .wn{font-stretch:118%;font-size:1.12rem;font-weight:800;line-height:1.15}
.wcol .wbars{display:flex;flex-direction:column;gap:3px;width:100%;padding:3px 5px 0;min-height:34px}
.wcol .wbars i{display:block;height:5px;border-radius:2px}
.wcol .wbars em{font-style:normal;font-size:.6rem;color:var(--muted);font-weight:700;text-align:center;line-height:1}
.wcol.today .wd{color:var(--red)}
.wcol.sel{background:var(--ink);border-color:var(--ink)}
.wcol.sel .wd,.wcol.sel .wn,.wcol.sel .wbars em{color:var(--sheet)}
.wcol.sel.today .wd{color:var(--sheet)}
.agenda{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.evb{display:flex;align-items:center;gap:12px;border-radius:6px;padding:9px 11px;background:color-mix(in srgb,var(--c) 14%,var(--sheet));border-left:4px solid var(--c)}
.evbt{flex:none;width:50px;font-size:.82rem;font-weight:700;font-stretch:87%;color:var(--ink-2)}
.evb .t{font-weight:650}.evb .m{font-size:.8rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-panel);padding:12px 13px 13px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tile .tl{font-size:.84rem;font-stretch:75%;color:var(--muted);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tv{font-stretch:125%;font-size:1.6rem;font-weight:800;line-height:1.1;letter-spacing:-.015em}
.tile .ts{font-size:.8rem;color:var(--muted)}
.tile .bar{margin-top:4px}
.bdate{width:44px;flex:none;text-align:center;border:1px solid var(--rule-2);border-radius:6px;padding:4px 0 3px;line-height:1.05}
.bdate b{display:block;font-stretch:118%;font-weight:800;font-size:1.08rem}
.bdate span{font-size:.7rem;color:var(--muted);font-weight:650;font-stretch:75%}
.bdate.today{border-color:var(--red)} .bdate.today span{color:var(--red)}

/* money */
.mix{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;margin:0 14px 2px}
.mix i{display:block;height:100%}
.mixleg{display:flex;flex-direction:column;border-top:1px solid var(--rule-2);margin-top:12px}
.mixleg div{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--rule);min-width:0;font-size:.9rem}
.mixleg div:first-child{border-top:0}
.mixleg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixleg em{font-style:normal;color:var(--muted);font-size:.82rem;width:3.2em;text-align:right}
.mixleg b{font-stretch:112%;min-width:4.6em;text-align:right}
.dgroup{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.dgroup:first-child{border-top:0}
.dgroup .items{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bitem{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0}
.bitem .t{font-weight:600}
.cathead{display:flex;align-items:center;gap:8px;padding:12px 0 4px;border-top:1px solid var(--rule-2);font-stretch:112%;font-weight:750}
.cathead:first-child{border-top:0;padding-top:2px}
.cathead .nm{flex:1}
.cathead em{font-style:normal;font-weight:600;color:var(--muted);font-stretch:100%;font-size:.86rem}
.gauge{display:flex;flex-direction:column;gap:6px;padding:11px 0;border-top:1px solid var(--rule)}
.gauge:first-child{border-top:0}
.gauge .gh{display:flex;align-items:baseline;gap:8px}
.gauge .gh .t{flex:1}
.gauge .gh .amt small{font-weight:500;color:var(--muted);font-stretch:100%}
.insight{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--rule);align-items:flex-start}
.insight:first-child{border-top:0}
.insight i{width:4px;align-self:stretch;border-radius:2px;flex:none}

/* family calendar settings */
.colrow{display:flex;align-items:center;gap:8px}
.colrow input,.colrow select{border:1px solid var(--rule-2);background:var(--film);border-radius:8px;padding:9px 10px;min-width:0}
.colrow input{flex:1}

<script>
(() => {
'use strict';
/* ---------- utilities ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const ymOf = s => String(s).slice(0,7);
const today = () => ymd(new Date());
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const addMonths = (s,n) => { const d=parse(s); const day=d.getDate(); const t=new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return ymd(t); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const isWeekend = s => { const w=parse(s).getDay(); return w===0||w===6; };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthName = ym => { const [y,m]=ym.split('-').map(Number); return `${MONTHS[m-1]} ${y}`; };
const shortDate = s => { if(!/^\d{4}-\d\d-\d\d$/.test(String(s))) return esc(s||''); const d=parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; };
const money = (n, dp) => { const v=Number(n)||0; const d = dp ?? (Math.abs(v)%1 ? 2 : 0); return (v<0?'−£':'£') + Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d}); };
const num = v => { const n=parseFloat(String(v).replace(/[£,\s]/g,'')); return isFinite(n)?n:null; };
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- state ---------- */
const S = { settings:{}, days:{}, bills:[], goals:[], spend:[], budget:{cats:[]}, car:{}, service:[], fuel:[], checks:{done:{}}, trip:{done:{}}, cal:{feeds:[]}, loaded:0 };

let sb = null, session = null, offline = false;
const LOGIN_DOMAIN = 'hitchen.example.com'; // usernames map to <username>@this (never emailed)
const userName = () => { const u = session && session.user; if (!u) return ''; return (u.user_metadata && u.user_metadata.username) || (u.email||'').split('@')[0]; };

/* ---------- static definitions ---------- */
const DEFAULT_RATES = { base:0, ot15:0, ot2:0, bh:0, oncallWD:0, oncallWE:0, secondWD:0, secondWE:0 };
const CHECKS = [
  {id:'m_levels', g:'Monthly', t:'Oil and coolant levels', days:30},
  {id:'m_tyres', g:'Monthly', t:'Tyre pressures (by eye too)', days:30},
  {id:'m_charge', g:'Monthly', t:'Overnight battery top-up charge (negative clip on chassis earth)', days:30},
  {id:'m_wash', g:'Monthly', t:'Hose underside and wheel arches', days:30},
  {id:'m_run', g:'Monthly', t:'One proper run with firm acceleration', days:30},
  {id:'s_oil', g:'Every 6 months / 6,000 miles', t:'Oil and filter, 0W-30 STJLR.03.5007', days:182, miles:6000},
  {id:'s_hoses', g:'Every 6 months / 6,000 miles', t:'Check boost hoses, clamps and brakes', days:182},
  {id:'s_chips', g:'Every 6 months / 6,000 miles', t:'Touch in stone chips on aluminium panels', days:182},
  {id:'o_driveline', g:'Next service (one-off)', t:'Gearbox fluid, rear coupling, PTU and rear diff oils', days:1825},
  {id:'y_battery', g:'Every 12 months', t:'Battery conductance test', days:365},
  {id:'y_pollen', g:'Every 12 months', t:'Cabin pollen filter', days:365},
  {id:'y_drains', g:'Every 12 months', t:'Clear scuttle, door and sill drains', days:365},
  {id:'y_seals', g:'Every 12 months', t:'Clean and condition door and tailgate seals', days:365},
  {id:'y_boot', g:'Every 12 months', t:'Check under boot floor for damp', days:365},
  {id:'b_brakefluid', g:'Every 2 years', t:'Brake fluid', days:730},
  {id:'b_fuelfilter', g:'Every 2 years', t:'Fuel filter', days:730},
  {id:'b_airfilter', g:'Every 2 years', t:'Air filter', days:730},
  {id:'b_underbody', g:'Every 2 years', t:'Underbody inspection and wax', days:730},
];
const TRIP = [
  {g:'Legal kit for France', items:[
    ['t_gbm','GBM identifier on the back of the car'],['t_idp','International Driving Permit (£11, Isle of Man Post Office)'],
    ['t_docs','Original registration document, insurance details, passports'],['t_triangle','Warning triangle'],
    ['t_vests','Hi-vis vest for everyone, inside the cabin'],['t_beam','Headlights adjusted for driving on the right'],
    ['t_critair','Crit\'Air sticker (only if driving into Paris), bought from the official site'],['t_nodetector','No speed camera detector apps on'] ]},
  {g:'Cover and paperwork', items:[
    ['t_breakdown','European breakdown cover confirmed (check RAC policy first)'],['t_ins','Insurer told about the trip and modifications'],
    ['t_revolut','Revolut card topped up for euro spending'] ]},
  {g:'Car prep', items:[
    ['t_windscreen','Windscreen leak fixed'],['t_screenwash','Screenwash with antifreeze'],['t_tyres','Tyres checked'],
    ['t_oil','Oil level checked'],['t_battery','Battery tested'] ]},
  {g:'Comfort for the drive', items:[
    ['t_charger','12V multi-port USB charger and long lead to the back'],['t_downloads','Films, shows and music downloaded on tablets'],
    ['t_headphones','Wired headphones'],['t_mounts','Headrest tablet mounts'],['t_pillows','Travel pillows and blankets'],
    ['t_food','Cool bag, snacks and drinks'],['t_tidy','Seat-back organisers, bin bags, wipes'],['t_maps','Offline maps for France downloaded'],
    ['t_holder','Phone holder fitted'],['t_audio','Family audiobook downloaded'] ]},
];

/* ---------- data layer ---------- */
const COLL = { bills:'bills', goals:'goals', spend:'spend', service:'service', fuel:'fuel' };
function applyLocal(path, data) {
  const [c, id] = path.split('/');
  if (c === 'days') { if (data) S.days[id] = data; else delete S.days[id]; }
  else if (COLL[c]) { const arr = S[c]; const i = arr.findIndex(x => x.id === id); if (!data) { if (i>=0) arr.splice(i,1); } else if (i>=0) arr[i] = {...data, id}; else arr.push({...data, id}); }
  else if (c === 'settings') S.settings = data || {};
  else if (c === 'budget') S.budget = data || {cats:[]};
  else if (c === 'car') S.car = data || {};
  else if (c === 'private') { if (id==='calendar') S.cal = data || {feeds:[]}; }
  else if (c === 'state') { if (id==='checks') S.checks = data||{done:{}}; if (id==='trip') S.trip = data||{done:{}}; }
}
/* Every record is one row in the `docs` table: path (e.g. "bills/b_rent") plus its JSON data. */
const CACHE_KEY = 'hhq-cache-v1';
let cacheTimer;
function resetState() {
  Object.assign(S, { settings:{}, days:{}, bills:[], goals:[], spend:[], budget:{cats:[]}, car:{}, service:[], fuel:[], checks:{done:{}}, trip:{done:{}}, cal:{feeds:[]} });
}
function snapshotRows() {
  const rows = [];
  rows.push(['settings/main', S.settings], ['budget/main', S.budget], ['car/main', S.car], ['state/checks', S.checks], ['state/trip', S.trip], ['private/calendar', S.cal]);
  Object.entries(S.days).forEach(([id,d]) => rows.push([`days/${id}`, d]));
  Object.keys(COLL).forEach(c => S[c].forEach(({id, ...d}) => rows.push([`${c}/${id}`, d])));
  return rows;
}
function saveCache() { clearTimeout(cacheTimer); cacheTimer = setTimeout(() => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(snapshotRows())); } catch(e) {} }, 500); }
function loadCache() { try { const rows = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (!Array.isArray(rows)) return false; resetState(); rows.forEach(([p,d]) => applyLocal(p,d)); return true; } catch(e) { return false; } }
async function put(path, data) {
  applyLocal(path, data); schedule(); saveCache();
  if (!sb || !session) return;
  const { error } = await sb.from('docs').upsert({ path, coll: path.split('/')[0], data });
  if (error) toast(navigator.onLine ? 'Couldn\'t save. Check you\'re signed in and try again' : 'You\'re offline. Changes weren\'t saved');
}
async function remove(path) {
  applyLocal(path, null); schedule(); saveCache();
  if (!sb || !session) return;
  const { error } = await sb.from('docs').delete().eq('path', path);
  if (error) toast('Couldn\'t delete. Try again');
}
async function loadAll() {
  const out = []; let from = 0;
  while (true) {
    const { data, error } = await sb.from('docs').select('path,data').order('path').range(from, from + 999);
    if (error) throw error;
    out.push(...data); if (data.length < 1000) break; from += 1000;
  }
  resetState(); out.forEach(r => applyLocal(r.path, r.data)); offline = false; schedule(); saveCache();
}
let channel = null;
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('family-docs')
    .on('postgres_changes', { event:'*', schema:'public', table:'docs' }, p => {
      if (p.eventType === 'DELETE') { if (p.old && p.old.path) applyLocal(p.old.path, null); }
      else if (p.new && p.new.path) applyLocal(p.new.path, p.new.data);
      schedule(); saveCache();
    })
    .subscribe();
}

/* ---------- derived values ---------- */
const rates = () => ({...DEFAULT_RATES, ...(S.settings.rates||{})});
function nextDue(b) {
  if (!b.due) return null;
  let d = b.due, t = today(), guard = 0;
  const step = b.freq==='weekly' ? (s=>addDays(s,7)) : b.freq==='quarterly' ? (s=>addMonths(s,3)) : b.freq==='annual' ? (s=>addMonths(s,12)) : (s=>addMonths(s,1));
  while (d < t && guard++ < 600) d = step(d);
  return d;
}
const perMonth = b => { const a = Number(b.amount)||0; return b.freq==='weekly' ? a*52/12 : b.freq==='quarterly' ? a/3 : b.freq==='annual' ? a/12 : a; };
function leaveYear() {
  const startMM = Number(S.settings.leaveStart || 1); const t = parse(today());
  let y = t.getFullYear(); if (t.getMonth()+1 < startMM) y--;
  const from = `${y}-${pad(startMM)}-01`; return { from, to: addDays(addMonths(from,12),-1) };
}
function daysFor(who, from, to) {
  const m = {};
  Object.values(CAL.days || {}).forEach(d => { if (d.who===who && d.date>=from && d.date<=to) m[d.date] = d; });
  Object.values(S.days).forEach(d => { if (d.who===who && d.date>=from && d.date<=to) m[d.date] = d; });
  return Object.values(m);
}
function checkStatus(c) {
  const rec = (S.checks.done||{})[c.id];
  if (!rec) return { cls:'due', label:'Not logged yet', next:null };
  const next = addDays(rec.date, c.days); const left = daysBetween(today(), next);
  let miles = null;
  if (c.miles && rec.mileage && S.car.mileage) { miles = rec.mileage + c.miles - S.car.mileage; }
  if (left < 0 || (miles!==null && miles <= 0)) return { cls:'due', label:'Due now', next, miles };
  if (left <= 14 || (miles!==null && miles <= 500)) return { cls:'soon', label: `Due ${shortDate(next)}`, next, miles };
  return { cls:'ok', label: `Next ${shortDate(next)}`, next, miles };
}

/* ---------- rendering ---------- */
let pending = false;
function schedule() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); }
function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab===UI.tab ? 'page' : 'false'));

}

/* ----- title block: the grid of labelled boxes that opens each page ----- */
const tbCell = (lb, vl, color) => `<div class="tb-cell"><span class="lb">${color ? `<i style="background:${color}"></i>` : ''}${lb}</span><span class="vl">${vl}</span></div>`;

}

const evDate = e => e.allDay ? e.start : ymd(new Date(e.start));
const evTime = e => e.allDay ? '' : new Date(e.start).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

/* Rota entries in the calendar: "V: 8-6", "V: on call", "V: AL", "V: sick", "V: DO", "C: 8-5" */
function parseRota(title) {
  const m = /^\s*(VH|V|C)\s*[:\-]\s*/i.exec(String(title||'')); if (!m) return null;
  const who = m[1].toUpperCase()==='C' ? 'chris' : 'viki', t = title.slice(m[0].length).trim();
  if (/on\s*-?\s*call/i.test(t)) return { who, kind:'oncall' };
  if (/\bAL\b|annual leave|holiday/i.test(t)) return { who, kind:'holiday' };
  if (/sick/i.test(t)) return { who, kind:'sick' };
  if (/\bR?DO\b|day off|pay\s*back|toil/i.test(t)) return { who, kind:'off', note:t };
  const x = /(\d{1,2})(?:[:.](\d{2}))?\s*-\s*(\d{1,2})(?:[:.](\d{2}))?/.exec(t);
  if (x) { const sh = +x[1], sm = +(x[2]||0); let eh = +x[3]; const em = +(x[4]||0);
    if (eh*60+em <= sh*60+sm && eh < 12) eh += 12;
    return { who, kind:'shift', start:`${pad(sh)}:${pad(sm)}`, end:`${pad(eh%24)}:${pad(em)}`, note: /\bOT\b/i.test(t) ? 'Overtime' : '' }; }
  return null;
}
function deriveDays() {
  const out = {};
  (CAL.calendars||[]).forEach(c => (c.events||[]).forEach(e => {
    const r = parseRota(e.title); if (!r) return;
    const date = evDate(e), key = `${r.who}_${date}`;
    const d = out[key] || (out[key] = { who:r.who, date, fromCal:true });
    if (r.kind==='shift') { d.status = r.who==='chris' ? 'work' : 'shift'; d.start = r.start; d.end = r.end; d.lunch = 30; if (r.note) d.note = r.note; }
    else if (r.kind==='oncall') d.oc = true;
    else if (!d.status) { d.status = r.kind; if (r.note) d.note = r.note; }
  }));
  Object.values(out).forEach(d => {
    if (d.oc && d.who==='viki') {
      if (isWeekend(d.date) || isBH(d.date)) { if (!d.status) d.status = 'off'; d.oncall = { kind:'first', start:'08:00', end:'08:00' }; }
      else { if (!d.status) { d.status = 'shift'; d.start = '08:00'; d.end = parse(d.date).getDay()===5 ? '18:00' : '18:30'; d.lunch = 30; }
        d.oncall = { kind:'first', start: d.status==='shift' ? d.end : '18:30', end:'08:00' }; }
    }
    if (d.oc && d.who==='chris' && !d.status) d.status = 'callout';
    if (!d.status) d.status = 'off'; delete d.oc;
  });
  CAL.days = out;
}
const dayRec = (who, date) => S.days[`${who}_${date}`] || (CAL.days||{})[`${who}_${date}`];

/* everything happening on each day: calendar events (coloured) plus on call logged only in the app */
function agenda(from, to) {
  const byDay = {};
  const add = (date, item) => { if (date < from || date > to) return; (byDay[date] = byDay[date] || []).push(item); };
  const calOncall = new Set();
  (CAL.calendars||[]).forEach((c, ci) => (c.events||[]).forEach(e => {
    const color = evColor(e.title, ci); const r = parseRota(e.title); if (r && r.kind==='oncall') calOncall.add(`${r.who}_${evDate(e)}`);
    if (e.allDay) { for (let d = e.start; d < (e.end || addDays(e.start,1)); d = addDays(d,1)) add(d, { sort:'', time:'', title:e.title, color }); }
    else add(evDate(e), { sort:evTime(e), time:evTime(e), title:e.title, where:e.location, color });
  }));
  Object.values(S.days).forEach(d => { if (d.who==='viki' && d.oncall && !calOncall.has(`viki_${d.date}`)) add(d.date, { sort:d.oncall.start||'', time:hm(d.oncall.start), title: d.oncall.kind==='second' ? 'Viki 2nd on call' : 'Viki on call', color: evColor('V: on call', 0) }); });
  Object.values(byDay).forEach(a => a.sort((x,y) => x.sort < y.sort ? -1 : x.sort > y.sort ? 1 : 0));
  return byDay;
}

function niceTitle(title) {
  const m = /^\s*(VH|V|C)\s*[:\-]\s*/i.exec(String(title||'')); if (!m) return title;
  const rest = title.slice(m[0].length).trim();
  return `${m[1].toUpperCase()==='C' ? 'Chris' : 'Viki'} · ${rest.replace(/^(\d{1,2}(?:[:.]\d{2})?)\s*-\s*/, '$1–')}`;
}

}

/* ----- Viki: pay, rota and on-call claims -----
   Her actual rates live in the private database (settings/main → viki), never in this public code.
   Model: salary + on-call standing hours × rate + call-out hours × basic × 1.5 (Mon–Sat) or 2 (Sun and bank holidays).
   Pension is a % of salary + on call; NI is a fixed monthly part + a % of gross; tax is a rate above the tax-code allowance. */
const VIKI_DEFAULT = { salary:0, base:0, standby:0, secondWD:0, secondWE:0, pension:0, niFixed:0, niPct:0, taxCode:0, taxRate:20, arrears:true };
const vk = () => ({...VIKI_DEFAULT, ...(S.settings.viki||{})});
const BANK_HOLS = new Set(['2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-05-25','2026-06-05','2026-07-05','2026-07-06','2026-08-31','2026-12-25','2026-12-26','2026-12-28',
  '2027-01-01','2027-03-26','2027-03-29','2027-05-03','2027-05-31','2027-06-11','2027-07-05','2027-08-30','2027-12-25','2027-12-26','2027-12-27','2027-12-28']);
const isBH = s => BANK_HOLS.has(s);
const DOWS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(String(t||'')); return m ? Number(m[1])*60 + Number(m[2]) : null; };
const span = (a,b) => { const x = toMin(a), y = toMin(b); if (x===null || y===null) return 0; let d = y - x; if (d <= 0) d += 1440; return d/60; };
const hm = t => t ? String(t).replace(/^0(\d)/,'$1') : '';
const fh = h => { const r = Math.round((Number(h)||0)*100)/100; return String(r); };
const PRESETS = [['08:00','17:30'],['08:00','18:00'],['08:00','18:30']];
function shiftHours(d) { if (d.status!=='shift' || !d.start || !d.end) return 0; return Math.max(0, span(d.start, d.end) - (Number(d.lunch ?? 30))/60); }
function ocRate(d) { const r = vk(); if (!d.oncall) return 0; if (d.oncall.kind==='second') return (isWeekend(d.date) || d.bh) ? r.secondWE : r.secondWD; return r.standby; }
const ocHours = d => d.oncall ? span(d.oncall.start, d.oncall.end) : 0;
function coDate(d, c) { const s = toMin(c.from), os = toMin(d.oncall ? d.oncall.start : (d.end || '00:00')); return (s!==null && os!==null && s < os) ? addDays(d.date,1) : d.date; }
function coMult(d, c) { if (c.mult) return Number(c.mult); const cd = coDate(d,c); return (parse(cd).getDay()===0 || isBH(cd) || (cd===d.date && d.bh)) ? 2 : 1.5; }
const coHours = c => span(c.from, c.to);
function vikiDay(d) {
  const r = vk(); const o = { hrs: shiftHours(d), ocH: ocHours(d), oc:0, h15:0, h2:0, co:0 };
  o.oc = o.ocH * ocRate(d);
  (d.callouts||[]).forEach(c => { const h = coHours(c), m = coMult(d,c); if (m===2) o.h2 += h; else o.h15 += h; o.co += h * r.base * m; });
  o.extra = o.oc + o.co; return o;
}
const vikiPay = d => (d && d.who==='viki') ? vikiDay(d).extra : 0;
function vikiMonth(ym) {
  const days = daysFor('viki', `${ym}-01`, `${ym}-31`).sort((a,b) => a.date < b.date ? -1 : 1);
  const t = { oc:0, ocH:0, co:0, h15:0, h2:0, hrs:0, days };
  days.forEach(d => { const x = vikiDay(d); t.oc += x.oc; t.ocH += x.ocH; t.co += x.co; t.h15 += x.h15; t.h2 += x.h2; t.hrs += x.hrs; });
  return t;
}
function payslip(oc, co) {
  const r = vk(); const gross = r.salary + oc + co;
  const pension = (r.salary + oc) * r.pension/100;
  const ni = r.niFixed + gross * r.niPct/100;
  const tax = Math.max(0, (gross - pension - r.taxCode*10/12) * r.taxRate/100);
  return { gross, pension, ni, tax, net: gross - pension - ni - tax };
}
function payday(ym) { let d = `${ym}-25`; const w = parse(d).getDay(); if (w===6) d = addDays(d,-1); if (w===0) d = addDays(d,-2); return d; }
const dayShort = s => { const d = parse(s); return `${DOWS[d.getDay()].slice(0,3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };

function viewViki() {

    <div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>

function claimRows(m) {
  const rows = [];
  m.days.filter(d => d.oncall || (d.callouts||[]).length).forEach(d => {
    const x = vikiDay(d), cos = d.callouts||[];
    const base = { date:d.date, day:DOWS[parse(d.date).getDay()].slice(0,3), start:d.oncall?hm(d.oncall.start):'', end:d.oncall?hm(d.oncall.end):'', hrs:d.oncall?fh(x.ocH):'', amt:d.oncall?x.oc:null, second:d.oncall&&d.oncall.kind==='second' };
    if (!cos.length) rows.push({...base, cont:false});
    cos.forEach((c,i) => rows.push({...(i ? {date:d.date, day:'', start:'', end:'', hrs:'', amt:null} : base), cont: i>0, from:hm(c.from), to:hm(c.to), ch:fh(coHours(c)), mult:coMult(d,c), note:c.note||''}));

}

function vikiDayForm(date) {

  return `<section class="panel"><h2>Fuel <button class="btn small" data-act="fuel">Add fill-up</button></h2>
    <div class="stats"><div class="stat"><span>Average</span><b>${avg?avg.toFixed(1):'—'}</b><span>mpg</span></div><div class="stat"><span>Fuel this month</span><b>${money(monthCost,0)}</b><span>${MONTHS[parse(today()).getMonth()]}</span></div></div>
    ${rows.length ? `<div class="list">${rows.map(r => `<button class="rowbtn" data-act="fuel" data-id="${esc(r.id)}"><div class="grow"><div class="t">${shortDate(r.date)}</div><div class="m">${Number(r.mileage).toLocaleString('en-GB')} miles · ${r.litres} L${r.mpg?` · ${r.mpg.toFixed(1)} mpg`:''}${r.ppm?` · ${(r.ppm*100).toFixed(1)}p a mile`:''}</div></div><div class="amt">${money(r.cost)}</div></button>`).join('')}</div>` : `<p class="empty">Log fill-ups with the mileage and litres to see your real mpg. Fill to full each time for accurate figures.</p>`}
  </section>`;
}
function viewTrip() {
  const done = S.trip.done || {}; const all = TRIP.flatMap(g=>g.items); const n = all.filter(([id])=>done[id]).length;
  return `<section class="panel"><h2>Disneyland Paris <span class="sub num">${n} of ${all.length} done</span></h2><div class="bar"><i class="good" style="width:${Math.round(n/all.length*100)}%"></i></div></section>` +
    TRIP.map(g => `<section class="panel"><h2>${esc(g.g)}</h2><div class="list">${g.items.map(([id,t]) => `<label class="check ${done[id]?'done':''}"><input type="checkbox" id="${id}" data-act="trip" data-id="${id}" ${done[id]?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div></section>`).join('');
}

/* ---------- sheets (forms) ---------- */
let sheetSave = null;
function openSheet(title, inner, onSave, opts={}) {
  sheetSave = onSave;
  $('#sheetRoot').innerHTML = `<div class="scrim" data-act="close"><form class="sheet" id="sheetForm" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <h3>${esc(title)}</h3>${inner}<p class="err" id="formErr" hidden></p>
    <div class="btnrow"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-act="close">Cancel</button>${opts.onDelete?'<button class="btn danger" type="button" data-act="delete">Delete</button>':''}</div>
  </form></div>`;
  sheetDelete = opts.onDelete || null;
  const first = $('#sheetForm input, #sheetForm select, #sheetForm textarea'); if (first) setTimeout(()=>first.focus({preventScroll:true}), 30);
}
let sheetDelete = null;
const closeSheet = () => { $('#sheetRoot').innerHTML = ''; sheetSave = sheetDelete = null; };
const fld = (id, label, val='', type='text', extra='') => `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(val)}" ${extra}></div>`;
const sel = (id, label, val, options) => `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${id}">${options.map(([v,l]) => `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
const formErr = msg => { const e = $('#formErr'); e.textContent = msg; e.hidden = !msg; };
const v = id => ($('#'+id)||{}).value ?? '';

function dayForm(date) {
  if (UI.who==='viki') return vikiDayForm(date);
  const who = UI.who, key = `${who}_${date}`, rec = S.days[key] || (CAL.days||{})[key] || {};
  let status = rec.status || (who==='chris' ? 'work' : 'shift');
  const choice = `<div class="field"><label>Day type</label><div class="choice" id="stChoice">${STATUS[who].map(([k,l]) => `<button type="button" class="st-${k}" data-st="${k}" aria-pressed="${status===k}">${l}</button>`).join('')}</div></div>`;
  let extra = '';
  if (who==='chris') extra = `<div id="calloutBox" ${status==='callout'?'':'hidden'}>${fld('callouts','Call-outs attended', rec.callouts||'', 'number', 'min="0" step="1" inputmode="numeric"')}</div>`;
  openSheet(`${who==='chris'?'Chris':'Viki'} · ${shortDate(date)}`, choice + extra + fld('note','Note', rec.note||''), async () => {
    const data = { who, date, status };
    if (who==='chris' && status==='callout') { const c = num(v('callouts')); if (c!==null) data.callouts = Math.max(0,Math.round(c)); }
    const note = v('note').trim(); if (note) data.note = note;
    if (status==='off' && !note) { await remove(`days/${key}`); return; }
    await put(`days/${key}`, data);
  }, S.days[key] ? { onDelete: () => remove(`days/${key}`) } : {});
  $('#stChoice').addEventListener('click', e => { const b = e.target.closest('button[data-st]'); if (!b) return; status = b.dataset.st;
    $('#stChoice').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x===b)); const box = $('#calloutBox'); if (box) box.hidden = status!=='callout'; });
}
const CATS = ['Home','Utilities','Phones & broadband','Subscriptions','Insurance','Car & bike finance','Car','Kids','Debt','Other'];
function billForm(id) {
  const b = S.bills.find(x=>x.id===id) || {};
  openSheet(id ? 'Edit bill' : 'Add bill', fld('bname','Name', b.name||'') + `<div class="fields2">${fld('bamount','Amount (£)', b.amount??'', 'number','min="0" step="0.01" inputmode="decimal"')}${sel('bfreq','How often', b.freq||'monthly', [['monthly','Monthly'],['weekly','Weekly'],['quarterly','Quarterly'],['annual','Yearly']])}</div>
    <div class="fields2">${fld('bdue','Next payment date', b.due || today(), 'date')}${sel('bcat','Category', b.category||'Other', CATS.map(c=>[c,c]))}</div>` + fld('bnote','Note', b.note||''), async () => {
    const name = v('bname').trim(), amount = num(v('bamount'));
    if (!name) throw new Error('Enter a name for the bill'); if (amount===null || amount<0) throw new Error('Enter the amount, such as 21.99');
    const data = { name, amount, freq:v('bfreq'), due:v('bdue'), category:v('bcat') }; const note=v('bnote').trim(); if (note) data.note=note;
    await put(`bills/${id || uid('b')}`, data);
  }, id ? { onDelete: () => remove(`bills/${id}`) } : {});
}
function spendForm(id) {
  const x = S.spend.find(s=>s.id===id) || {}; const cats = (S.budget.cats||[]).map(c=>c.name);
  if (!cats.length) { toast('Add budget categories first'); catsForm(); return; }
  openSheet(id ? 'Edit spending' : 'Add spending', `<div class="fields2">${fld('samount','Amount (£)', x.amount??'', 'number','min="0" step="0.01" inputmode="decimal"')}${fld('sdate','Date', x.date || today(), 'date')}</div>` + sel('scat','Category', x.cat || cats[0], cats.map(c=>[c,c])) + fld('snote','What was it?', x.note||'') +
    `<label class="check" style="border:0"><input type="checkbox" id="szilch" ${x.zilch?'checked':''}><span>Paid with Zilch or another pay-later service</span></label>`, async () => {
    const amount = num(v('samount')); if (amount===null || amount<=0) throw new Error('Enter the amount spent');
    const data = { amount, date:v('sdate') || today(), cat:v('scat') }; const note=v('snote').trim(); if (note) data.note=note; if ($('#szilch').checked) data.zilch = true;
    await put(`spend/${id || uid('s')}`, data);
  }, id ? { onDelete: () => remove(`spend/${id}`) } : {});
}
function catsForm() {
  const cats = S.budget.cats || [];
  const text = cats.map(c => `${c.name}, ${c.limit}`).join('\n');
  openSheet('Budget categories', `<div class="field"><label for="ctext">One per line: name, monthly limit</label><textarea id="ctext" rows="8" placeholder="Food, 500&#10;Fuel, 150">${esc(text)}</textarea></div><p class="note">Spending already logged keeps its category name.</p>`, async () => {
    const lines = v('ctext').split('\n').map(l=>l.trim()).filter(Boolean); const out = [];
    for (const l of lines) { const i = l.lastIndexOf(','); const name = (i>0?l.slice(0,i):l).trim(); const limit = i>0 ? num(l.slice(i+1)) : 0;
      if (!name) continue; if (limit===null) throw new Error(`Check the limit on "${l}". Use a number, such as Food, 500`); out.push({name, limit}); }
    await put('budget/main', { cats: out });
  });
}
function goalForm(id) {
  const g = S.goals.find(x=>x.id===id) || {};
  openSheet(id ? g.name : 'New savings goal', fld('gname','Goal', g.name||'') + `<div class="fields2">${fld('gtarget','Target (£)', g.target??'', 'number','min="0" step="1" inputmode="decimal"')}${fld('gsaved','Saved so far (£)', g.saved??0, 'number','step="0.01" inputmode="decimal"')}</div>` +
    (id ? fld('gadd','Add to it now (£)', '', 'number','step="0.01" inputmode="decimal"') : '') + fld('gdeadline','Target date (optional)', g.deadline||'', 'date'), async () => {
    const name = v('gname').trim(), target = num(v('gtarget')); let saved = num(v('gsaved')) || 0; const add = id ? num(v('gadd')) : null;
    if (!name) throw new Error('Name the goal'); if (target===null || target<=0) throw new Error('Enter a target amount');
    if (add) saved += add;
    const data = { name, target, saved: Math.round(saved*100)/100 }; if (v('gdeadline')) data.deadline = v('gdeadline');
    await put(`goals/${id || uid('g')}`, data);
  }, id ? { onDelete: () => remove(`goals/${id}`) } : {});
}
function serviceForm(id) {
  const s = S.service.find(x=>x.id===id) || {};
  openSheet(id ? 'Edit job' : 'Add job', fld('swork','Work done', s.work||'') + `<div class="fields2">${fld('sdate2','Date', /^\d{4}-\d\d-\d\d$/.test(s.date||'') ? s.date : (s.date ? '' : today()), 'date')}${fld('smiles','Mileage', s.mileage??'', 'number','min="0" step="1" inputmode="numeric"')}</div>
    <div class="fields2">${fld('sgarage','Garage', s.garage||'')}${fld('scost','Cost (£)', s.cost??'', 'number','min="0" step="0.01" inputmode="decimal"')}</div>` + sel('sstatus','Status', s.status||'done', [['done','Done'],['booked','Booked']]), async () => {
    const work = v('swork').trim(); if (!work) throw new Error('Describe the work done');
    const date = v('sdate2') || s.date || today();
    const data = { work, date, sort: /^\d{4}/.test(date) ? date : String(s.sort||date), status:v('sstatus') };
    const m = num(v('smiles')); if (m) data.mileage = m; const c = num(v('scost')); if (c) data.cost = c; const g = v('sgarage').trim(); if (g) data.garage = g;
    await put(`service/${id || uid('sv')}`, data);
    if (m && (!S.car.mileage || m > S.car.mileage)) await put('car/main', {...S.car, mileage:m, mileageDate:/^\d{4}-\d\d-\d\d$/.test(date)?date:today()});
  }, id ? { onDelete: () => remove(`service/${id}`) } : {});
}
function fuelForm(id) {
  const f = S.fuel.find(x=>x.id===id) || {};
  openSheet(id ? 'Edit fill-up' : 'Add fill-up', `<div class="fields2">${fld('fdate','Date', f.date||today(), 'date')}${fld('fmiles','Odometer (miles)', f.mileage ?? (S.car.mileage||''), 'number','min="0" step="1" inputmode="numeric"')}</div>
    <div class="fields2">${fld('flitres','Litres', f.litres??'', 'number','min="0" step="0.01" inputmode="decimal"')}${fld('fcost','Cost (£)', f.cost??'', 'number','min="0" step="0.01" inputmode="decimal"')}</div>
    <label class="check" style="border:0"><input type="checkbox" id="ffull" ${f.full===false?'':'checked'}><span>Filled to full</span></label>`, async () => {
    const mileage = num(v('fmiles')), litres = num(v('flitres')), cost = num(v('fcost'));
    if (!mileage) throw new Error('Enter the odometer reading'); if (!litres) throw new Error('Enter the litres');
    await put(`fuel/${id || uid('f')}`, { date:v('fdate')||today(), mileage, litres, cost: cost||0, full: $('#ffull').checked });
    if (!S.car.mileage || mileage > S.car.mileage) await put('car/main', {...S.car, mileage, mileageDate: v('fdate')||today()});
  }, id ? { onDelete: () => remove(`fuel/${id}`) } : {});
}
function mileageForm() {
  openSheet('Update mileage', fld('mval','Odometer (miles)', S.car.mileage||'', 'number','min="0" step="1" inputmode="numeric"'), async () => {
    const m = num(v('mval')); if (!m) throw new Error('Enter the odometer reading'); await put('car/main', {...S.car, mileage:m, mileageDate: today()});
  });
}
function settingsForm() {
  const s = S.settings;
  openSheet('Settings', `<p class="eyebrow">Chris</p><div class="fields2">${fld('cAllow','Holiday allowance (days)', s.chrisAllowance??'', 'number','min="0" step="0.5"')}${sel('leaveStart','Leave year starts', s.leaveStart||1, MONTHS.map((m,i)=>[i+1,m]))}</div>
    <p class="eyebrow">Viki</p>${fld('vAllow','Holiday allowance (days)', s.vikiAllowance??'', 'number','min="0" step="0.5"')}
    <div class="btnrow"><button class="btn ghost small" type="button" data-act="vrates">Viki's pay rates</button></div>
    <p class="eyebrow">Family calendar</p><div class="btnrow"><button class="btn ghost small" type="button" data-act="calset">Google Calendar links</button></div>
    <p class="eyebrow">Account</p><p class="note">Signed in as <strong>${esc(userName())}</strong></p>
    ${fld('newpass','New password (leave blank to keep)', '', 'password', 'autocomplete="new-password" minlength="8"')}
    <div class="btnrow"><button class="btn ghost small" type="button" data-act="signout">Sign out on this phone</button></div>`, async () => {
    const out = {...s}; const ca = num(v('cAllow')), va = num(v('vAllow'));
    if (ca!==null) out.chrisAllowance = ca; else delete out.chrisAllowance; if (va!==null) out.vikiAllowance = va; else delete out.vikiAllowance;
    out.leaveStart = Number(v('leaveStart'))||1;

    const np = v('newpass');
    if (np) {
      if (np.length < 8) throw new Error('New password needs at least 8 characters');
      const { error } = await sb.auth.updateUser({ password: np });
      if (error) throw new Error(/different from the old/i.test(error.message) ? 'That is already your password' : 'Couldn\'t change the password: ' + error.message);
      toast('Password changed');
    }
    await put('settings/main', out);
  });
}

/* ---------- auth ---------- */
async function handleAuth(form) {
  const err = $('#authErr'); const btn = form.querySelector('button[type="submit"]');
  const user = v('auser').trim().toLowerCase(), password = v('apass');
  const show = m => { err.textContent = m; err.hidden = !m; };
  if (!/^[a-z0-9._@-]+$/.test(user)) return show('Enter your username');
  if (!password) return show('Enter your password');
  btn.disabled = true; show('');
  try {
    const { error } = await sb.auth.signInWithPassword({ email: user.includes('@') ? user : `${user}@${LOGIN_DOMAIN}`, password });
    if (error) throw new Error(/invalid login/i.test(error.message) ? 'Username or password is wrong' : error.message);
  } catch (e) { show(e.message || 'Couldn\'t sign in'); btn.disabled = false; }
}
async function startSession(s) {
  const was = session && session.user && session.user.id;
  session = s;
  if (!session) { resetState(); CAL.calendars = []; CAL.at = 0; CAL.days = {}; try { localStorage.removeItem(CACHE_KEY); localStorage.removeItem('hhq-cal'); } catch(e) {} render(); return; }
  if (was === session.user.id && channel) return;
  if (loadCache()) render();
  try { await loadAll(); subscribe(); fetchCal(true); }
  catch (e) { offline = true; render(); }
}

/* ---------- events ---------- */
let toastTimer;
function toast(msg) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2400); }
document.addEventListener('click', async e => {
  const tabBtn = e.target.closest('nav.tabs button'); if (tabBtn) { UI.tab = tabBtn.dataset.tab; keepUI(); render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a==='close') { if (e.target === el || el.tagName==='BUTTON') closeSheet(); return; }
  if (a==='delete') { if (el.dataset.confirm) { const fn = sheetDelete; closeSheet(); if (fn) { await fn(); toast('Deleted'); } } else { el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; } return; }
  if (a==='settings') return settingsForm();
  if (a==='tab') { UI.tab = el.dataset.v; if (el.dataset.who) UI.who = el.dataset.who; if (el.dataset.seg) { if (UI.tab==='money') UI.money = el.dataset.seg; else UI.carSeg = el.dataset.seg; } keepUI(); render(); window.scrollTo(0,0); return; }
  if (a==='who') { UI.who = el.dataset.who; keepUI(); return render(); }
  if (a==='hday') { UI.hday = el.dataset.date; return render(); }
  if (a==='cal') { UI.cal = ymOf(addMonths(`${UI.cal}-01`, Number(el.dataset.v))); return render(); }
  if (a==='bm') { UI.bmonth = ymOf(addMonths(`${UI.bmonth}-01`, Number(el.dataset.v))); return render(); }
  if (a==='mseg') { UI.money = el.dataset.v; keepUI(); return render(); }
  if (a==='cseg') { UI.carSeg = el.dataset.v; keepUI(); return render(); }
  if (a==='day') return dayForm(el.dataset.date);
  if (a==='bill') return billForm(el.dataset.id);
  if (a==='spend') return spendForm(el.dataset.id);
  if (a==='cats') return catsForm();
  if (a==='goal') return goalForm(el.dataset.id);
  if (a==='service') return serviceForm(el.dataset.id);
  if (a==='fuel') return fuelForm(el.dataset.id);
  if (a==='mileage') return mileageForm();
  if (a==='calset') { closeSheet(); return calForm(); }
  if (a==='vrates') { closeSheet(); return vikiRatesForm(); }
  if (a==='vcopy') { const txt = claimText(UI.cal); try { await navigator.clipboard.writeText(txt); toast('Claim copied'); } catch(err) { toast('Couldn\'t copy on this phone'); } return; }
  if (a==='signout') { closeSheet(); await sb.auth.signOut(); return; }
  if (a==='fillweek') {
    const ym = UI.cal; const first = parse(`${ym}-01`); const n = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate(); let c = 0;
    el.disabled = true;
    for (let d=1; d<=n; d++) { const date = `${ym}-${pad(d)}`; if (isWeekend(date) || date > today() || dayRec('chris', date)) continue; await put(`days/chris_${date}`, {who:'chris', date, status:'work'}); c++; }
    toast(c ? `Marked ${c} weekdays as work` : 'No empty weekdays to fill'); return;
  }
  if (a==='checkdone') {
    const done = {...(S.checks.done||{})}; done[el.dataset.id] = { date: today(), ...(S.car.mileage ? {mileage: Number(S.car.mileage)} : {}) };
    await put('state/checks', { done }); toast('Logged as done today'); return;
  }
});
document.addEventListener('change', async e => {
  const el = e.target; if (el.dataset.act !== 'trip') return;
  const done = {...(S.trip.done||{})}; if (el.checked) done[el.dataset.id] = true; else delete done[el.dataset.id];
  await put('state/trip', { done });
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'authForm') { e.preventDefault(); return handleAuth(e.target); }
  if (e.target.id !== 'sheetForm') return; e.preventDefault();
  const fn = sheetSave; if (!fn) return;
  const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
  try { await fn(); closeSheet(); toast('Saved'); } catch (err) { formErr(err.message || 'Couldn\'t save that'); btn.disabled = false; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheetRoot').innerHTML) closeSheet(); });

/* ---------- boot ---------- */
async function boot() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#app').innerHTML = '<div class="panel"><p class="empty">Couldn\'t load the app. Check your connection and reopen it.</p></div>'; return;
  }
  if (CAL.calendars && CAL.calendars.length) { try { deriveDays(); } catch(e) {} }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  const { data } = await sb.auth.getSession();
  await startSession(data.session);
  sb.auth.onAuthStateChange((event, s) => { if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') startSession(s); else session = s || session; });
  window.addEventListener('online', () => { if (session && offline) loadAll().then(subscribe).catch(() => {}); });
}
boot();
})();
</script>
